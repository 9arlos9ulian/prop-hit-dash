    <div class="sec-h" style="margin-top:20px"><h2>The arm</h2><p>${esc(b.pit||'TBD')} · ${esc(b.pitHand||'?')}HP · ${esc(b.pRole||'SP')} — read green as good for the hitter, not for the pitcher.</p></div>
    <div style="padding:2px 0 0">
      <div class="sgrid">
        ${scell('Grade',        esc(b.pGrade||'—'),`rating ${b.pRating??'—'}`,'pRating',b.pRating)}

        ${scell('WHIP',         num(b.pWhip,2), 'baserunners',              'pWhip',  b.pWhip)}
        ${scell('H / 9',        num(b.pH9,1),   'hits allowed',             'pH9',    b.pH9)}
        ${scell('CSW',          pct(b.pCsw,1),  'called+whiff',             'pCsw',   b.pCsw)}
        ${scell('Hard-hit',     pct(b.pHard,1), 'allowed',                  'pHard',  b.pHard)}
        ${scell('K / 9',        num(b.pK9,1),   `BB/9 ${num(b.pBb9,1)}`,    'pK9',    b.pK9)}
        ${scell('Batters faced',num(b.pAvgBf,1),'per start',                'pAvgBf', b.pAvgBf)}
      </div>
      ${b.useFb!=null?`<div style="margin-top:12px">
        <div class="slab" style="margin-bottom:6px">Pitch mix vs his production against it</div>
        ${[['Fastball',b.useFb,b.hrFb],['Breaking',b.useBb,b.hrBb],['Offspeed',b.useOs,b.hrOs]].map(([l,u,h])=>
          `<div class="wfrow"><span class="muted">${l}</span>
            <span class="wfbar"><i style="left:0;width:${clamp(u??0,0,1)*100}%;background:var(--s2)"></i></span>
            <span class="wfval">${pct(u,0)}</span></div>
           <div class="wfrow" style="padding-top:0"><span class="muted" style="font-size:11px;padding-left:8px">reaches base</span>
            <span class="wfbar" style="height:5px"><i style="left:0;width:${clamp((h??0)/.5,0,1)*100}%;background:${(h??0)>(b.hrAll??0)?'var(--acc)':'var(--line2)'}"></i></span>
            <span class="wfval" style="font-size:11px">${pct(h,1)}</span></div>`).join('')}
        <p class="muted" style="font-size:11.5px;margin:4px 0 0">Overall he reaches base ${pct(b.hrAll,1)} of the time.</p>
      </div>`:''}
      ${log?`<div style="margin-top:12px"><div class="slab" style="margin-bottom:6px">His last ${log.length} outings</div>
        <div class="tblwrap" style="box-shadow:none"><table><thead><tr><th>Date</th><th class="r">IP</th><th class="r">H</th><th class="r">R</th><th class="r">BB</th><th class="r">K</th></tr></thead>
        <tbody>${log.slice(0,5).map(g=>`<tr style="cursor:default"><td class="num">${esc(g.date)}</td><td class="r num">${esc(g.ip)}</td>
          <td class="r num">${g.h}</td><td class="r num">${g.r}</td><td class="r num">${g.bb}</td><td class="r num">${g.k}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    </div>

    <div style="display:flex;gap:8px;margin:20px 0 30px">
      <button class="field" id="dstar" style="flex:1;justify-content:center;font-weight:560;${starred?'background:var(--acc);border-color:var(--acc);color:var(--acc-on)':''}">
        ${starred?'★ On your watchlist':'☆ Add to watchlist'}
      </button>
    </div>
  </div>`;

  animateNumbers();
  $('#dclose').onclick=closeDrawer;
  $('#dprev').onclick=()=>stepDrawer(-1);
  $('#dnext').onclick=()=>stepDrawer(1);
  $('#dstar').onclick=()=>toggleStar(key(b), b.name);   // same path as every row star
}

/* ══════════════════════════════════════════════════════════════════════
   9 · shell + events
   ══════════════════════════════════════════════════════════════════════ */
/** The legacy dashboard was retired 2026-07-26 (screenshots in
    docs/legacy-screenshots/, code in git history); its bet slip, Kalshi
    odds and parlay EV went with it. Watch is this dashboard's answer to
    the slip: a list you build by starring rows, not a stake-and-payout
    ledger. */
function renderFooter(){
  $('#foot').innerHTML =
    `<span>Mochi · scores are calibrated probabilities, not betting advice.</span>`;
}
/** Human label for an archive date. Tomorrow's file is a --preview-tomorrow
    run on ESTIMATED lineups, so it gets said out loud rather than looking
    like another settled day. */
function dateLabel(d, long){
  const today = TODAY();
  if(d === today) return 'Tonight';
  const dt = new Date(d+'T12:00:00');
  const s = dt.toLocaleDateString([], long ? {weekday:'long',month:'long',day:'numeric'}
                                           : {weekday:'short',month:'short',day:'numeric'});
  // the long form is used where the surrounding sentence already says it's a
  // preview, so only the compact picker label carries the suffix
  return (d > today && !long) ? s+' · preview' : s;
}
function renderDateSel(){
  const sel = $('#dsel'), today = TODAY();
  if(!sel) return;
  // Nothing to pick between → no control at all. This is the mirror's normal
  // state when slates_index.json hasn't shipped yet, and an empty dropdown
  // reads as broken.
  const dates = S.dates.filter(d=>d!==today);
  if(!dates.length){ sel.hidden = true; return; }
  sel.hidden = false;
  sel.classList.toggle('past', !!S.date);
  sel.innerHTML = `<option value="">Tonight</option>` +
    dates.map(d=>`<option value="${d}" ${S.date===d?'selected':''}>${esc(dateLabel(d))}</option>`).join('');
  sel.value = S.date;
}
/** Shown on every view while an archive is loaded — the board otherwise looks
    exactly like tonight, which is how you end up reading Tuesday as today. */
function dateBar(){
  if(!S.date) return '';
  const future = S.date > TODAY();
  return `<div class="datebar">
    <span>${future?'Previewing':'Viewing'} <b>${esc(dateLabel(S.date,true))}</b>${
      future ? ' — estimated lineups, not final' : ' — a finished slate, scores frozen as of first pitch'}</span>
    <button class="lnk" id="dback">Back to tonight →</button>
  </div>`;
}
function renderNav(){
  $('#nav').innerHTML = VIEWS.map(v=>`<button data-go="${v.id}" ${S.view===v.id?'aria-current="page"':''}>${v.label}</button>`).join('');
  $('#tabbar').innerHTML = VIEWS.map(v=>`<button data-go="${v.id}" ${S.view===v.id?'aria-current="page"':''}>${icon(ICONS[v.icon])}<span>${v.label}</span></button>`).join('');
}
/** Count a figure up to its value. Only in Aurora, only when the reader has
    not asked for reduced motion — and it animates the text node in place so
    the trailing "%" span is left alone. */
function countUp(el, target, dur){
  const node = el.firstChild;
  if(!node || node.nodeType !== 3) return;
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now-t0)/dur), e = 1-Math.pow(1-k,3);
    node.nodeValue = String(Math.round(target*e));   // dial digits are integers
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}
function animateNumbers(){
  if(document.documentElement.dataset.theme !== 'aurora') return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  /* requestAnimationFrame does not fire in a background tab, so a page that
     loaded while hidden was left showing the 0 the animation starts from —
     the headline score, permanently wrong, until something re-rendered. The
     animation is decoration; the number is not. Skip it and keep the value.
     Open dials only (`.anim`), and only the hero's and the drawer's — 270
     row dials counting up at once is noise, not an entrance. */
  if(document.hidden) return;
  $$('.bcard.hero .dv.anim, #drawer .dv.anim').forEach(el=>{
    const v = parseFloat(el.firstChild && el.firstChild.nodeValue);
    if(isNaN(v)) return;
    el.firstChild.nodeValue = '0';
    countUp(el, v, 950);
  });
}

/** ── the page takes tonight's colour ────────────────────────────────────
    Today's background gradients are keyed to the club of the slate's
    top-ranked batter, so the home page looks different on a night the best
    bat is a Reds one than on a night it is a Dodgers one. It is decoration
    with a fact underneath: the hue is the same one the hero's dial is
    wearing, six inches above, which is what keeps it from reading as a
    random theme change.

    --slate-tc is set on <html> rather than on an element, because the
    gradient lives on body::before and a fixed-position pseudo-element cannot
    inherit from anything inside #main. Cleared off Today so the other views
    keep the theme's own palette — a page ABOUT one batter can wear his club,
    a page about 30 lineups cannot. */
function paintSlateHue(){
  const r=document.documentElement;
  const top = S.view==='today' && S.batters.length
    ? [...S.batters].sort((a,b)=>b.p-a.p)[0] : null;
  const t = top && String(top.team||'').toUpperCase();
  if(t && getComputedStyle(r).getPropertyValue('--tb-'+t)) r.style.setProperty('--slate-tc', `var(--tb-${t})`);
  else r.style.removeProperty('--slate-tc');
}
function render(){
  renderNav();
  renderFooter();
  renderDateSel();
  const m=$('#main');
  try{
    m.innerHTML = dateBar() + (
                  S.view==='today'   ? viewToday()
                : S.view==='batters' ? viewBatters()
                : S.view==='teams'   ? viewTeams()
                : S.view==='watch'   ? viewWatch()
                : viewHonesty());
  }catch(e){
    m.innerHTML=`<div class="empty">Something went wrong rendering this view.<br><span class="num" style="font-size:11px">${esc(e.message)}</span></div>`;
    console.error(e);
  }
  applyResponsiveTable();
  paintSlateHue();
  wireView();
  animateNumbers();
  // a just-landed mark pops exactly once: the class was baked into this
  // paint, and clearing the set here keeps the next render from replaying it
  S._justHit?.clear();
}
/** Desktop gets the dense table; phones get the card list. Never a squeezed table.
    The threshold is 1120 rather than 900 because the table declares 1040px of
    column widths — below that the last columns were being clipped by the wrap
    rather than falling back to cards. */
function applyResponsiveTable(){
  const t=$('#tbl'), c=$('#cards');
  if(!t||!c) return;
  const wide = window.innerWidth>=1120;
  t.style.display = wide?'block':'none';
  c.style.display = wide?'none':'grid';
}
/* ── swipe-left to watch (phone) ────────────────────────────────────────
   Delegated on #main once, not re-bound per render, because the list is
   rebuilt wholesale on every star toggle. Three rules keep a horizontal
   gesture from fighting a vertical list:
     1. The axis is LOCKED on the first move that clears 6px and never
        reverts, so a diagonal thumb-flick down the page scrolls and does not
        drag a row halfway open.
     2. preventDefault fires only on an x-locked move — calling it on every
        touchmove would kill scrolling outright.
     3. A completed drag stamps `swipedAt`, and the card's click handler
        ignores clicks for 400ms after: on iOS a drag that starts on a
        <button> still delivers a click, which would open the drawer of the
        row you just starred. */
const SWIPE_MAX = 76, SWIPE_ARM = 44;
let swipedAt = 0;
function initSwipe(){
  const main = $('#main');
  const phone = () => matchMedia('(max-width:600px)').matches;
  let sw = null;
  const end = () => {
    if(!sw) return;
    const {row, dx} = sw; sw = null;
    row.classList.remove('swiping');
    row.style.removeProperty('--sx');
    row.style.removeProperty('--sp');
    if(dx <= -SWIPE_ARM){
      swipedAt = Date.now();
      const st = row.querySelector('[data-star]');
      if(st) toggleStar(st.dataset.star, st.dataset.name);   // re-renders the list
    } else if(dx < 0) swipedAt = Date.now();
    row.classList.remove('armed');
  };
  main.addEventListener('touchstart', e=>{
    if(!phone() || e.touches.length>1) return;
    const row = e.target.closest('.brow'); if(!row) return;
    sw = {row, x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, axis:null, armed:false};
  }, {passive:true});
  main.addEventListener('touchmove', e=>{
    if(!sw) return;
    const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
    if(sw.axis===null){
      if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
      sw.axis = Math.abs(dx) > Math.abs(dy)+3 ? 'x' : 'y';
      if(sw.axis==='x') sw.row.classList.add('swiping');
      else { sw = null; return; }
    }
    e.preventDefault();
    /* Past the commit point the row keeps moving at 35% of the finger, so the
       threshold is felt as a DETENT and not only seen as a colour change —
       the drag going heavy is the same information the ring is drawing, in
       the channel the thumb is already paying attention to. */
    const pull = Math.max(0, -dx);
    sw.dx = -Math.min(SWIPE_MAX, pull<=SWIPE_ARM ? pull : SWIPE_ARM + (pull-SWIPE_ARM)*.35);
    sw.row.style.setProperty('--sx', sw.dx.toFixed(1)+'px');
    sw.row.style.setProperty('--sp', Math.min(1, pull/SWIPE_ARM).toFixed(3));
    const armed = pull >= SWIPE_ARM;
    if(armed !== sw.armed){
      sw.armed = armed;
      sw.row.classList.toggle('armed', armed);
      // Android/Chrome only — iOS Safari has no Vibration API, so the ring and
      // the detent have to carry this on a phone. Never fires on release.
      if(armed) navigator.vibrate?.(12);
    }
  }, {passive:false});
  main.addEventListener('touchend', end, {passive:true});
  main.addEventListener('touchcancel', end, {passive:true});
}

/* ── swipe the drawer to change batter ──────────────────────────────────
   Under 760px the drawer is a full-height sheet, and paging it sideways is
   the idiom that shape already implies. The ‹ › buttons stay: a gesture is
   never the only way to do something here, and they are also the only path
   a keyboard has.

   Swipe LEFT for the next batter — the content travels the way your finger
   does, the same direction a page turns.

   Three things it must not do. It must not steal a vertical scroll, so the
   axis is locked on the first committed movement and a vertical gesture
   hands the drawer back to its own scrolling. It must not steal a sideways
   drag from a table that can actually scroll — the drawer holds several with
   overflow-x:auto — so a gesture starting inside one that has somewhere to
   go is left alone. And it must not page past either end, so the last batter
   pulls at a quarter weight and springs back rather than going nowhere in
   silence.

   Listeners sit on #drawer itself, which renderDrawer() refills but never
   replaces, so they survive every batter change without rebinding. */
/* ── global search ──────────────────────────────────────────────────────
   One field that answers across views instead of inside one. Each existing
   filter row only searches its own tab — the Batters field cannot find a
   lineup, the Teams field cannot open a batter — so on a phone, where the
   nav is a tab bar and switching costs a trip, "where is this player" took
   knowing which tab held him first.

   Four kinds of answer, in the order a slate is usually read: a BATTER
   opens his drawer where he stands; a PITCHER routes to Batters filtered to
   the arm, which is the list of everyone facing him tonight; a TAG routes to
   Batters filtered to everyone carrying that chip; a CLUB routes to Teams
   filtered to its lineup. The routing is the point — the result is not a
   link to a view, it is the question already answered.

   Matching is prefix-first: a query that starts a word outranks one that
   merely appears inside it, so "mar" puts Marte above Mangum-adjacent noise
   rather than ordering by whatever the slate happened to sort by. */
function qsMatches(q){
  q=q.trim().toLowerCase();
  if(q.length<2) return null;
  const starts=(t)=>{ t=String(t||'').toLowerCase();
    return t.startsWith(q) || t.split(/[\s.\-']+/).some(w=>w.startsWith(q)); };
  const has=(t)=>String(t||'').toLowerCase().includes(q);
  const rank=(t)=>starts(t)?0:1;
  const batters=S.batters.filter(b=>has(b.name))
    .sort((a,b)=>rank(a.name)-rank(b.name) || b.p-a.p).slice(0,6);
  const pitSeen=new Map();
  for(const b of S.batters){
    if(!b.pit || !has(b.pit) || pitSeen.has(b.pit)) continue;
    pitSeen.set(b.pit, {name:b.pit, team:b.matchup||'', n:S.batters.filter(x=>x.pit===b.pit).length});
  }
  const pitchers=[...pitSeen.values()].sort((a,b)=>rank(a.name)-rank(b.name)).slice(0,4);
  const teamSeen=new Map();
  for(const b of S.batters){
    if(!b.team || !has(b.team) || teamSeen.has(b.team)) continue;
    teamSeen.set(b.team, {team:b.team, n:S.batters.filter(x=>x.team===b.team).length});
  }
  const teams=[...teamSeen.values()].sort((a,b)=>rank(a.team)-rank(b.team)).slice(0,4);
  /* A fourth kind of answer, and the only one that is not a name: a TAG is a
     question about the field rather than about a player ("who is facing a
     beatable arm"), so the result is a phrase and a count, and picking it
     hands the phrase to the Batters filter — which matches tags too — rather
     than opening anything. Ordered by how many bats carry it, because the
     count is the answer's size. */
  const tagSeen=new Map();
  for(const b of S.batters) for(const t of tagsOf(b).list){
    if(has(t)) tagSeen.set(t, (tagSeen.get(t)||0)+1);
  }
  const tags=[...tagSeen.entries()].map(([tag,n])=>({tag,n}))
    .sort((a,b)=>rank(a.tag)-rank(b.tag) || b.n-a.n).slice(0,5);
  return {q, batters, pitchers, tags, teams,
          total:batters.length+pitchers.length+tags.length+teams.length};
}
function qsClose(){
  const r=$('#qsres'); if(r) r.hidden=true;
  const i=$('#qsq'); if(i) i.setAttribute('aria-expanded','false');
  document.body.style.overflow='';
}
function qsRender(){
  const inp=$('#qsq'), res=$('#qsres'); if(!inp||!res) return;
  const m=qsMatches(inp.value);
  if(!m){ qsClose(); return; }
  const hl=t=>{ const i=String(t).toLowerCase().indexOf(m.q); if(i<0) return esc(t);
    return esc(String(t).slice(0,i))+'<mark>'+esc(String(t).slice(i,i+m.q.length))+'</mark>'+esc(String(t).slice(i+m.q.length)); };
  let h='';
  if(m.batters.length) h+=`<div class="qsh">Batters</div>`+m.batters.map(b=>
    `<button class="qsitem" role="option" data-qsb="${esc(key(b))}">
      <span class="qsn">${hl(b.name)}</span>
      <span class="qsm">${esc(b.team)} · ${Math.round(b.p*100)}</span></button>`).join('');
  if(m.pitchers.length) h+=`<div class="qsh">Pitchers</div>`+m.pitchers.map(p=>
    `<button class="qsitem" role="option" data-qsp="${esc(p.name)}">
      <span class="qsn">${hl(p.name)}</span>
      <span class="qsm">${p.n} bats</span></button>`).join('');
  if(m.tags.length) h+=`<div class="qsh">Tags</div>`+m.tags.map(t=>
    `<button class="qsitem" role="option" data-qstag="${esc(t.tag)}">
      <span class="qsn">${hl(t.tag)}</span>
      <span class="qsm">${t.n} bat${t.n===1?'':'s'}</span></button>`).join('');
  if(m.teams.length) h+=`<div class="qsh">Lineups</div>`+m.teams.map(t=>
    `<button class="qsitem" role="option" data-qst="${esc(t.team)}">
      <span class="qsn">${hl(t.team)}</span>
      <span class="qsm">${t.n} bats</span></button>`).join('');
  if(!m.total) h=`<div class="qsempty">Nothing on tonight's slate matches “${esc(m.q)}”.</div>`;
  res.innerHTML=h;
  res.hidden=false;
  inp.setAttribute('aria-expanded','true');
  document.body.style.overflow='hidden';
}
function initGlobalSearch(){
  const inp=$('#qsq'), res=$('#qsres'), bar=$('.hbar'), wrap=$('#qswrap'), x=$('#qsx');
  if(!inp||!res||!bar) return;
  const open=on=>{ bar.classList.toggle('qson', on); if(!on){ inp.value=''; qsClose(); } };
  /* The collapsed field is 32px of icon with a zero-width input inside it, so
     the tap has to be caught on the wrapper and handed to the input — tapping
     "the magnifier" must not depend on hitting a control that is not there
     yet. Pointerdown rather than click: on iOS a click that lands while the
     element is still growing can miss it. */
  wrap.addEventListener('pointerdown', e=>{
    if(bar.classList.contains('qson') || e.target.closest('#qsx')) return;
    e.preventDefault(); open(true); inp.focus();
  });
  x.addEventListener('click', e=>{ e.preventDefault(); open(false); inp.blur(); });
  inp.addEventListener('input', qsRender);
  inp.addEventListener('focus', ()=>{ open(true); qsRender(); });
  /* Collapse on blur only when nothing was typed. Blur also fires when the
     finger lands on a RESULT, and closing there would unmount the row before
     its click resolved — so a query keeps the field open and the result
     handler is what closes it. */
  inp.addEventListener('blur', ()=>{ if(!inp.value.trim()) setTimeout(()=>open(false),120); });
  inp.addEventListener('keydown', e=>{ if(e.key==='Escape'){ open(false); inp.blur(); } });
  res.addEventListener('click', e=>{
    const el=e.target.closest('.qsitem'); if(!el) return;
    inp.value=''; inp.blur(); qsClose(); $('.hbar')?.classList.remove('qson');
    if(el.dataset.qsb!=null){
      /* opened against the whole slate by score, so the drawer's ‹ › and its
         swipe still page through a real ranking rather than a search result
         set that stops after six */
      openDrawer(el.dataset.qsb, [...S.batters].sort((a,b)=>b.p-a.p));
    } else if(el.dataset.qsp!=null){
      S.filters={...S.filters, q:el.dataset.qsp, team:'', game:'', slot:''};
      go('batters');
    } else if(el.dataset.qstag!=null){
      S.filters={...S.filters, q:el.dataset.qstag, team:'', game:'', slot:''};
      go('batters');
    } else if(el.dataset.qst!=null){
      S.lq=el.dataset.qst; go('teams');
    }
  });
}

function initDrawerSwipe(){
  const d=$('#drawer');
  const sheet=()=>matchMedia('(max-width:759px)').matches;
  const ARM=58, MAX=104;
  let g=null;
  const pane=()=>d.querySelector('.dbody');
  /* a scrollable-x ancestor owns the gesture, but only while it still has
     room to move in the direction being dragged */
  const ownsX=(el,dir)=>{
    for(let n=el; n && n!==d; n=n.parentElement){
      if(n.scrollWidth>n.clientWidth+1 && /auto|scroll/.test(getComputedStyle(n).overflowX)){
        const room = dir<0 ? n.scrollWidth-n.clientWidth-n.scrollLeft : n.scrollLeft;
        if(room>1) return true;
      }
    }
    return false;
  };
  const paint=x=>{ const p=pane(); if(p) p.style.transform = x ? `translateX(${x.toFixed(1)}px)` : ''; };
  const reset=()=>{ const p=pane(); if(p){ p.style.transition=''; p.style.transform=''; } g=null; };
  d.addEventListener('touchstart', e=>{
    if(d.hidden || !sheet() || e.touches.length>1) return;
    if(!S.drawerList || S.drawerList.length<2) return;
    g={x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, axis:null, commit:false, target:e.target};
  }, {passive:true});
  d.addEventListener('touchmove', e=>{
    if(!g) return;
    const dx=e.touches[0].clientX-g.x, dy=e.touches[0].clientY-g.y;
    if(g.axis===null){
      if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
      // vertical, or a table with somewhere left to scroll: not ours
      if(Math.abs(dx)<=Math.abs(dy)+4 || ownsX(g.target, dx)){ g=null; return; }
      g.axis='x';
      const p=pane(); if(p) p.style.transition='none';
    }
    e.preventDefault();
    const end = (dx>0 && S.drawerIdx<=0) || (dx<0 && S.drawerIdx>=S.drawerList.length-1);
    const pull=Math.abs(dx);
    const eased = pull<=ARM ? pull : ARM+(pull-ARM)*.35;
    g.commit = !end && pull>=ARM;
    g.dx = Math.sign(dx) * Math.min(MAX, end ? pull*.25 : eased);
    paint(g.dx);
  }, {passive:false});
  const release=()=>{
    if(!g) return;
    if(g.axis!=='x'){ g=null; return; }
    const commit=g.commit, dir=g.dx<0?1:-1;
    const p=pane();
    if(commit){ reset(); stepDrawer(dir); return; }
    if(p) p.style.transition='transform .18s ease';
    paint(0);
    const t=setTimeout(reset,200); g=null; void t;
  };
  d.addEventListener('touchend', release, {passive:true});
  d.addEventListener('touchcancel', release, {passive:true});
}

function wireView(){
  $$('[data-k]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    if(Date.now()-swipedAt < 400) return;   // that click is the tail of a swipe
    const list = S.view==='batters' ? filtered() : S.view==='watch'
      ? S.batters.filter(b=>S.stars.includes(key(b))).sort((a,b)=>b.p-a.p)
      : [...S.batters].sort((a,b)=>b.p-a.p);
    openDrawer(el.dataset.k, list);
  }));
  $$('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  const mb=$('#morebat'); if(mb) mb.addEventListener('click',()=>{ S.batShowAll=true; render(); });
  const mw=$('#morewatch'); if(mw) mw.addEventListener('click',()=>{ S.watchShowAll=true; render(); });
  const back=$('#dback'); if(back) back.addEventListener('click',()=>goDate(''));
  $$('[data-star]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();          // a table star sits INSIDE tr[data-k]
    toggleStar(el.dataset.star, el.dataset.name);
  }));
  $$('.psel').forEach(sel=>{
    sel.addEventListener('click',e=>e.stopPropagation());   // never open the drawer behind it
    sel.addEventListener('change',()=>setPreview(sel.dataset.pk, sel.dataset.team, sel.value));
  });
  const q=$('#fq');
  if(q){
    q.addEventListener('input',()=>{ S.filters.q=q.value; const s=q.selectionStart; render(); const n=$('#fq'); if(n){n.focus(); n.setSelectionRange(s,s);} });
  }
  const lq=$('#lq');
  if(lq){
    lq.addEventListener('input',()=>{ S.lq=lq.value; const s=lq.selectionStart; render(); const n=$('#lq'); if(n){n.focus(); n.setSelectionRange(s,s);} });
  }
  const bind=(id,k)=>{ const el=$(id); if(el) el.addEventListener('change',()=>{ S.filters[k]=el.value; render(); }); };
  bind('#fteam','team'); bind('#fgame','game'); bind('#fslot','slot');
  $$('[data-lu]').forEach(el=>el.addEventListener('click',()=>{ S.filters.lineup=el.dataset.lu; render(); }));
  $$('[data-lsort]').forEach(el=>el.addEventListener('click',()=>{
    S.lsort=el.dataset.lsort; store.set('lsort',S.lsort); render();
  }));
  $$('th.sortable').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.sort;
    if(S.filters.sort===k) S.filters.dir*=-1; else { S.filters.sort=k; S.filters.dir=-1; }
    render();
  }));
}
/** #games was the tab's name until 2026-07-26 and is in whatever bookmarks and
    shared links already exist, so it keeps resolving. */
const VIEW_ALIAS = {games:'teams'};
const resolveView = v => VIEW_ALIAS[v] || v;
function go(v){ v=resolveView(v); if(!VIEWS.some(x=>x.id===v)) return; S.view=v; S.batShowAll=false; S.watchShowAll=false; location.hash=v; window.scrollTo(0,0); render(); }

/* theme — Dugout (auto/light/dark), the legacy dashboard's own palette, plus
   Aurora. The ids `light`/`dark` are load-bearing: applyTheme('auto') writes
   one of those two names onto the root, so they cannot be renamed. */
const THEMES = [
  {id:'auto',  name:'Auto'},
  {id:'light', name:'Dugout light'},
  {id:'dark',  name:'Dugout dark'},
  {id:'aurora', name:'Aurora'}
];
function applyTheme(t){
  const sys = matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = t==='auto' ? (sys?'dark':'light') : t;
}
document.head.insertAdjacentHTML('beforeend', `<style id="teamcss">${teamCSS()}</style>`);
let theme = store.get('theme','aurora'); applyTheme(theme);   // Aurora is the default
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(theme==='auto') applyTheme('auto'); });

/* global events */
$('#scrim').onclick=closeDrawer;
$('#btnTheme').onclick=()=>{
  const i = THEMES.findIndex(t=>t.id===theme);
  const next = THEMES[(i+1) % THEMES.length];
  theme = next.id; store.set('theme',theme); applyTheme(theme);
  toast(next.id==='auto' ? `Auto — ${document.documentElement.dataset.theme}` : next.name);
};
$('#btnStar').onclick=()=>go('watch');
$('#dsel').onchange=e=>goDate(e.target.value);
$('#btnReload').onclick=async()=>{ delete once.cal; toast('Reloading…'); await boot(true); };
window.addEventListener('resize',applyResponsiveTable);
/* batterCard decides how many chips to print from window.innerWidth, so a
   card built on a desktop keeps three chips after a rotation into phone
   width unless the list is rebuilt. Only on an actual breakpoint CROSS —
   re-rendering 270 rows on every pixel of a desktop drag is not free. */
{ const mq = matchMedia('(max-width:600px)');
  const onCross = () => { render(); if(!$('#drawer').hidden) renderDrawer(); };
  mq.addEventListener ? mq.addEventListener('change',onCross) : mq.addListener(onCross); }
window.addEventListener('hashchange',()=>{ const h=resolveView(location.hash.slice(1)); if(h&&h!==S.view) go(h); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !$('#drawer').hidden) return closeDrawer();
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(!$('#drawer').hidden){
    if(e.key==='ArrowRight'||e.key==='j') stepDrawer(1);
    if(e.key==='ArrowLeft' ||e.key==='k') stepDrawer(-1);
    return;
  }
  if(e.key==='/'){ e.preventDefault(); go('batters'); setTimeout(()=>$('#fq')?.focus(),40); }
  const i=+e.key; if(i>=1&&i<=5) go(VIEWS[i-1].id);
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleLive(); });

/* ══════════════════════════════════════════════════════════════════════
   10 · boot
   ══════════════════════════════════════════════════════════════════════ */
async function boot(force){
  if(force){ for(const k in once) delete once[k]; }
  const h=resolveView(location.hash.slice(1)); if(VIEWS.some(v=>v.id===h)) S.view=h;
  try{
    await loadSlate();
  }catch(e){
    $('#main').innerHTML=`<div class="empty">Couldn't load tonight's slate.<br>
      <span style="font-size:12.5px">${esc(e.message)}</span></div>`;
    return;
  }
  render();
  // everything below is an enhancement: the page is already useful without it
  loadDates().then(renderDateSel);
  loadLive().then(()=>{ render(); scheduleLive(); });
  loadJSON('pitcher_recent_games.json').then(d=>{ S.pitcherLog=d; if(!$('#drawer').hidden) renderDrawer(); });
  loadJSON('bullpen_preview.json').then(d=>{ S.bullpen=d; if(S.view==='teams') render(); });
  calibration().then(c=>{ S.cal=c; render(); }).catch(()=>{ /* mirror may not ship picks_log */ });
}
initSwipe();   // delegated on #main, which outlives every render
initDrawerSwipe();   // delegated on #drawer, which renderDrawer() refills but never replaces
initGlobalSearch();  // header field + results sheet, both outside #main
boot();
</script>
