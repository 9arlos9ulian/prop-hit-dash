    }catch(e){ /* one game failing must not cost the rest */ }
  }));
  // News is a transition observed on the SAME slate we last looked at — the
  // first pass of a session (or of a freshly reloaded slate) is baseline, so
  // opening the page at 10pm does not pop-and-toast four hours of history.
  const news = hitsPrimed && hitsSlate===S.batters;
  const landed = [];
  for(const b of S.batters){
    const m = hitsCache[b.gamePk]; if(!m) continue;
    if(m[String(b.batterId).replace(/\.0$/,'')] && !b.hasHit){ b.hasHit = true; landed.push(b); }
  }
  hitsPrimed = true; hitsSlate = S.batters;
  if(landed.length && news){
    (S._justHit ??= new Set());
    landed.forEach(b=>S._justHit.add(key(b)));
    const starred = landed.filter(isStarred);
    if(starred.length) toast(`✓ ${starred.map(b=>b.name).join(' · ')} — hit`, 3200);
  }
}
/** Finished-game log — the outcome side of the drawer's pre-game case.
    Fetched once per gamePk, on drawer open only (a slate can hold 15 games;
    fetching all of them up front to decorate rows nobody opens is waste).
    Keyed by gamePk, never batter — doubleheaders share every other field.
    Works on archives and the public mirror alike: statsapi boxscores are
    historical and the call is client-side, same host as the live ticker. */
async function loadGameLog(pk){
  if(S.gamelog[pk]) return S.gamelog[pk];
  S.gamelog[pk] = {status:'loading'};
  try{
    const [bx, pbp] = await Promise.all([
      get(`https://statsapi.mlb.com/api/v1/game/${pk}/boxscore`,{json:true,timeout:12000}),
      get(`https://statsapi.mlb.com/api/v1/game/${pk}/playByPlay`,{json:true,timeout:12000})
    ]);
    const players={};
    for(const side of ['away','home']){
      const ps=bx.body.teams?.[side]?.players||{};
      for(const k in ps){
        const st=ps[k].stats?.batting;
        if(st && st.plateAppearances>0) players[String(ps[k].person.id)]={
          ab:st.atBats, h:st.hits, r:st.runs, rbi:st.rbi, bb:st.baseOnBalls,
          k:st.strikeOuts, hr:st.homeRuns, d2:st.doubles, d3:st.triples, pas:[]
        };
      }
    }
    for(const pl of (pbp.body.allPlays||[])){
      const p = players[String(pl.matchup?.batter?.id||'')];
      // isComplete skips half-inning-ending baserunning plays (CS, pickoffs)
      // that carry a batter matchup but are not that batter's plate appearance
      if(!p || !pl.result?.event || pl.about?.isComplete===false) continue;
      p.pas.push({ inn:pl.about?.inning, ev:pl.result.event,
        hit:/^(single|double|triple|home run)/i.test(pl.result.event),
        pit:pl.matchup?.pitcher?.fullName||'' });
    }
    S.gamelog[pk] = {status:'ok', players};
  }catch(e){ S.gamelog[pk] = {status:'err'}; }   // drawer degrades to pre-game view
  return S.gamelog[pk];
}
let liveTimer=null;
function scheduleLive(){
  clearTimeout(liveTimer);
  if(S.date) return;
  const anyLive = Object.values(S.live).some(g=>g.abstract==='Live') ||
                  S.batters.some(b=>(b.gameState||'').includes('Progress'));
  if(!anyLive) return;
  liveTimer = setTimeout(async()=>{ if(!document.hidden){ await loadLive(); render(); } scheduleLive(); }, 45000);
}

/* ══════════════════════════════════════════════════════════════════════
   6 · shared fragments
   ══════════════════════════════════════════════════════════════════════ */
/* ── watchlist ───────────────────────────────────────────────────────────
   Watch is this dashboard's answer to a bet slip: the set of batters you have
   decided to follow tonight. Starring used to require opening the drawer,
   which is a lot of taps to build a list of eight. Every row carries its own
   star now; the drawer's button stays for when you're already in there. */
const isStarred = b => S.stars.includes(key(b));
function toggleStar(k, name){
  const on = S.stars.includes(k);
  S.stars = on ? S.stars.filter(x=>x!==k) : S.stars.concat(k);
  store.set('stars', S.stars);
  toast(on ? `Removed ${name||'batter'}` : `Watching ${name||'batter'} · ${S.stars.length} on the list`);
  render();
  if(!$('#drawer').hidden) renderDrawer();
}
/** The star itself. Never nested inside .bcard — that element is a <button>,
    and a button inside a button is invalid and behaves unpredictably. It sits
    as a sibling, absolutely positioned over the row's right edge. */
function starBtn(b, cls=''){
  const on = isStarred(b);
  return `<button class="star${on?' on':''} ${cls}" data-star="${key(b)}" data-name="${esc(b.name)}"
    aria-pressed="${on}" aria-label="${on?'Remove':'Add'} ${esc(b.name)} ${on?'from':'to'} watchlist"
    title="${on?'On your watchlist':'Add to watchlist'}">${icon(ICONS.watch)}</button>`;
}

function meter(b){
  const s=S.st.p; if(!s) return '';
  const span=(s.max-s.min)||1;
  const w=clamp((b.p-s.min)/span,0,1)*100, med=clamp((s.med-s.min)/span,0,1)*100;
  /* A settled row keeps the bar — where the score sat in the field is still
     true — but drops the tier colour, because that colour is the FORECAST
     speaking and the forecast has been answered. See outcomeOf(). */
  const o = outcomeOf(b);
  return `<span class="meter ${o?'settled':tcls(b.p)}" role="img" aria-label="${pct(b.p,1)}, slate median ${pct(s.med,1)}"><i style="width:${w.toFixed(1)}%"></i><b style="left:${med.toFixed(1)}%"></b></span>`;
}
/** ── the dial — the score drawn as completeness ─────────────────────────
    One circle per batter, ONE hue: the better tonight's case, the more of
    the circle is filled, and a recorded hit floods the whole thing solid.
    Replaced the pct+meter pair on cards and the drawer's bare number
    (2026-07-27, client direction). The table keeps digits+meter — a data
    grid has no room for a circle.

    Inside-out: ring 1 is the meter bent round (faint track = tonight's
    slate span, arc = his score, notch = the median — same field semantics
    as the linear meter, so a near-closed circle means "top of the field",
    never "sure thing"); the thin whisker outside it spans base→final score,
    the matchup delta as an arc length — faint when the matchup TOOK score
    away; the outer ring is the L10 form strip in ten segments, oldest →
    newest ending at 12 o'clock. The core carries the two-digit score and
    nothing else — no rank, no team, no marks; the card already says those.

    Resolution, same rule as everywhere, said by colour alone: a hit eats
    the whole geometry (a solid green disc — the answer replaces the
    forecast), a miss drains every ring to ink. Tier hues retire on this
    element: quantity of green does the work the three colours did. */
function dialHTML(b){
  const f=S.st?.p; if(!f || b.p==null) return '';
  /* Drawn in a fixed 100-unit viewBox and scaled by CSS, so the rendered
     size is `--ds` and lives entirely in the stylesheet — one dial function,
     every size, and a media query can shrink it for a phone. (It used to
     take a px size and write --ds inline, which no media query could then
     override — that is why the phone kept the desktop's dials.)

     ONE stroke width for all three rings. Weight was doing a second job at
     the start — a thick score arc beside a thin form ring read as "the fat
     one matters" rather than as two facts — so emphasis is carried by RADIUS
     alone and the rings read as one instrument.

     THREE rings fit at uniform width only because the geometry gave up some
     stroke to pay for it: 7 units instead of 8.5, spaced 10.5 apart. That
     leaves a core hole of 35 units against digits set at .24em of --ds —
     about 29 units of glyph, an 18% margin that holds at every size in the
     .sdial table, down to the 46px tail row. This is the constraint that
     dropped the matchup ring the first time; it is why the digits are .24em
     and not .27em now. */
  const U=100, c=50, sw=7, rScore=42, rForm=31.5, rMatch=21;
  const P=(r,deg)=>{const a=(deg-90)*Math.PI/180; return [c+r*Math.cos(a), c+r*Math.sin(a)];};
  const A=(r,a0,a1)=>{ if(a1-a0>=359.9) a1=a0+359.9;
    const s=P(r,a0), e=P(r,a1);
    return `M${s[0].toFixed(1)} ${s[1].toFixed(1)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${e[0].toFixed(1)} ${e[1].toFixed(1)}`; };
  /* ── the scale the arcs are drawn on ──────────────────────────────────
     Tonight's own min/max, PADDED by 8% of the range at each end. Two things
     that domain has to do at once.

     It is slate-relative rather than 0–100 because that is what separates
     batters: p_hit lives in a narrow band (50–77% on this slate), so an
     absolute scale squeezes all 270 into 96 degrees and the top ten into 25,
     with 181 degrees filled on every dial and the top 82 unreachable. On
     tonight's own range those become 360 and 95. Nothing is lost — the digits
     in the core are the absolute number, and the slate span is printed in the
     ribbon.

     The padding is why the leader's ring no longer closes. On a bare min/max
     the top batter renders a complete circle EVERY night whether he is at 77%
     or 62%, which reads as "maxed out" rather than "first of 270", and the
     floor renders as an empty ring that looks like missing data. 8% costs
     about 8% of the discrimination and buys back both ends. */
  const PAD=.08, lo=f.min-(f.max-f.min)*PAD, hi=f.max+(f.max-f.min)*PAD;
  const span=v=>clamp((v-lo)/((hi-lo)||1),0,1)*360;
  const out=outcomeOf(b);
  /* The club's own colour, not a tier colour — the dial is the identity
     column, so the hue says WHOSE player this is and the amount of it says
     how good tonight's case is. --tc-* is the contrast-corrected step
     (4.5:1 on the current theme's background), which is what makes thirty
     brand hues survivable as thin arcs and legible under the core's digits.

     TWO states, not three. A hit used to flood the dial with a solid disc;
     it read well and it ate the rings, which are the reason this is a dial
     and not a badge. Now the geometry is always drawn and a settled row only
     changes whether it is lit. */
  const club = tc(b.team,'var(--ink2)');
  const col = out==='miss' ? 'var(--ink4)' : club;
  // Square stroke ends throughout — rounded caps smear into blobs at row
  // size, and the caps' extra length lies about the arc's true sweep.
  let svg=`<svg viewBox="0 0 ${U} ${U}" aria-hidden="true">`;
  // outer — the score across tonight's field, on its own span (not 0–100),
  // with the slate median notched on it
  svg+=`<path d="${A(rScore,0,359.9)}" stroke="var(--surf3)" stroke-width="${sw}" fill="none"/>`;
  svg+=`<path d="${A(rScore,0,span(b.p))}" stroke="${col}" stroke-width="${sw}" fill="none"/>`;
  const m0=P(rScore-sw*.62,span(f.med)), m1=P(rScore+sw*.62,span(f.med));
  svg+=`<line x1="${m0[0].toFixed(1)}" y1="${m0[1].toFixed(1)}" x2="${m1[0].toFixed(1)}" y2="${m1[1].toFixed(1)}" stroke="var(--ink2)" stroke-width="2" opacity=".75"/>`;
  // middle — the L10 strip in ten segments, oldest to newest
  const form=(b.last10||'').slice(-10).padStart(10,'0');
  for(let i=0;i<10;i++){
    svg+=`<path d="${A(rForm,i*36+4,(i+1)*36-4)}" stroke="${form[i]==='1'?col:'var(--surf3)'}" stroke-width="${sw}" fill="none"/>`;
  }
  /* inner — the matchup, as the arc between where his form alone put him and
     where tonight's opponent/park/slot leaves him. It rides the SAME field
     scale as the score ring, which is what makes the track under it honest
     and lets the two arcs be compared by eye: the inner arc's far end lands
     at the same angle as the outer arc's end. Its LENGTH is the delta.
     A gain is lit, a loss is left at track tone — the drawer prints the
     signed number, so this only has to say which way and roughly how much.
     Under ~2° there is nothing to see but a stroke cap lying about a sweep. */
  svg+=`<path d="${A(rMatch,0,359.9)}" stroke="var(--surf3)" stroke-width="${sw}" fill="none" opacity=".55"/>`;
  if(b.delta!=null && b.base!=null){
    const a0=span(b.base), a1=span(b.p);
    if(Math.abs(a1-a0)>2)
      svg+=`<path d="${A(rMatch,Math.min(a0,a1),Math.max(a0,a1))}" stroke="${b.delta>=0?col:'var(--ink4)'}" stroke-width="${sw}" fill="none"/>`;
  }
  svg+='</svg>';
  /* The core carries the two digits and nothing else — no rank, no team
     code, no ✓/✗. aria-label carries what the rings say for anyone who
     cannot see them, and states the outcome outright, since two visual
     states cannot say "hit" the way three could. */
  const vc= out==='miss' ? 'var(--ink3)' : 'var(--ink)';
  const dl = b.delta!=null ? `, matchup ${b.delta>=0?'+':''}${(b.delta*100).toFixed(1)}` : '';
  return `<span class="sdial" role="img" aria-label="${esc(b.team||'')} ${pct(b.p,1)}${dl}${out ? out==='hit'?', recorded a hit':', game ended with no hit' : ''}">${svg}<span class="dc">
    <span class="dv num${out?'':' anim'}" style="color:${vc}">${Math.round(b.p*100)}</span></span></span>`;
}
/** The lineup slot drawn as a scorecard diamond. The batting order is one of
    the few numbers here that is a baseball object rather than a statistic, and
    a rotated square with the number inside it is how every scorecard in the
    game has drawn it — it costs nothing and it reads instantly. */
const slotDiamond = s => s
  ? `<span class="dia" title="Bats ${s} in the order" role="img" aria-label="bats ${s}"><i>${s}</i></span>`
  : `<span class="muted">slot TBD</span>`;
/** The last-10 form strip. `cls` picks the size — '' is the row strip, 'lg'
    the drawer's. Both render the same box width for the same number of
    games, so the strip anchors a column wherever it appears. */
function stripHTML(l10, cls){
  const c = 'strip'+(cls?' '+cls:'');
  if(!l10) return `<span class="${c} none" role="img" aria-label="no recent games" title="No recent games logged">—</span>`;
  const s=l10.slice(-10);
  const lab = `hit in ${[...s].filter(x=>x==='1').length} of last ${s.length}`;
  return `<span class="${c}" role="img" aria-label="${lab}" title="Last ${s.length} games — ${lab}">`+
    [...s].map(x=>`<i class="${x==='1'?'h':'n'}"></i>`).join('')+`</span>`;
}
function lineupTag(b){
  return b.confirmed ? `<span class="tag conf">confirmed</span>` : `<span class="tag est">projected</span>`;
}
const isFinal = b => /final|game over/i.test(S.live[b.gamePk]?.state||b.gameState||'');
/** True once every game has ended — then "final" is a property of the slate,
    not of each batter, and belongs in the ribbon instead of on 270 cards. */
const slateOver = () => S.batters.length>0 && S.batters.every(isFinal);
/** ── the outcome, decided in ONE place ────────────────────────────────
    Three states, never two: he hit, his game ended without one, or it is
    still open. A live game with no hit yet is NOT a miss, which is why a
    bare `!hasHit` is never enough. Everywhere a batter appears — shortlist
    row, table row, batting order, game strip, drawer — reads this function
    and draws the same mark, so ✓ and ✗ mean exactly one thing each.
    An archived CSV carries whatever game_state it was written with (usually
    pre-game), so any archive from a past day counts as settled wholesale —
    the same rule the archive ribbon and the drawer already use. */
function outcomeOf(b){
  if(b.hasHit) return 'hit';
  return (isFinal(b) || (!!S.date && S.date < TODAY())) ? 'miss' : '';
}
/** The mark itself. Rendered beside the SCORE, never beside the name: the
    score is the claim the outcome answers, and a ✓ floating next to a name
    was an ornament stuck on a forecast row rather than the row's own state. */
const outMark = (o,b) => o
  ? `<i class="res ${o}${b&&S._justHit?.has(key(b))?' pop':''}" role="img" aria-label="${o==='hit'?'recorded a hit':'no hit'}"
       title="${o==='hit'?'Recorded a hit':'Game ended with no hit'}">${o==='hit'?'✓':'✗'}</i>`
  : '';
/** The tracked state, as a mark on the name — see .wmk. starBtn() is the
    control; this is the fact, said wherever the batter's name is. */
const watchMark = b => isStarred(b)
  ? `<i class="wmk" role="img" aria-label="on your watchlist" title="On your watchlist">${icon(ICONS.watch)}</i>`
  : '';
function stateTag(b){
  const g=S.live[b.gamePk], s=(g?.state||b.gameState||'');
  /* Outcome used to be said here, as a solid green `hit ✓` pill on the name
     line. It is gone: the row now RESOLVES (see .bcard[data-out]) instead of
     wearing a badge, and a "final" tag on a resolved row said nothing the ✓/✗
     had not already said. What is left is the one state the score cannot
     carry — a game still running, and how far into it. */
  if(/progress|live/i.test(s)) return `<span class="tag live">${esc(g?.inning?(g.half||'')+' '+g.inning:'live')}</span>`;
  return '';
}
function chipFor(e){
  const cls = e.warn?'warn' : e.ctx?'out' : e.dir>0?'up' : e.dir<0?'down' : 'flat';
  const arrow = e.ctx?'' : e.dir>0?'↑' : e.dir<0?'↓' : '·';
  return `<span class="chip ${cls}">${arrow?arrow+' ':''}${esc(phraseOf(e))}${e.val?` <span class="k">${esc(e.val)}</span>`:''}</span>`;
}
/** Rank within tonight's field. With scores packed into 47–75%, "3rd of 270"
    communicates standing far better than the percentage on its own. */
function rankOf(b){
  if(!S._rank){ S._rank=new Map(); [...S.batters].sort((x,y)=>y.p-x.p).forEach((x,i)=>S._rank.set(key(x),i+1)); }
  return S._rank.get(key(b));
}
/** Three weights, not two. `hero` gets a categorically different treatment —
    accent rule, gradient wash, 60px score; one thing on the page is loudest.
    `lite` is the other end: the tail of a shortlist is a LIST, so it drops the
    evidence chips, the form strip and the pitcher grade and keeps only what a
    scan needs — name, side, score. Ten identical full-weight cards is what
    made Today read as one flat wall of information. */
function batterCard(b, rank, hero, idx, lite){
  const ev = evidence(b,S.st);
  const narrow = window.innerWidth < 600;
  // One chip per phone row, two on a wide one. A chip that wraps onto its own
  // line costs a whole row of height, which is how nine top-tier cards became
  // three thumb-scrolls; the rest of the evidence is one tap away in the drawer.
  // ONE chip on a phone, hero included. The phone card puts the strip and the
  // chip on the same line as the matchup, so a second chip does not cost a
  // little width — it costs the row its two-line shape. The hero used to get
  // two (three before that); the drawer holds the full ranked list either way.
  // The L10 strip used to open this row and take ~82px of it, which is why a
  // phone got exactly ONE chip. The strip is the dial's inner ring now, so the
  // width comes back to the evidence — see .bwhy.
  /* A tag search narrows the list to rows carrying a phrase, but a phone card
     prints only the strongest one or two — so the row that ANSWERED the query
     could show two other chips and look like a mismatch. When the Batters
     query matches a chip, that chip leads; the answer has to be visible on the
     row that was returned for it. */
  const tq = (S.view==='batters' && S.filters.q.trim().length>1) ? S.filters.q.trim().toLowerCase() : '';
  let pool = lite ? [] : ev.signal.filter(e=>e.s>=2);
  if(tq && pool.length){
    const i = pool.findIndex(e=>phraseOf(e).toLowerCase().includes(tq));
    if(i>0) pool = [pool[i], ...pool.filter((_,j)=>j!==i)];
  }
  const top = pool.slice(0, narrow?2 : hero?3:2);
  // 'est' is already stated by the PROJECTED tag on the name line — repeating
  // it as a chip costs a whole row on a phone and says nothing new. It stays
  // in the drawer's Context list, where it explains the consequence.
  const flags = lite ? [] : ev.context.filter(e=>e.warn && e.k!=='est').slice(0,1);
  const r = rankOf(b);
  // --i drives the staggered entrance in the Aurora theme. Capped at 14 so a
  // 270-row list does not end with a nine-second cascade.
  const pos = rank ?? idx ?? 0;
  const stagger = Math.min(pos, 14);
  const cls = hero ? ' hero' : lite ? ' lite' : '';
  // The club badge and the rank are one identity column: the badge answers
  // "whose player is this" from the shape, the rank answers "where does he
  // stand". Two answers, one glance, one column — which is why the matchup no
  // longer has to mark the batter's own side.
  /* The outcome is a state of the ROW, not a badge on it: once the game is
     settled the score stops wearing its tier colour (that colour is the
     forecast talking, and the forecast has been answered) and the ✓/✗ becomes
     the only coloured thing on the row. So green means "high score" on an open
     row and "he hit" on a settled one — never both at once, never on the same
     row. `data-out` drives all of it from one attribute. */
  const out = outcomeOf(b);
  return `<div class="brow${cls}${isStarred(b)?' starred':''}"><button class="bcard${cls}${pos<20?' stagger':''}" data-k="${key(b)}"${out?` data-out="${out}"`:''} style="--i:${stagger};--tc:${out==='miss' ? 'var(--ink4)' : tc(b.team,'var(--ink2)')}">
    <span class="brank num" aria-hidden="true">${rank!=null?rank:(r||'')}</span>
    <span class="bid">${dialHTML(b)}</span>
    <span class="bname">${esc(b.name)}${watchMark(b)}${lite?'':' '+lineupTag(b)}${stateTag(b)?' '+stateTag(b):''}</span>
    <span class="bmeta">${matchupHTML(b.matchup, b.team)} · ${slotDiamond(b.slot)} · vs ${esc(b.pit||'TBD')}${lite||narrow?'':` ${gradePill(b.pGrade)}`}</span>
    ${lite?'':`<span class="bwhy"><span class="bchips">${top.map(chipFor).join('')}${flags.map(chipFor).join('')}</span></span>`}
  </button>${starBtn(b)}<span class="swipeact" aria-hidden="true"><span class="ring">${icon(ICONS.watch)}</span></span></div>`;
}
/* ══════════════════════════════════════════════════════════════════════
   7 · views
   ══════════════════════════════════════════════════════════════════════ */
const VIEWS = [
  {id:'today',   label:'Today',    icon:'today'},
  {id:'batters', label:'Batters',  icon:'batters'},
  {id:'teams',   label:'Teams',    icon:'teams'},
  {id:'watch',   label:'Watch',    icon:'watch'},
  {id:'honesty', label:'Honesty',  icon:'honesty'}
];

function ribbon(){
  const bs=S.batters, games=new Set(bs.map(b=>b.gamePk)).size;
  const conf=bs.filter(b=>b.confirmed).length;
  const live=bs.some(b=>/progress/i.test(S.live[b.gamePk]?.state||b.gameState||''));
  const when = S.modified ? new Date(S.modified) : null;
  const ago = when ? Math.round((Date.now()-when)/60000) : null;
  const over = slateOver();
  const stale = ago!=null && ago>360;
  const n = v => `<b>${v}</b>`;
  const bits = [];
  bits.push(`${n(games)} game${games===1?'':'s'}`);
  bits.push(conf===bs.length ? `all ${n(bs.length)} lineups confirmed`
                             : `${n(conf)} of ${n(bs.length)} confirmed`);
  if(S.st.p) bits.push(`median ${n(pct(S.st.p.med,0))}, spanning `
    + n(`${pct(S.st.p.min,0).replace('%','')}–${pct(S.st.p.max,0)}`));
  if(S.date) bits.push(dateLabel(S.date));
  else if(ago!=null) bits.push(`<span class="${stale?'warn':''}">scored `
    + `${ago<60?ago+'m':Math.round(ago/60)+'h'} ago</span>`);
  if(over && !S.date) bits.push('<span class="warn">final</span>');
  return `<p class="ribbon"><span class="dot ${live?'live':''}"></span>${bits.join(' · ')}</p>`;
}

/* ── Today ─────────────────────────────────────────────────────────── */
function viewToday(){
  const ranked=[...S.batters].sort((a,b)=>b.p-a.p);
  const short=ranked.slice(0,10);
  // The "Since <time>" section (lineup churn since a morning snapshot) lived
  // here until 2026-07-26 — cut on client call: it never earned its screen
  // space. The snapshot machinery (S.snap) stays, in case a quieter use for
  // it appears; recover the section itself from git history.

  // Reads as a sentence, not a fragment: the note used to open mid-thought
  // with a lowercase "history:" and no clause in front of it.
  const bandNote = b => { const bd=bandFor(S.cal,b?.p); return bd&&bd.n>60 ? `<span class="muted">Scores in this band have landed <span class="num">${pct(bd.act,1)}</span> across ${bd.n.toLocaleString()} settled picks.</span> ` : ''; };

  /* Three weights inside one shortlist, because ten equally-loud cards give the
     eye nowhere to land: the top name, then the handful still genuinely in the
     conversation with it, then the tail as a scannable list. The cut at 4 is a
     display choice, not a claim about the scores — the note under the tail says
     so, and the gap between #1 and #10 is usually a couple of points. */
  const lead = short.slice(0,4), tail = short.slice(4);

  return `${ribbon()}
  <section class="sec lead">
    <div class="sec-h plain"><h2>${S.date?'Shortlist':"Tonight's shortlist"}</h2><p>Highest calibrated hit probability on the slate</p>
      <button class="lnk" data-go="batters">All ${S.batters.length} →</button></div>
    <div class="blist">${lead.map((b,i)=>batterCard(b,i+1,i===0)).join('')}</div>
    ${tail.length?`<div class="grp-h"><span class="lbl">Also on the shortlist</span><span class="rule"></span>
      <span class="lbl soft">${pct(tail[tail.length-1].p,1).replace('%','')}–${pct(tail[0].p,1)}</span></div>
    <div class="blist tail">${tail.map((b,i)=>batterCard(b,i+lead.length+1,false,null,true)).join('')}</div>`:''}
    <p class="note">
      ${bandNote(short[0])}Ranking is by the model score alone; open any batter for the evidence behind it.
    </p>
  </section>
  <section class="sec sub">
    <div class="sec-h"><h2>Where the bats are</h2>
      <p>Warmer games hold more of tonight's best bats · ${gameStripCount()}</p>
      <button class="lnk" data-go="teams">Lineups →</button></div>
    ${gameStrip()}
  </section>`;
}

/** Today's games are CONTEXT, not the subject — the full cards belong on the
    Teams tab, one tap away. Fifteen of them inline was the single largest block
    on the page and the least important thing on it, so here each game is one
    line: who is playing, when, and each side's average score with its best bat.
    Reuses the same per-game grouping lineups() does, deliberately without the bullpen
    what-if machinery, which only makes sense at full detail.

    Rebuilt 2026-07-26. The old version was fifteen time-ordered rows of bare
    percentages spanning 57–68 — a range the eye cannot rank — with the games
    already OVER sitting at the top, because they started earliest. So the
    section had no answer to "what am I looking at this for". It has one now:
    **which games still have bats worth watching.** Three changes carry that:
      · grouped by whether you can still act on it — still to come, in progress,
        final — instead of a flat clock ordering, and the settled ones are
        de-emphasised at the bottom where they belong;
      · every average drawn against tonight's own spread of lineup averages,
        the same trick meter()/luMeter() use, so 57 and 68 stop looking alike;
      · a count of each side's bats in the slate's top fifth, which is the
        thing that actually separates one game from another — two lineups can
        average 63% with one of them holding three of tonight's best names.
    Within a group the order is still first pitch, since a schedule read in
    any other order is not a schedule.

    Third pass, same day: the four-column version answered the question but
    made the reader decode dots, a bar and two percentages per side to get it —
    convoluted, per the client. This one is a plain schedule where the ROW
    ITSELF carries the answer: warmth (left edge + wash, `--heat` 0..1 scaled
    to the hottest game tonight) shows where the top-fifth bats are, a short
    caption says it in words ("4 top bats"), and everything else — averages,
    bars, best-bat names — moved into the hover title and the Teams tab, which
    the whole row now links to. Nothing to decode; the hot games just look hot. */
/** Top fifth of tonight's field. A fixed cutoff would call every bat "hot" on a
    friendly slate and none on a hard one; a percentile is always the same
    fraction of the field. Shared so the footnote can name the actual number. */
function hotCutoff(){
  const ps=S.batters.map(b=>b.p).filter(p=>p!=null&&!isNaN(p)).sort((a,b)=>a-b);
  return ps.length ? ps[Math.floor(ps.length*0.8)] : Infinity;
}
function gameStripData(){
  const byGame=new Map();
  for(const b of S.batters){ if(!byGame.has(b.gamePk)) byGame.set(b.gamePk,[]); byGame.get(b.gamePk).push(b); }
  const hotCut=hotCutoff();
  const games=[...byGame.entries()].map(([pk,bs])=>{
    const g=S.live[pk]||{};
    const state=String(g.state||bs[0].gameState||'');
    // `abstract` is the authority ('Preview' | 'Live' | 'Final'); the regex on
    // `state` only covers a feed that omits it. Do NOT infer "final" from the
    // score being present — the live feed reports 0–0 for a game that has not
    // started, which filed every pre-game matchup under Final, dimmed at the
    // bottom of the strip, with a "0–0" beside it.
    const live = g.abstract==='Live'  || (!g.abstract && /progress/i.test(state));
    const fin  = g.abstract==='Final' || (!g.abstract && /final|game over/i.test(state));
    const pre  = !live && !fin;
    // "AWAY @ HOME" — the same parse lineups() does, so the away side is drawn
    // on the left the way every scoreboard in the sport draws it.
    const order=String(bs[0].matchup||'').split('@').map(s=>s.trim());
    const teams=[...new Set(bs.map(b=>b.team))]
      .sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    const sides=teams.map(t=>{
      const tb=bs.filter(b=>b.team===t);
      return {team:t, n:tb.length,
        avg: tb.reduce((s,b)=>s+b.p,0)/tb.length,
        best: [...tb].sort((x,y)=>y.p-x.p)[0],
        hot: tb.filter(b=>b.p>=hotCut).length};
    });
    return {pk, g, live, fin, pre, start:bs[0].startTime||'', sides,
            grp: fin?2:live?1:0, hot:sides.reduce((s,x)=>s+x.hot,0),
            // the names behind the heat, hottest first — what the middle of the
            // row shows instead of blank space
            hotBats: bs.filter(b=>b.p>=hotCut).sort((x,y)=>y.p-x.p),
            best: [...bs].sort((x,y)=>y.p-x.p)[0]};
  });
  games.sort((a,b)=> a.grp-b.grp || startMin(a.start)-startMin(b.start));
  return games;
}
/** The tail of the section's subtitle. "15 on the card" was a fact about the
    schedule; what a reader wants is how much of tonight is still ahead of them.
    The heading states the QUESTION, this states how much of it is still open. */
function gameStripCount(){
  const gs=gameStripData(), n=gs.length;
  const pre=gs.filter(x=>x.grp===0).length, live=gs.filter(x=>x.grp===1).length;
  const bits=[];
  if(pre)  bits.push(`${pre} still to come`);
  if(live) bits.push(`${live} in progress`);
  if(n-pre-live) bits.push(`${n-pre-live} final`);
  return bits.join(' · ') || `${n} on the card`;
}
const GS_GROUP = ['Still to come','In progress','Final'];
function gameStrip(){
  const games=gameStripData(), hotCut=hotCutoff();
  if(!games.length) return '';
  // Heat is scaled to the hottest game TONIGHT, not an absolute count, for the
  // same reason the cutoff is a percentile: the strip should always have a
  // visible warm end, whatever kind of slate this is.
  const maxHot=Math.max(1,...games.map(x=>x.hot));

  let out='', grp=-1;
  for(const x of games){
    if(x.grp!==grp){
      grp=x.grp;
      const n=games.filter(y=>y.grp===grp).length;
      out+=`<div class="grp-h gsgrp"><span class="lbl">${GS_GROUP[grp]}</span><span class="rule"></span>
        <span class="lbl soft">${n}</span></div>`;
    }
    const g=x.g, a=x.sides[0], h=x.sides[1]||x.sides[0];
    // Everything the old columns said, demoted to the hover title where it can
    // be prose instead of a puzzle.
    const detail=x.sides.map(s=>`${s.team}: ${s.hot||'no'} top bat${s.hot===1?'':'s'}, best ${s.best.name} ${pct(s.best.p,0)}`).join(' · ');
    // Score sits BETWEEN the badges, not beside the time — "NYY 1 @ 2 PHI"
    // reads as one unit, and each number gets its own fixed-width slot so a
    // 1 becoming a 12 doesn't reflow the badges around it on every live poll.
    const awayN = (!x.pre && g.away!=null) ? esc(String(g.away)) : '';
    const homeN = (!x.pre && g.home!=null) ? esc(String(g.home)) : '';
    out+=`<button class="gsrow${x.fin?' done':''}" data-go="teams"
      ${x.hot?`style="--heat:${(x.hot/maxHot).toFixed(2)}"`:''}
      title="${esc(detail)} — full lineups on Teams.">
      <span class="gswhen">${
        x.live
          ? `<span class="tag live">${esc(((g.half||'')+' '+(g.inning||'')).trim()||'live')}</span>`
          : `<span class="gstime">${esc(x.start)}</span>`
      }</span>
      <span class="gsmid">${teamBadge(a.team,'bg-sm')}
        <span class="gsscore num">${awayN}</span>
        <span class="gsat">@</span>
        <span class="gsscore num">${homeN}</span>
        ${teamBadge(h.team,'bg-sm')}</span>
      <span class="gsbats">${(()=>{
        // Once the game is underway, each name answers its own question: ✓ he
        // hit, ✗ his game ended without one. Same outcomeOf()/outMark() pair
        // the rows and the batting orders use — one vocabulary, no dialects.
        const one=b=>`<b>${esc(b.name)}</b> <span class="num">${pct(b.p,0)}</span>${outMark(outcomeOf(b),b)}`;
        return x.hot
          ? x.hotBats.slice(0,4).map(one).join('<span class="gsdot">·</span>')
            + (x.hot>4?`<span class="gsmore">+${x.hot-4} more</span>`:'')
          : (x.best?`<span class="gsbest">best ${one(x.best)}</span>`:'');
      })()}</span>
      ${x.hot?`<span class="gsn num">${x.hot} top bat${x.hot===1?'':'s'}</span>`:'<span class="gsn"></span>'}
    </button>`;
  }
  return `<div class="gstrip">${out}</div>
    <p class="note">Warmer rows hold more of tonight's best bats — the slate's top fifth, scoring
      ${pct(hotCut,0)} or better. Tap a game for its full lineups.</p>`;
}

/* ── Batters ───────────────────────────────────────────────────────── */
function filtered(){
  const f=S.filters, q=f.q.toLowerCase();
  let list=S.batters.filter(b=>{
    // Names, clubs, arms — and the evidence chips themselves, so "beatable"
    // narrows to everyone facing one (see tagsOf).
    if(q && !(b.name.toLowerCase().includes(q)||b.team.toLowerCase().includes(q)||
              (b.pit||'').toLowerCase().includes(q)||tagsOf(b).hay.includes(q))) return false;
    if(f.team && b.team!==f.team) return false;
    if(f.game && b.gamePk!==f.game) return false;
    if(f.slot && String(b.slot)!==f.slot) return false;
    if(f.lineup==='conf' && !b.confirmed) return false;
    if(f.lineup==='est' && b.confirmed) return false;
    return true;
  });
  // dir: 1 = ascending, -1 = descending. Nulls always sort last.
  const k=f.sort;
  list.sort((a,b)=>{
    const va=a[k], vb=b[k];
    if(typeof va==='string'||typeof vb==='string') return f.dir*String(va??'').localeCompare(String(vb??''));
    if(va==null) return 1; if(vb==null) return -1;
    return f.dir*(va-vb);
  });
  return list;
}
/* ── the score tiers, as list furniture ───────────────────────────────────
   270 rows in one undifferentiated scroll gives the eye no landmarks, so the
   list is banded by the SAME tiers the score colours already use (tierOf) —
   the bands are not new information, they are the existing colour coding made
   findable. Only meaningful when the list is ordered by score: banding a
   name-sorted list would cut it into stripes that mean nothing. */
/* Rendering a few hundred batter rows at once makes a view heavy for no reason
   — the tail is rarely what anyone came to see. Any long batter list caps its
   initial render here and offers the rest behind one click. Filters and search
   still act on the FULL list, so narrowing always finds everyone, and the cap
   is skipped when the remainder would be trivial. */
const LIST_CAP = 30;

const TIER_LABEL = {hi:'70% and up', mid:'55 – 70%', lo:'Under 55%'};
function tierBands(list, sortedByScore){
  if(!sortedByScore) return null;
  const out=[]; let cur=null;
  list.forEach((b,i)=>{
    const t=tierOf(b.p);
    if(t!==cur){ out.push({at:i, tier:t, n:0}); cur=t; }
    out[out.length-1].n++;
  });
  return out.length>1 ? out : null;      // one band is the same as no bands
}

function viewBatters(){
  const f=S.filters, list=filtered();
  const capped = !S.batShowAll && list.length > LIST_CAP+15;
  const shown = capped ? list.slice(0,LIST_CAP) : list;
  const hidden = list.length - shown.length;
  const teams=[...new Set(S.batters.map(b=>b.team))].sort();
  const games=[...new Map(S.batters.map(b=>[b.gamePk,b.matchup])).entries()];
  /* Four groups, in reading order: WHO the batter is, what the MODEL says,
     what the BATTER has been doing, and what he is up against. The columns
     were always in this order; what was missing was any sign of it — thirteen
     identically-weighted numbers where two of them are the model's output and
     the rest are supporting evidence. The group a column belongs to now sets
     both its heading band and its ink. */
  const cols=[
    ['','#','c rk'],
    ['name','Batter',''],['team','Tm','c'],['slot','Slot','c'],
    ['p','Score','sch g1'],['base','Form','r'],['delta','Matchup','r'],
    ['l10hits','L10','c g1'],['bXba','xBA','r dim'],['bK','K%','r dim'],
    ['pit','Pitcher','g1'],['pRating','Arm','r dim'],['bPA','PA/g','r dim'],
    ['','','c']
  ];
  // group header band — colspans must total the 14 columns above
  const groups=[[1,''],[3,'Who'],[3,'Model score'],[3,'Batter form'],[3,'The arm'],[1,'']];
  // one <col> per column, in the same order — the widths live in the
  // stylesheet so the table can be table-layout:fixed (see .tblwrap)
  const colgroup = ['rk','name','tm','slot','score','form','mu','l10','xba','k','pit','arm','pa','star']
    .map(c=>`<col class="c-${c}">`).join('');
  const bands = tierBands(shown, f.sort==='p');
  const bandRow = (bd,span) => `<tr class="band"><td colspan="${span}">
    <span class="lbl">${TIER_LABEL[bd.tier]||''}</span>
    <span class="rule"></span><span class="lbl soft">${bd.n} ${bd.n===1?'batter':'batters'}</span></td></tr>`;
  const bandAt = i => bands ? bands.filter(bd=>bd.at===i) : [];
  return `${ribbon()}
  <div class="filters">
    <label class="field">${icon(ICONS.search)}<input id="fq" placeholder="Batter, team, pitcher, tag" value="${esc(f.q)}" aria-label="Search batters, teams, pitchers and evidence tags"></label>
    <label class="field"><select id="fteam" aria-label="Team"><option value="">All teams</option>${teams.map(t=>`<option ${f.team===t?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="field"><select id="fgame" aria-label="Game"><option value="">All games</option>${games.map(([pk,m])=>`<option value="${pk}" ${f.game===pk?'selected':''}>${esc(m)}</option>`).join('')}</select></label>
    <label class="field"><select id="fslot" aria-label="Lineup slot"><option value="">Any slot</option>${[1,2,3,4,5,6,7,8,9].map(s=>`<option ${f.slot==s?'selected':''}>${s}</option>`).join('')}</select></label>
    <div class="seg" role="group" aria-label="Lineup status">
      <button data-lu="" aria-pressed="${f.lineup===''}">All</button>
      <button data-lu="conf" aria-pressed="${f.lineup==='conf'}">Confirmed</button>
      <button data-lu="est" aria-pressed="${f.lineup==='est'}">Projected</button>
    </div>
    <span class="muted" style="font-size:12.5px">${capped?`top ${shown.length} of ${list.length}`:`${list.length} shown`}</span>
  </div>
  <div class="tblwrap" style="display:none" id="tbl">
    <table><colgroup>${colgroup}</colgroup><thead>
      <tr class="grp">${groups.map(([span,label])=>`<th colspan="${span}">${label}</th>`).join('')}</tr>
      <tr>${cols.map(([k,l,a])=> k===''
      ? `<th class="${a}" ${l?'':'aria-label="Watchlist"'}>${l}</th>`   // rank + star: nothing to sort by
      : `<th class="sortable ${a}" data-sort="${k}" ${f.sort===k?`aria-sort="${f.dir<0?'descending':'ascending'}"`:''}>${l}</th>`).join('')}</tr></thead>
    <tbody>${shown.map((b,i)=>{
      const d=b.delta;
      /* the same row-resolution rule the cards follow: a settled score drops
         its tier colour and wears the mark; data-out lets the shared
         [data-out="miss"] recede rule reach the table too */
      const o=outcomeOf(b);
      return bandAt(i).map(bd=>bandRow(bd,cols.length)).join('')+`<tr data-k="${key(b)}"${o?` data-out="${o}"`:''}>
        <td class="c rk num">${rankOf(b)??''}</td>
        <td class="nm"><span class="nmw"><b>${esc(b.name)}</b>${watchMark(b)}${b.confirmed?'':'<span class="tag est">est</span>'}${stateTag(b)}</span></td>
        <td class="c">${teamBadge(b.team,'bg-sm')}</td>
        <td class="c">${b.slot?slotDiamond(b.slot):'—'}</td>
        <td class="sc g1"><b class="num ${o?'':tcls(b.p)}">${pct(b.p,1)}${outMark(o,b)}</b>${meter(b)}</td>
        <td class="r num">${pct(b.base,1)}</td>
        <td class="r num" style="color:${d>0?'var(--tier-hi)':d<0?'var(--bad)':'var(--ink3)'}">${d==null?'—':(d>0?'+':'')+(d*100).toFixed(1)}</td>
        <td class="c g1">${stripHTML(b.last10,'sm')}</td>
        <td class="r num dim">${num(b.bXba,3)}</td>
        <td class="r num dim">${pct(b.bK,1)}</td>
        <td class="ell g1">${esc(b.pit||'TBD')} ${gradePill(b.pGrade||'?')}</td>
        <td class="r num dim">${b.pRating??'—'}</td>
        <td class="r num dim">${num(b.bPA,2)}</td>
        <td class="r">${starBtn(b,'tstar')}</td>
      </tr>`;}).join('')}</tbody></table>
  </div>
  <div class="blist" id="cards">${shown.map((b,i)=>
    bandAt(i).map(bd=>`<div class="grp-h"><span class="lbl">${TIER_LABEL[bd.tier]||''}</span>
      <span class="rule"></span><span class="lbl soft">${bd.n}</span></div>`).join('')
    // Full weight for the top tier, lite for everything below it — the same
    // "the tail is a list" move Today's shortlist makes, applied to all 270.
    + batterCard(b,null,false,i, bands ? tierOf(b.p)!=='hi' : false)).join('')}</div>
  ${hidden>0?`<button class="lnk" id="morebat" style="display:block;margin:16px auto 0">Show all ${list.length} batters (${hidden} more) →</button>`:''}`;
}

/* ── Games ─────────────────────────────────────────────────────────── */
/* ── bullpen preview — "who else could be on that mound?" ────────────────
   live_slate.py's build_bullpen_preview() scores every batter against every
   plausible arm on the opposing roster ahead of time, because the model
   (HistGBM + isotonic) only exists in that process and can never run in the
   browser. Shape: {gamePk: {pitchingTeam: {pitcherId: {…stats, batters:
   {batterId: p_hit}}}}} — so a swap is a lookup, not a re-score.
   Tonight only: the file is rebuilt each slate run and keyed by tonight's
   game_pks, so it is not offered while an archive date is loaded. */
const previewKey = (pk,team) => pk+'|'+team;
/** Candidate arms for the side batting for `team` — i.e. the OPPOSING roster. */
function bullpenFor(pk, battingTeam, teams){
  if(S.date || !S.bullpen) return null;
  const opp = teams.find(t=>t!==battingTeam);
  const cands = opp ? S.bullpen[String(pk)]?.[opp] : null;
  return cands && Object.keys(cands).length ? cands : null;
}
/** Which arm this side's scores should be shown against, and why.
    A manual pick is an explicit choice and always wins over the live swap. */
function armFor(pk, team, cands){
  const pid = S.preview[previewKey(pk,team)];
  if(pid && cands?.[pid]) return {pid, live:false, ...cands[pid]};

  // Live auto-swap: the pitcher actually on the mound, from the same schedule
  // call the ticker uses. Looked up in the OPPONENT's candidate map, which is
  // what keeps this correct without knowing who is batting — at any moment
  // only one team has a pitcher on the mound, so the other side simply misses
  // and stays on its probable starter.
  const g = S.live[pk] || {};
  const lp = g.abstract==='Live' ? g.pitcherId : null;         // pregame has no
  // "current" pitcher to differ from, and after Final the last arm of the night
  // is not what the day should be remembered by.
  const starter = String(S.batters.find(b=>b.gamePk===pk && b.team===team)?.pitId||'');
  if(lp && cands?.[lp] && lp !== starter) return {pid:lp, live:true, ...cands[lp]};
  return null;
}
/** This batter's score against whichever arm the side is previewing, or his
    real one. A candidate with no entry for a batter (roster churn between the
    slate run and now) falls back rather than showing a blank. */
function pFor(b, arm){
  const alt = arm?.batters?.[String(b.batterId)];
  return alt==null ? b.p : alt;
}
const ROLE_ORDER = {SP:0, RP:1, '':2};
function armOptions(cands, sel){
  // SP before RP so an early-inning starter swap is the easy pick, then by
  // sample size; an unlabelled role has no trailing games to classify from.
  return Object.entries(cands)
    .sort((a,b)=>(ROLE_ORDER[a[1].role??''] - ROLE_ORDER[b[1].role??'']) || ((b[1].n_games||0)-(a[1].n_games||0)))
    .map(([pid,c])=>`<option value="${pid}" ${sel===pid?'selected':''}>${c.role?`(${c.role}) `:''}${esc(c.name)} · ${c.n_games||0}G${(c.n_games||0)<8?' ⚠':''}</option>`)
    .join('');
}
function setPreview(pk, team, pid){
  const k = previewKey(pk,team);
  if(pid) S.preview[k]=pid; else delete S.preview[k];
  render();
}

/* ── the lineup, not the matchup ─────────────────────────────────────────
   This tab used to draw one card per GAME: two lineups facing each other
   across a divider, the way a scoreboard draws them. That framing asserts an
   interaction the model does not contain. Nothing scored here is batter
   against batter — the two sides of a game share a park and a first pitch and
   nothing else, and each side's number comes entirely from ITS nine bats
   against the ONE arm in front of them. Drawn as opponents, the two halves
   invited a comparison that means nothing.
   So the unit is the LINEUP: thirty of them on a full slate, each ranked
   against the other twenty-nine rather than against the club it happens to be
   playing, and each read as a collective — how the nine are hitting, what the
   matchup does to them, how many of them are genuinely live tonight. The
   opponent stays as one line of context: where the game is and who else is in
   it, not a wall to face. */

/** One entry per (game_pk, team) — never per team alone, which would collide
    on a doubleheader. Carries the collective read on the nine plus whichever
    arm the side is being previewed against. */
function lineups(){
  const byGame=new Map();
  for(const b of S.batters){ if(!byGame.has(b.gamePk)) byGame.set(b.gamePk,[]); byGame.get(b.gamePk).push(b); }
  const out=[];
  for(const [pk,bs] of byGame){
    const teams=[...new Set(bs.map(b=>b.team))];
    for(const t of teams){
      const tb=bs.filter(b=>b.team===t).sort((a,b)=>(a.slot||99)-(b.slot||99));
      const cands=bullpenFor(pk,t,teams), alt=cands?armFor(pk,t,cands):null;
      // Nulls are skipped rather than counted as zero — a lineup with one
      // missing trailing K% is not a lineup that strikes out less.
      const mean=f=>{ const v=tb.map(f).filter(x=>x!=null&&!isNaN(x));
                      return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
      const avg=mean(b=>pFor(b,alt));
      const sides=String(tb[0].matchup||'').split('@').map(s=>s.trim());   // "AWAY @ HOME"
      out.push({
        pk, team:t, opp:teams.find(x=>x!==t)||'', home:sides.length===2 && sides[1]===t,
        bs:tb, cands, alt, arm:tb[0], live:S.live[pk]||{},
        avg, swing: alt ? avg-mean(b=>b.p) : 0,
        base:mean(b=>b.base), delta:mean(b=>b.delta), hit:mean(b=>b.bHit), k:mean(b=>b.bK),
        strong: tb.filter(b=>tierOf(pFor(b,alt))==='hi').length,
        best: [...tb].sort((a,b)=>pFor(b,alt)-pFor(a,alt))[0],
        conf: tb.every(b=>b.confirmed), start:tb[0].startTime||'', park:tb[0].park
      });
    }
  }
  return out;
}
const LU_SORTS = [{id:'strength',label:'Strength'},{id:'time',label:'First pitch'},{id:'team',label:'Team'}];
function sortLineups(ls, how){
  const by = {
    strength: (a,b)=> (b.avg??0)-(a.avg??0),
    /* Sorting by time is the one ordering that puts the two sides of a game
       next to each other — and there it means something real, because it is
       the same first pitch, not a head-to-head. */
    time: (a,b)=> startMin(a.start)-startMin(b.start)
               || String(a.pk).localeCompare(String(b.pk))
               || (a.home?1:-1),                                  // away side first, as written
    team: (a,b)=> a.team.localeCompare(b.team)
  };
  return [...ls].sort(by[how] || by.strength);
}
/** The lineup average placed against the other lineups, the same way meter()
    places a batter against the other batters. A 61% average says nothing until
    you know the thirty of them run 52–68. */
function luMeter(v, s, settled){
  if(v==null) return '';
  const span=(s.max-s.min)||1;
  const w=clamp((v-s.min)/span,0,1)*100, med=clamp((s.med-s.min)/span,0,1)*100;
  return `<span class="meter ${settled?'settled':tcls(v)}" role="img"
    aria-label="${pct(v,1)} average, median lineup ${pct(s.med,1)}"><i style="width:${w.toFixed(1)}%"></i><b style="left:${med.toFixed(1)}%"></b></span>`;
}

function lineupCard(lu, rank, n, scale){
  const {alt, arm, bs} = lu;
  const g = lu.live;
  const statCell = (label,val,cls='') => `<div class="lu-cell"><div class="lbl">${label}</div><div class="lu-cv ${cls}">${val}</div></div>`;
  // Only a MANUAL pick marks an option selected — a live swap leaves the
  // picker on its default, whose label then says the swap is automatic.
  const manualPid = alt && !alt.live ? alt.pid : null;
  const picker = lu.cands ? `<select class="psel" data-pk="${lu.pk}" data-team="${esc(lu.team)}"
      aria-label="Preview ${esc(lu.team)} against a different arm"
      title="Score this lineup against another arm on the ${esc(lu.opp)} roster">
      <option value="">${alt&&alt.live?'Auto · whoever is pitching':'Probable starter'}</option>${armOptions(lu.cands, manualPid)}</select>` : '';
  const era = alt ? alt.p_era : arm.pEra;
  const st = S.st.p;
  /* A settled lineup card resolves the same way a batter row does. Its average
     is a forecast, and once every bat in it has an answer the forecast is no
     longer the headline — "5 of 9 got a hit" is. The tier colour goes with it,
     so a finished card cannot be mistaken for one still in play. */
  const luFin = bs.length>0 && bs.every(b=>!!outcomeOf(b));
  const luHits = bs.filter(b=>outcomeOf(b)==='hit').length;
  const order = bs.map(b=>{
    const pv = pFor(b,alt);
    const w = st ? clamp((pv-st.min)/((st.max-st.min)||1),0,1)*100 : 0;
    // Same three states as every other surface, drawn the same way: the mark
    // lives in its own fixed column so nine percentages stay in one line down
    // the card, whether or not the game has settled.
    const o = outcomeOf(b);
    return `<button class="${o?'':tcls(pv)}${alt?(alt.live?' alt livearm':' alt'):''}" data-k="${key(b)}"${o?` data-out="${o}"`:''}
        title="${esc(b.name)} — open the full evidence">
      ${slotDiamond(b.slot)}
      <span class="ordn"><b>${esc(b.name)}</b>${watchMark(b)}${b.confirmed?'':' <span class="tag est">est</span>'}</span>
      <span class="obar"><i style="width:${w.toFixed(1)}%"></i></span>
      <span class="ordp">${pct(pv,0)}</span>
      <span class="ordo">${outMark(o,b)}</span>
    </button>`;
  }).join('');
  /* A tag search returns lineups whose order rows print a score, not chips —
     so unlike a name search, nothing on the card says why it came back. Name
     the tag and the bats carrying it, above the order they sit in. Only the
     tag needs this: a name or an arm is already visible on the card. */
  const lq = S.lq.trim().toLowerCase();
  const tagBs = lq.length>1 ? bs.filter(b=>tagsOf(b).hay.includes(lq)) : [];
  const tagName = tagBs.length ? (tagsOf(tagBs[0]).list.find(t=>t.toLowerCase().includes(lq))||'') : '';
  /* An arm tag is true of everyone in the order — they all face the same
     pitcher — so naming all nine costs three lines to say what "9 of 9"
     already said. Names are what a SUBSET needs. */
  const tagLine = tagName ? `<div class="lu-tag"><b>${esc(tagName)}</b>
    <span>${tagBs.length} of ${bs.length}</span>
    ${tagBs.length===bs.length ? 'every bat in the order'
                               : esc(tagBs.map(b=>b.name).join(', '))}</div>` : '';
  const scoreTxt = (g.away!=null&&g.home!=null) ? `${g.awayAbbr||''} ${g.away}–${g.home} ${g.homeAbbr||''}` : '';
  const dl = lu.delta;
  return `<article class="lu" style="--tc:${tc(lu.team,'var(--line2)')}">
    <div class="lu-h">
      ${teamBadge(lu.team)}
      <span class="lu-tm">${esc(lu.team)}</span>
      <span class="lu-opp">${lu.home?'vs':'<span class="at">@</span>'} ${teamSpan(lu.opp)}</span>
      <span class="lu-when">
        ${g.abstract==='Live'?`<span class="tag live">${esc(((g.half||'')+' '+(g.inning||'')).trim())}</span>`:''}
        ${scoreTxt?`<span class="lu-gs">${esc(scoreTxt)}</span>`:''}
        <span class="lu-time">${esc(lu.start)}</span>
      </span>
    </div>

    <div class="lu-top">
      <div class="lu-avg ${luFin?'settled':tcls(lu.avg)}">${pct(lu.avg,0).replace('%','')}<span>%</span></div>
      <div class="lu-side">
        ${luFin?`<b class="lu-res">${luHits} of ${bs.length}</b> got a hit. The pre-game read had this
          lineup <b>#${rank} of ${n}</b>, by the average score of the nine.`
        :`<b>#${rank} of ${n}</b> lineups tonight, by the average score of the ${bs.length} bats.
          Best bat <b>${esc(lu.best.name)} ${pct(pFor(lu.best,alt),0)}</b>.${
          alt?` <span class="delta ${lu.swing>=0?'up':'down'}">${lu.swing>=0?'+':''}${(lu.swing*100).toFixed(1)}</span> against this arm.`:''}`}
        ${luMeter(lu.avg, scale, luFin)}
      </div>
    </div>

    <div class="lu-arm">
      facing <b>${esc(alt?alt.name:(arm.pit||'TBD'))}</b>
      ${(alt?alt.hand:arm.pitHand)?`(${esc(alt?alt.hand:arm.pitHand)})`:''}
      ${alt ? `<span class="gr" title="The 0–100 pitcher grade isn't computed for what-if arms — only the model inputs are">–</span>`
            : gradePill(arm.pGrade)}
      ${era!=null?`<span class="num">${num(era,2)} ERA</span>`:''}
      ${alt ? `<span class="tag ${alt.live?'live':'est'}" title="${
                 alt.live ? `On the mound now in relief — the probable was ${esc(arm.pit||'TBD')}`
                          : 'A hypothetical — not necessarily who is actually pitching'}${
                 alt.n_games?` · ${alt.n_games} games in the trailing window`:''}">${alt.live?'live arm':'what-if'}</span>`
             : (lu.conf?'<span class="tag conf">confirmed</span>':'<span class="tag est">projected</span>')}
      ${picker}
    </div>

    <div class="lu-stats">
      ${statCell('Form base', pct(lu.base,0), '')}
      ${statCell('Matchup', dl==null?'—':`${dl>0?'+':''}${(dl*100).toFixed(1)}`, dl>0?'up':dl<0?'down':'')}
      ${statCell('70%+ bats', `${lu.strong}<span style="color:var(--ink4)">/${bs.length}</span>`)}
      ${statCell('Hit rate', pct(lu.hit,1))}
      ${statCell('K rate', pct(lu.k,1))}
    </div>

    ${tagLine}
    <div class="ord">${order}</div>

    <div class="lu-foot">
      ${lu.park!=null?`Park <b>${num(lu.park,2)}</b> · `:''}${lu.conf?'lineup confirmed':`${bs.filter(b=>b.confirmed).length} of ${bs.length} confirmed`}
      ${alt?` · these are the nine against ${esc(alt.name)}; open a batter for the full evidence, which is still built against ${esc(arm.pit||'the probable starter')}.`
           :' · open a batter for the evidence behind his score.'}
    </div>
  </article>`;
}

function viewTeams(){
  const ls = lineups();
  if(!ls.length) return `${ribbon()}<div class="empty">No lineups on this slate yet.</div>`;
  const ranked=[...ls].sort((a,b)=>(b.avg??0)-(a.avg??0));
  const rankOfLu=new Map(ranked.map((l,i)=>[l.pk+'|'+l.team, i+1]));
  const avgs=ranked.map(l=>l.avg).filter(v=>v!=null).sort((a,b)=>a-b);
  const scale={min:avgs[0], max:avgs[avgs.length-1], med:avgs[Math.floor(avgs.length/2)]};
  const lq=S.lq.trim().toLowerCase();
  const shown=sortLineups(ls, S.lsort).filter(l=>{
    if(!lq) return true;
    return l.team.toLowerCase().includes(lq)
        || l.opp.toLowerCase().includes(lq)
        || (l.arm.pit||'').toLowerCase().includes(lq)
        || (l.alt?(l.alt.name||'').toLowerCase().includes(lq):false)
        || l.bs.some(b=>b.name.toLowerCase().includes(lq))
        // …and the chips: a tag question asked here is "which OFFENCES have
        // bats carrying this", so one bat is enough to return the lineup and
        // the card says which ones (see lineupCard's .lu-tag).
        || l.bs.some(b=>tagsOf(b).hay.includes(lq));
  });
  return `${ribbon()}
  <div class="sec-h" style="margin-bottom:14px">
    <h2>Lineups</h2>
    <p>${ls.length} lineups across ${new Set(ls.map(l=>l.pk)).size} games. Each one is an offense
      and the single arm in front of it — ranked against every other lineup on the slate, not against
      the club it happens to be playing.</p>
  </div>
  <div class="filters">
    <label class="field">${icon(ICONS.search)}<input id="lq" placeholder="Team, batter, pitcher, tag" value="${esc(S.lq)}" aria-label="Search lineups by team, batter, pitcher or evidence tag"></label>
    <div class="seg" role="group" aria-label="Order the lineups">
      ${LU_SORTS.map(s=>`<button data-lsort="${s.id}" aria-pressed="${S.lsort===s.id}">${s.label}</button>`).join('')}
    </div>
    <span class="muted" style="font-size:12.5px">strongest tonight: ${esc(ranked[0].team)} at
      <span class="num ${tcls(ranked[0].avg)}">${pct(ranked[0].avg,0)}</span> · slate spread
      <span class="num">${pct(scale.min,0)}–${pct(scale.max,0)}</span></span>
  </div>
  ${shown.length?`<div class="lus">${shown.map(l=>lineupCard(l, rankOfLu.get(l.pk+'|'+l.team), ls.length, scale)).join('')}</div>`
    :`<div class="empty">No lineup, batter, arm or tag matches “${esc(S.lq.trim())}”.</div>`}`;
}

/* ── Watch ─────────────────────────────────────────────────────────── */
function viewWatch(){
  const list=S.batters.filter(b=>S.stars.includes(key(b))).sort((a,b)=>b.p-a.p);
  if(!list.length) return `${ribbon()}<div class="empty">
    Nothing on the watchlist yet.<br><span style="font-size:12.5px">Tap the ☆ on any batter — in the shortlist, the table, or the drawer — to follow them through the night.
    <button class="lnk" data-go="today" style="display:block;margin:10px auto 0">Back to tonight's shortlist →</button></span></div>`;
  // The list's own scoreboard — this is the tab the outcome exists FOR, so
  // the header keeps the running answer: landed, finished without, still open.
  const done=list.filter(b=>outcomeOf(b)==='hit').length;
  const missed=list.filter(b=>outcomeOf(b)==='miss').length;
  const open=list.length-done-missed;
  // Same cap as Batters (LIST_CAP). The counts above stay whole-list — a
  // watchlist you can't see all of at once still has to report its real score.
  const capped = !S.watchShowAll && list.length > LIST_CAP+15;
  const shown = capped ? list.slice(0,LIST_CAP) : list;
  const hidden = list.length - shown.length;
  return `${ribbon()}
  <section class="sec">
    <div class="sec-h"><h2>Watchlist</h2><p><b class="num">${done}</b> of ${list.length} have a hit${missed?` · <b class="num">${missed}</b> finished without`:''}${open?` · <b class="num">${open}</b> still open`:''}${capped?` · showing top ${shown.length}`:''}</p></div>
    <div class="blist">${shown.map((b,i)=>batterCard(b,i+1)).join('')}</div>
    ${hidden>0?`<button class="lnk" id="morewatch" style="display:block;margin:16px auto 0">Show all ${list.length} (${hidden} more) →</button>`:''}
  </section>`;
}

/* ── Honesty ───────────────────────────────────────────────────────── */
function reliabilitySVG(cal){
  const W=560,H=300,P=38, SPAN=CAL_HI-CAL_LO;
  const x=v=>P+(v-CAL_LO)/SPAN*(W-P-14), y=v=>H-P-(v-CAL_LO)/SPAN*(H-P-14);
  /* Drawn over the current model's range only — see MODEL_ERA. The pre-07-25
     bands used to hook this curve 15pt off the line at the bottom-left, which
     read as "the model is badly calibrated" when it was a different model. */
  const pts=cal.bands.filter(b=>b.live && b.n>=40);
  const path=pts.map((b,i)=>`${i?'L':'M'}${x(b.pred).toFixed(1)},${y(b.act).toFixed(1)}`).join('');
  const ticks=[.45,.5,.55,.6,.65,.7,.75,.8];
  // the .8 label sits exactly where the y-axis caption goes — grid it, don't label it
  const labelled=[.45,.5,.55,.6,.65,.7,.75];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reliability curve: predicted versus actual hit rate">
    ${ticks.map(t=>`<line class="grid" x1="${x(t)}" y1="${P-8}" x2="${x(t)}" y2="${H-P}"/>
                    <line class="grid" x1="${P}" y1="${y(t)}" x2="${W-14}" y2="${y(t)}"/>`).join('')}
    <line class="ideal" x1="${x(CAL_LO)}" y1="${y(CAL_LO)}" x2="${x(CAL_HI)}" y2="${y(CAL_HI)}"/>
    <path class="curve" pathLength="1" d="${path}"/>
    ${pts.map(b=>`<circle class="pt" cx="${x(b.pred)}" cy="${y(b.act)}" r="${clamp(Math.sqrt(b.n)/9,3,9).toFixed(1)}"><title>predicted ${pct(b.pred,1)} → actual ${pct(b.act,1)} (n=${b.n})</title></circle>`).join('')}
    ${labelled.map(t=>`<text x="${x(t)}" y="${H-P+15}" text-anchor="middle">${(t*100)|0}</text>
                    <text x="${P-8}" y="${y(t)+3}" text-anchor="end">${(t*100)|0}</text>`).join('')}
    <text x="${W/2}" y="${H-6}" text-anchor="middle">predicted %</text>
    <text x="0" y="${P-22}" text-anchor="start">actual %</text>
    <!-- bottom-left of the line: the curve starts at ~55, so this corner is empty -->
    <text x="${x(.472)}" y="${y(.503)}" fill="var(--ink3)">perfect</text>
  </svg>`;
}
/* Score bands as a dumbbell chart. One row per band: a tick where the model
   said the rate would be, a dot where it landed, a bar spanning the two. The
   table this replaced made you subtract two percentages per row to find the
   only thing the section is about — here the gap IS the bar's length, and the
   rows sort themselves visually because a band that overstates leans left. */
function bandsSVG(cal){
  const rows=cal.bands; if(!rows.length) return '';
  const vals=rows.flatMap(b=>[b.pred,b.act]);
  const lo=Math.floor(Math.min(...vals)*20)/20, hi=Math.ceil(Math.max(...vals)*20)/20;
  const W=660, RH=27, TOP=22, BOT=36, L=104, R=132;
  const H=TOP+rows.length*RH+BOT;
  const x=v=>L+(v-lo)/(hi-lo)*(W-L-R), cy=i=>TOP+i*RH+RH/2;
  const ticks=[]; for(let t=lo;t<=hi+1e-9;t+=.05) ticks.push(+t.toFixed(2));
  return `<svg class="chart tall" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted versus actual hit rate for each score band">
    ${ticks.map(t=>`<line class="grid" x1="${x(t).toFixed(1)}" y1="${TOP-6}" x2="${x(t).toFixed(1)}" y2="${H-BOT+4}"/>
      ${Math.round(t*100)%10===0?`<text x="${x(t).toFixed(1)}" y="${H-BOT+18}" text-anchor="middle">${(t*100)|0}</text>`:''}`).join('')}
    <text x="${((L+W-R)/2).toFixed(0)}" y="${H-6}" text-anchor="middle">hit rate %</text>
    ${rows.map((b,i)=>{
      const gap=(b.act-b.pred)*100, off=b.live&&Math.abs(gap)>4, y=cy(i);
      const label=b.pos==='hi'?pct(b.band,0)+'+':pct(b.band,0)+'–'+pct(b.band+.05,0);
      const tag=b.pos==='lo'?'retired':b.pos==='hi'?'off-scale':'';
      return `<g class="${b.live?'':'dead'}"><title>${esc(label)} — said ${pct(b.pred,1)}, landed ${pct(b.act,1)} (${gap>0?'+':''}${gap.toFixed(1)}pt, ${b.n.toLocaleString()} picks)${
        b.pos==='lo'?` · retired: below the current model's floor, pre-${esc(cal.era)} picks only`
       :b.pos==='hi'?' · off-scale: above 80%, no slate has produced one since 2026-07-18':''}</title>
      <text class="rlab" x="${L-14}" y="${y+3.5}" text-anchor="end">${label}</text>
      <line class="gapbar${off?' off':''}" x1="${x(b.pred).toFixed(1)}" y1="${y}" x2="${x(b.act).toFixed(1)}" y2="${y}"/>
      <line class="predtick" x1="${x(b.pred).toFixed(1)}" y1="${y-7}" x2="${x(b.pred).toFixed(1)}" y2="${y+7}"/>
      <circle class="actdot${off?' off':''}" cx="${x(b.act).toFixed(1)}" cy="${y}" r="4.6"/>
      <text class="rn" x="${W-R+16}" y="${y+3.5}">${b.n.toLocaleString()}${tag?'  '+tag:''}</text></g>`;
    }).join('')}
  </svg>`;
}
/* The same grammar over time: the dashed line is the run of nightly claims,
   each dot is that night's actual rate hung off it, and dot size is how many
   picks the night carried — a wild-looking miss on a 12-pick slate should not
   read as loudly as a flat one on 300. */
function daysSVG(days){
  if(!days.length) return '';
  const d=[...days].reverse();                    // cal.days is newest-first
  const vals=d.flatMap(v=>[v.pred,v.act]);
  const lo=Math.max(0,Math.floor(Math.min(...vals)*10)/10-.05);
  const hi=Math.min(1,Math.ceil(Math.max(...vals)*10)/10+.05);
  const W=660,H=280,L=40,R=16,T=16,B=42;
  const x=i=>L+(i+.5)/d.length*(W-L-R), y=v=>H-B-(v-lo)/(hi-lo)*(H-B-T);
  const ticks=[]; for(let t=Math.ceil(lo*20)/20;t<=hi+1e-9;t+=.05) ticks.push(+t.toFixed(2));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted versus actual hit rate for each of the last 14 days">
    <text x="0" y="9">hit rate %</text>
    ${ticks.map(t=>`<line class="grid" x1="${L}" y1="${y(t).toFixed(1)}" x2="${W-R}" y2="${y(t).toFixed(1)}"/>
      ${Math.round(t*100)%10===0?`<text x="${L-8}" y="${(y(t)+3).toFixed(1)}" text-anchor="end">${(t*100)|0}</text>`:''}`).join('')}
    <path class="predline" d="${d.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v.pred).toFixed(1)}`).join('')}"/>
    ${d.map((v,i)=>{
      const gap=(v.act-v.pred)*100, off=Math.abs(gap)>8;
      return `<g><title>${esc(v.date)} — said ${pct(v.pred,1)}, landed ${pct(v.act,1)} (${gap>0?'+':''}${gap.toFixed(1)}pt, ${v.n} picks)</title>
      <line class="gapbar${off?' off':''}" x1="${x(i).toFixed(1)}" y1="${y(v.pred).toFixed(1)}" x2="${x(i).toFixed(1)}" y2="${y(v.act).toFixed(1)}"/>
      <circle class="actdot${off?' off':''}" cx="${x(i).toFixed(1)}" cy="${y(v.act).toFixed(1)}" r="${clamp(Math.sqrt(v.n)/2.6,3,8).toFixed(1)}"/>
      <text x="${x(i).toFixed(1)}" y="${H-B+18}" text-anchor="middle">${esc(String(v.date).slice(5))}</text></g>`;
    }).join('')}
  </svg>`;
}
/* `pred` matches how each chart actually draws the claim — a tick per row on
   the band chart, one dashed run across the daily one. A legend that shows a
   mark the chart doesn't contain is worse than no legend. */
const CHART_LEGEND = (tol,pred)=>`<div class="clegend">
  <span><i class="${pred}"></i>predicted</span><span><i class="dot"></i>actual</span>
  <span><i class="bar"></i>gap</span><span><i class="bar off"></i>gap over ${tol}pt</span></div>`;
function viewHonesty(){
  const cal=S.cal;
  if(!cal) return `<div class="empty">Loading the settled-picks record…</div>`;
  // worst band WITHIN the range the current model can produce — the old
  // bottom-left hook is a previous generation's and would always win here.
  const worst=[...cal.bands].filter(b=>b.live && b.n>=100).sort((a,b)=>Math.abs(b.act-b.pred)-Math.abs(a.act-a.pred))[0];
  const sum=f=>cal.bands.filter(f).reduce((s,b)=>s+b.n,0);
  const deadLo=sum(b=>b.pos==='lo'), deadHi=sum(b=>b.pos==='hi');
  const recent=cal.days.slice(0,14);
  const eraNote = `<div class="truth" style="margin-top:12px">${icon(ICONS.info)}<div>The record spans two
    model generations. The <b>${esc(cal.era)}</b> retrain (FEATURES 21 → 14) lifted the score floor from
    ~30% to ~47%, so the <b class="num">${deadLo.toLocaleString()}</b> picks below the 45 band came from a model
    that can no longer produce a score there — they are dimmed in the band chart below and kept off this curve.
    ${deadHi?`The <b class="num">${deadHi.toLocaleString()}</b> picks above 80% are off the top of the scale the
    same way — no slate has produced one since 2026-07-18 — but the 75–80 band below them is
    <b>not</b> retired: the current model still scores there, and it is the worst-calibrated band on the page.`:''}
    The current model has <b class="num">${cal.eraN.toLocaleString()}</b> settled picks of its own so far;
    until that number is in the thousands, treat the curve as the previous generation's,
    measured over the range both share.</div></div>`;
  return `${ribbon()}
  <section class="sec">
    <div class="sec-h"><h2>Is the number honest?</h2><p>The one hard rule of this project — measured on the ${cal.n.toLocaleString()} settled picks inside the range the current model scores in</p></div>
    <div class="sgrid">
      <div class="scell"><div class="slab">Settled picks</div><div class="sval">${cal.n.toLocaleString()}</div><div class="ssub">${pct(cal.lo,0)}+, since ${esc(cal.since||'')}</div></div>
      <div class="scell"><div class="slab">Brier</div><div class="sval">${num(cal.brier,4)}</div><div class="ssub">lower is better</div></div>
      <div class="scell"><div class="slab">Mean predicted</div><div class="sval">${pct(cal.meanP,1)}</div><div class="ssub">what it claimed</div></div>
      <div class="scell"><div class="slab">Actual rate</div><div class="sval">${pct(cal.baseRate,1)}</div><div class="ssub">what happened</div></div>
      <div class="scell"><div class="slab">Overall gap</div><div class="sval" style="color:${Math.abs(cal.baseRate-cal.meanP)>.02?'var(--bad)':'var(--acc)'}">${((cal.baseRate-cal.meanP)*100>0?'+':'')+((cal.baseRate-cal.meanP)*100).toFixed(1)}pt</div><div class="ssub">actual − predicted</div></div>
    </div>
    <p class="muted" style="font-size:12.5px;margin-top:8px">Scoped to scores of ${pct(cal.lo,0)} and up, because
      below that the record belongs to the pre-${esc(cal.era)} model and the current one cannot land there.
      Unscoped, the same file reads <b class="num">${cal.all.n.toLocaleString()}</b> picks,
      Brier <b class="num">${num(cal.all.brier,4)}</b>, predicted <b class="num">${pct(cal.all.meanP,1)}</b>
      vs actual <b class="num">${pct(cal.all.baseRate,1)}</b> — a
      <b class="num">${((cal.all.baseRate-cal.all.meanP)*100>0?'+':'')+((cal.all.baseRate-cal.all.meanP)*100).toFixed(1)}pt</b>
      gap that is almost entirely the retired low bands.</p>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Reliability</h2><p>A well-calibrated model sits on the dashed line. Circle size is sample size. Drawn over ${pct(CAL_LO,0)}–${pct(CAL_HI,0)} — the range the current model actually scores in.</p></div>
    <div style="padding:2px 0 0">${reliabilitySVG(cal)}
      ${worst?`<div class="truth" style="margin-top:12px">${icon(ICONS.info)}<div>Worst-calibrated band in this range: the model said
      <b class="num">${pct(worst.pred,1)}</b> and those picks landed <b class="num">${pct(worst.act,1)}</b>
      (${worst.n.toLocaleString()} picks, ${((worst.act-worst.pred)*100>0?'+':'')+((worst.act-worst.pred)*100).toFixed(1)}pt off).
      ${worst.band>=.70 ? 'The very top of the range is the thinnest sample and the least trustworthy part of the model — a high score is still the best score on the board, but it overstates itself.'
                        : 'Scores near the bottom of the range are the least trustworthy part of the model.'}</div></div>`:''}
      ${eraNote}
    </div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Score bands</h2><p>What a score in each band has actually done. The bar is the gap between claim and outcome — every band, including the ones off either end of the current model's range, which are dimmed</p></div>
    <div style="padding:2px 0 0">${bandsSVG(cal)}${CHART_LEGEND(4,'tick')}
      <p class="muted" style="font-size:12.5px;margin-top:12px">The number beside each bar is how many settled picks
        that band rests on, and it varies by more than an order of magnitude — a long bar on a few hundred picks is a
        thinner claim than a short one on several thousand. Each row carries its exact figures as a tooltip.</p></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Last 14 days</h2><p>The dashed line is what the model claimed each night; the dot is what happened, sized by how many picks that slate carried</p></div>
    <div style="padding:2px 0 0">${daysSVG(recent)}${CHART_LEGEND(8,'dash')}</div>
  </section>`;
}

/* ══════════════════════════════════════════════════════════════════════
   8 · drawer — the full case for one batter
   ══════════════════════════════════════════════════════════════════════ */
function waterfall(b){
  const base=b.base??b.p, d=b.delta??0, fin=b.p;
  const scale=v=>clamp((v-.3)/(.55),0,1)*100;
  const row=(lab,val,barHTML,cls='')=>`<div class="wfrow"><span class="muted">${lab}</span>${barHTML}<span class="wfval ${cls}">${val}</span></div>`;
  const dw=Math.abs(d)*100/.55*100/100*100;
  return `<div class="wf">
    ${row('Batter form', pct(base,1), `<span class="wfbar"><i style="left:0;width:${scale(base)}%;background:var(--s2)"></i></span>`)}
    ${row('Matchup', (d>0?'+':'')+(d*100).toFixed(1)+'pt',
      `<span class="wfbar"><i style="left:${Math.min(scale(base),scale(base+d))}%;width:${Math.max(.8,Math.abs(scale(base+d)-scale(base)))}%;background:${d>=0?'var(--acc)':'var(--bad)'}"></i></span>`,
      d>0?'':'')}
    ${row('Score', pct(fin,1), `<span class="wfbar"><i style="left:0;width:${scale(fin)}%;background:var(--s4)"></i></span>`)}
  </div>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Form is what he has been doing regardless of opponent; matchup is everything about tonight — this pitcher, this park, this lineup slot.</p>`;
}
/** closeDrawer defers `hidden` until the slide-out finishes. Re-opening inside
    that window used to leave the old timer running, so it fired on an
    already-open drawer: visually open, `hidden === true`. Everything that asks
    "is the drawer open?" — Escape, the arrow-key stepper, renderDrawer's
    refresh guard — then believed it was closed and stopped working. Cancel the
    pending close instead. */
let drawerTimer = null;
function openDrawer(k, list){
  const idx=(list||S.batters).findIndex(b=>key(b)===k);
  S.drawerList = list||S.batters; S.drawerIdx = idx;
  renderDrawer();
  clearTimeout(drawerTimer);
  const d=$('#drawer'); d.hidden=false; requestAnimationFrame(()=>{ d.classList.add('on'); $('#scrim').classList.add('on'); });
  document.body.style.overflow='hidden';
}
function closeDrawer(){
  const d=$('#drawer'); d.classList.remove('on'); $('#scrim').classList.remove('on');
  document.body.style.overflow='';
  clearTimeout(drawerTimer);
  drawerTimer = setTimeout(()=>{ d.hidden=true; },220);
}
function stepDrawer(n){
  const i=S.drawerIdx+n; if(i<0||i>=S.drawerList.length) return;
  S.drawerIdx=i; renderDrawer(); $('#drawer .dbody').scrollTop=0;
}
function renderDrawer(){
  const b=S.drawerList[S.drawerIdx]; if(!b) return;
  const ev=evidence(b,S.st), v=verdict(b,ev,S.st), bd=bandFor(S.cal,b.p);
  const starred=S.stars.includes(key(b));
  const log=S.pitcherLog?.[String(b.pitId).replace(/\.0$/,'')]||null;

  /* Once the game is final the drawer leads with what happened; the pre-game
     case stays below it, frozen, so the two can be read against each other.
     The log loads lazily — kick the fetch here and re-render on arrival,
     guarded so a closed drawer or a stepped-to different batter is a no-op. */
  /* isFinal covers the live slate; an archived CSV carries whatever
     game_state it was written with (usually pre-game), so any archive from a
     past day counts as final wholesale — same rule as the archive ribbon. */
  /* Same rule outcomeOf() applies, named here because the drawer needs the
     boolean itself for the "What happened" section, not just the mark. */
  const fin = !!outcomeOf(b) || isFinal(b) || (!!S.date && S.date < TODAY());
  const gl = fin ? S.gamelog[b.gamePk] : null;
  if(fin && !gl) loadGameLog(b.gamePk).then(()=>{
    if(!$('#drawer').hidden && S.drawerList[S.drawerIdx]===b) renderDrawer();
  });
  const me = gl?.status==='ok' ? gl.players[String(b.batterId).replace(/\.0$/,'')] : null;

    <div class="sec-h"><h2>What happened</h2><p>${
      gl?.status==='ok' ? (me ? `Final — ${me.h>0 ? `${me.h} hit${me.h>1?'s':''} ${outMark('hit')}` : `no hit ${outMark('miss')}`}` : 'Final — did not bat')
      : gl?.status==='err' ? 'Final — game log unavailable' : 'Final — loading the game log…'}</p></div>
    ${me?`<div class="sgrid" style="margin-bottom:6px">
      <div class="scell"><div class="slab">Line</div><div class="sval">${me.h}-${me.ab}</div><div class="ssub">H-AB</div></div>
      <div class="scell"><div class="slab">XBH</div><div class="sval">${me.d2+me.d3+me.hr}</div><div class="ssub">${me.hr?me.hr+' HR':'extra bases'}</div></div>
      <div class="scell"><div class="slab">R / RBI</div><div class="sval">${me.r} / ${me.rbi}</div><div class="ssub">runs · driven in</div></div>
      <div class="scell"><div class="slab">BB / K</div><div class="sval">${me.bb} / ${me.k}</div><div class="ssub">walks · strikeouts</div></div>
    </div>
    ${me.pas.length?`<div class="tblwrap" style="box-shadow:none;margin-bottom:8px"><table>
      <thead><tr><th>Inn</th><th>Result</th><th>Against</th></tr></thead>
      <tbody>${me.pas.map(pa=>`<tr style="cursor:default">
        <td class="num">${pa.inn??''}</td>
        <td${pa.hit?' style="color:var(--tier-hi);font-weight:650"':''}>${esc(pa.ev)}</td>
        <td class="num">${esc(pa.pit)}</td></tr>`).join('')}</tbody></table></div>`:''}
    <p class="muted" style="font-size:12px;margin:0 0 16px">Everything below is the pre-game case, frozen as of first pitch.</p>`:''}`;

  const evRow=e=>`<div class="evrow">
    <span class="evarrow ${e.ctx?'flat':e.dir>0?'up':e.dir<0?'down':'flat'}">${e.ctx?'·':e.dir>0?'↑':e.dir<0?'↓':'·'}</span>

    </span>

    </div>

      <button class="iconbtn" id="dprev" ${S.drawerIdx<=0?'disabled style="opacity:.3;transform:rotate(180deg)"':'style="transform:rotate(180deg)"'} aria-label="Previous batter">${icon(ICONS.chev)}</button>

    </div>
  </div>
  <div class="dbody">
    ${happened}
    <div class="verdict">
      <div class="vtop">

        <div class="vside">

        </div>
      </div>
      ${bd&&bd.n>60?`<div class="vcheck">Historically, scores in this band landed <b>${pct(bd.act,1)}</b> across
        <b>${bd.n.toLocaleString()}</b> settled picks — ${Math.abs(bd.act-bd.pred)*100<2?'closely matching':'running '+((bd.act-bd.pred)>0?'above':'below')+' '} the predicted <b>${pct(bd.pred,1)}</b>.${
        bd.nEra<200?` Almost all of that record predates the <b>${esc(S.cal.era)}</b> retrain.`:''}</div>`:''}
      ${waterfall(b)}
    </div>

    <div class="sec-h" style="margin-top:20px"><h2>Why</h2><p>Ranked by how much each factor moves this score</p></div>
    <div class="ev">${ev.signal.map(evRow).join('')}</div>

    ${ev.context.length?`<div class="sec-h" style="margin-top:20px"><h2>Context</h2><p>Real information the model does not train on</p></div>
    <div class="ev">${ev.context.map(evRow).join('')}</div>`:''}

    <div class="sec-h" style="margin-top:20px"><h2>Form</h2><p>Last 10 games — filled means he got a hit. Green stats favour him tonight, red work against him, each against the rest of the slate.</p></div>
    <div style="padding:2px 0 0">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        ${stripHTML(b.last10,'lg')}
        <span class="muted" style="font-size:12.5px">${b.last10?`hit in ${[...b.last10.slice(-10)].filter(c=>c==='1').length} of last ${Math.min(10,b.last10.length)}`:'no recent games'}</span>
      </div>
      <div class="sgrid" style="margin-top:12px">
        ${scell('Hit rate', pct(b.bHit,1),  `last ${b.bGames??'—'} g`, 'bHit',   b.bHit)}
        ${scell('xBA',      num(b.bXba,3),  'expected',                'bXba',   b.bXba)}
        ${scell('Hard-hit', pct(b.bHard,1), 'contact',                 'bHard',  b.bHard)}
        ${scell('BABIP',    num(b.bBabip,3),'luck check',              'bBabip', b.bBabip)}
        ${scell('K rate',   pct(b.bK,1),    'strikeouts',              'bK',     b.bK)}
