/** Slate-relative statistics — the field tonight is the only fair yardstick.
    Tonight's p_hit spans ~47–75%, so an absolute number tells you very little
    on its own; percentile within the slate is what makes a batter stand out. */
function slateStats(bs){
  const st = {};
  const cols = {p:'p',base:'base',delta:'delta',bHit:'bHit',bXba:'bXba',bHard:'bHard',bK:'bK',
                pCsw:'pCsw',pHard:'pHard',pRating:'pRating',bPA:'bPA',bQ3:'bQ3',pH9:'pH9'};
  for(const c in cols){
    const v = bs.map(b=>b[c]).filter(x=>x!=null).sort((a,b)=>a-b);
    st[c] = v.length ? {min:v[0], max:v[v.length-1], med:v[Math.floor(v.length/2)], sorted:v} : null;
  }
  st.pctl = (c,val) => {
    const s = st[c]; if(!s||val==null) return null;
    let lo=0,hi=s.sorted.length;
    while(lo<hi){ const m=(lo+hi)>>1; if(s.sorted[m]<val) lo=m+1; else hi=m; }
    return s.sorted.length<2 ? .5 : lo/(s.sorted.length-1);
  };
  return st;
}

/* ══════════════════════════════════════════════════════════════════════
   3 · the reason engine
   Turns 91 columns into ranked, plain-language evidence. Each item carries
   a direction, a strength (0–3) and — deliberately — whether the model
   actually trains on it. Context that only informs the reader's own judgment
   is labelled as such rather than being passed off as model signal.
   ══════════════════════════════════════════════════════════════════════ */
const IN_MODEL = new Set(['form','contact','whiff','pitcher','volume','park','rest','q3','pitchmix','role']);

/** Chips assert a claim ("Cold stretch"); drawer rows name a category
    ("Recent form"). Same evidence, two registers — a chip that reads
    "↑ Whiff risk" is ambiguous about who the arrow is good for. */
const PHRASE = {
  form:     [ 'Cold stretch',        'Hot at the plate'   ],
  contact:  [ 'Weak contact',        'Hard contact'       ],
  whiff:    [ 'High whiff risk',     'Low whiff risk'     ],
  pitcher:  [ 'Tough arm',           'Beatable arm'       ],
  volume:   [ 'Fewer trips up',      'Extra trips up'     ],
  pitchmix: [ 'Mix works on him',    'Mix suits him'      ],
  park:     [ "Pitcher's park",      "Hitter's park"      ],
  q3:       [ 'Slow starter',        'Strong early ABs'   ],
  rest:     [ 'Long layoff',         'Rested'             ]
};
const phraseOf = e => e.ctx ? e.label : (PHRASE[e.k]?.[e.dir>0?1:0] || e.label);

function evidence(b, st){
  const out = [];
  const add = (o) => { if(o) out.push(o); };
  const rel = (c,v) => { const p = st.pctl(c,v); return p==null?null:p; };
  const grade = p => p==null?0 : p>=.85?3 : p>=.68?2 : p>=.55?1 : p<=.15?-3 : p<=.32?-2 : p<=.45?-1 : 0;

  // 1 — recent form (trailing hit rate) + the visible last-10 streak
  {
    const p = rel('bHit', b.bHit), g = grade(p);
    const hits = b.last10 ? [...b.last10].filter(c=>c==='1').length : null;
    const span = b.last10 ? b.last10.length : 0;
    let txt = `Trailing hit rate ${pct(b.bHit,1)} over ${b.bGames??'—'} games`;
    if(hits!=null) txt += ` · hit in ${hits} of last ${span}`;
    add({ k:'form', dir:Math.sign(g), s:Math.abs(g), label:'Recent form', text:txt,
          val:pct(b.bHit,1), pctl:p });
  }
  // 2 — contact quality (xBA + hard-hit): the "is the form real" check
  {
    const px = rel('bXba', b.bXba), ph = rel('bHard', b.bHard);
    const p = px==null?ph : ph==null?px : (px*.6+ph*.4), g = grade(p);
    add({ k:'contact', dir:Math.sign(g), s:Math.abs(g), label:'Contact quality',
          text:`xBA ${num(b.bXba,3)} · hard-hit ${pct(b.bHard,1)} · BABIP ${num(b.bBabip,3)}`,
          val:num(b.bXba,3), pctl:p,
          note: (b.bHit!=null&&b.bXba!=null&&b.bHit-b.bXba>.05) ? 'Results are running ahead of contact quality — some of this form is luck.'
              : (b.bXba!=null&&b.bHit!=null&&b.bXba-b.bHit>.05) ? 'Contact quality is ahead of results — hits may be owed.' : null });
  }
  // 3 — whiff risk: batter K rate against this pitcher's CSW / K rate
  {
    const bk = rel('bK', b.bK), pc = rel('pCsw', b.pCsw);
    const risk = (bk==null?.5:bk)*.5 + (pc==null?.5:pc)*.5;   // high = bad for the batter
    const g = grade(1-risk);
    add({ k:'whiff', dir:Math.sign(g), s:Math.abs(g), label:'Whiff risk',
          text:`Batter K ${pct(b.bK,1)} vs pitcher CSW ${pct(b.pCsw,1)}${b.pK9!=null?` · ${num(b.pK9,1)} K/9`:''}`,
          val:pct(b.bK,1), pctl:1-risk });
  }
  // 4 — the pitcher he actually faces
  {
    const p = rel('pRating', b.pRating);
    const g = grade(p==null?null:1-p);                       // strong pitcher = bad for batter
    const line = [];
    if(b.pEra!=null) line.push(`${num(b.pEra,2)} ERA`);
    if(b.pWhip!=null) line.push(`${num(b.pWhip,2)} WHIP`);
    if(b.pH9!=null) line.push(`${num(b.pH9,1)} H/9`);
    const rank = p==null ? ''
      : p<=.05 ? ", among the weakest arms on this card"
      : p>=.95 ? ", among the toughest arms on this card"
      : `, stronger than ${Math.round(p*100)}% of the arms on this card`;
    // The model grades arms on CSW / K-BB / hard-hit allowed, not on ERA. When
    // those two views disagree, say so — a "beatable arm" chip next to a 2.50
    // ERA otherwise just looks broken.
    const disagree = p!=null && b.pEra!=null &&
      ((p<.4 && b.pEra<3.4) ? 'His ERA looks better than his underlying stuff — the grade is built on contact quality and whiffs, not runs allowed.'
     : (p>.6 && b.pEra>4.5) ? 'His ERA looks worse than his underlying stuff — the grade weighs whiffs and contact quality over runs allowed.' : null);
    add({ k:'pitcher', dir:Math.sign(g), s:Math.abs(g),
          label:`Opposing ${b.pRole==='RP'?'reliever':'starter'}`,
          text:`${b.pit||'TBD'} (${b.pitHand||'?'}HP) — grade ${b.pGrade||'?'}${rank}. Season: ${line.join(' · ')||'no line'}`,
          val:b.pGrade||'—', pctl:p==null?null:1-p,
          note:b.opener?'Listed as an opener — expect a short outing and an early bullpen look.'
             : b.pRookie?'Rookie arm — limited book on him, treat the grade as provisional.'
             : disagree });
  }
  // 5 — plate-appearance volume: more trips = more chances, the most literal driver
  {
    const p = rel('bPA', b.bPA), g = grade(p);
    const slotTxt = b.slot ? `Batting ${b.slot}${['th','st','nd','rd'][b.slot%10>3?0:(b.slot%100-b.slot%10==10)?0:b.slot%10]||'th'}` : 'Slot unknown';
    add({ k:'volume', dir:Math.sign(g), s:Math.abs(g), label:'Plate appearances',
          text:`${slotTxt} — averaging ${num(b.bPA,2)} PA / ${num(b.bAB,2)} AB per game`,
          val:num(b.bPA,2), pctl:p });
  }
  // 6 — pitch-mix fit: weight his per-pitch-type success by what this arm throws
  {
    if(b.useFb!=null && b.hrFb!=null){
      const fit = (b.useFb*b.hrFb) + (b.useBb??0)*(b.hrBb??0) + (b.useOs??0)*(b.hrOs??0);
      const d = b.hrAll!=null ? fit-b.hrAll : null;
      const g = d==null?0 : d>.02?2 : d>.007?1 : d<-.02?-2 : d<-.007?-1 : 0;
      const mix = [['fastball',b.useFb,b.hrFb],['breaking',b.useBb,b.hrBb],['offspeed',b.useOs,b.hrOs]]
        .sort((a,c)=>(c[1]||0)-(a[1]||0));
      add({ k:'pitchmix', dir:Math.sign(g), s:Math.abs(g), label:'Pitch-mix fit',
            text:`Throws ${pct(mix[0][1],0)} ${mix[0][0]}; he reaches base ${pct(mix[0][2],1)} against it (${pct(b.hrAll,1)} overall)`,
            val:(d==null?'—':(d>0?'+':'')+ (d*100).toFixed(1)+'pt') });
    }
  }
  // 7 — park
  {
    if(b.park!=null && Math.abs(b.park-1)>.005){
      const g = b.park>1.03?2 : b.park>1.01?1 : b.park<.97?-2 : b.park<.99?-1 : 0;
      add({ k:'park', dir:Math.sign(g), s:Math.abs(g), label:'Ballpark',
            text:`Park factor ${num(b.park,2)} — ${b.park>1?'plays up':'suppresses'} offence by ${Math.abs((b.park-1)*100).toFixed(0)}%`,
            val:num(b.park,2) });
    }
  }
  // 8 — first-three-AB quality: does he do damage before the bullpen arrives
  {
    if(b.bQ3!=null && (b.bQ3n??0)>=10){
      const p = rel('bQ3', b.bQ3), g = grade(p);
      add({ k:'q3', dir:Math.sign(g), s:Math.abs(g), label:'Early-game quality',
            text:`${pct(b.bQ3,1)} quality contact in his first 3 ABs (${b.bQ3n} games)`, val:pct(b.bQ3,1), pctl:p });
    }
  }
  // 9 — rest
  {
    if(b.bRest!=null && b.bRest>=2){
      add({ k:'rest', dir:b.bRest>=4?-1:0, s:b.bRest>=4?1:0, label:'Time off',
            text:`${b.bRest} days since his last game${b.bRest>=4?' — rust risk on a long layoff':''}`, val:b.bRest+'d' });
    }
  }
  // ── context only — real information, explicitly not model signal ────────
  // starter vs reliever split
  if(b.vsSP!=null && (b.paSP??0)>=50){
    const d = (b.vsRP!=null&&(b.paRP??0)>=50) ? b.vsSP-b.vsRP : null;
    add({ k:'splits', dir:0, s:0, label:'Starters vs relievers', ctx:true,
          text:`${pct(b.vsSP,1)} vs SP (${b.paSP} PA) · ${b.vsRP!=null?pct(b.vsRP,1)+` vs RP (${b.paRP} PA)`:'no RP sample'}${d?` — ${Math.abs(d*100).toFixed(1)}pt ${d>0?'better':'worse'} against starters`:''}`,
          val:pct(b.vsSP,1) });
  }
  // platoon — computed for display, measured at −0.0001 AUC and cut from FEATURES on 2026-07-25
  if(b.splitDiff!=null && Math.abs(b.splitDiff)>.01 && b.vsL!=null && b.vsR!=null){
    add({ k:'platoon', dir:0, s:0, label:'Platoon split', ctx:true,
          text:`${pct(b.vsL,1)} vs LHP · ${pct(b.vsR,1)} vs RHP — faces a ${b.pitHand}HP in this game`,
          val:(b.splitDiff>0?'+':'')+(b.splitDiff*100).toFixed(1)+'pt',
          note:'Tested and cut from the model on 2026-07-25 (no measurable lift). Shown for your read, not the score.' });
  }
  // batter vs pitcher history — almost always too small to mean anything
  if((b.bvpAB??0)>0){
    add({ k:'bvp', dir:0, s:0, label:'Career vs this pitcher', ctx:true,
          text:`${b.bvpH}-for-${b.bvpAB} (${num(b.bvpAvg,3)})${b.bvpAB<20?' — sample far too small to lean on':''}`,
          val:`${b.bvpH}/${b.bvpAB}` });
  }
  if(b.bRookie){
    add({ k:'rookie', dir:0, s:0, label:'Rookie bat', ctx:true, warn:true,
          text:`${b.bSeasonG??'few'} career games — trailing windows are thin and the score is less settled.`, val:'ROOKIE' });
  }
  if(!b.confirmed){
    add({ k:'est', dir:0, s:0, label:'Projected lineup', ctx:true, warn:true,
          text:'This lineup is estimated, not posted. Slot, and therefore expected plate appearances, can still change.', val:'EST' });
  }
  // rank: model-signal items by strength, context after
  const sig = out.filter(o=>!o.ctx).sort((a,b2)=>b2.s-a.s || Math.abs(b2.dir)-Math.abs(a.dir));
  const ctx = out.filter(o=>o.ctx);
  return {signal:sig, context:ctx, all:sig.concat(ctx)};
}

/** One-sentence verdict: strongest push, strongest drag, honest hedge. */
function verdict(b, ev, st){
  const up   = ev.signal.filter(e=>e.dir>0 && e.s>=2)[0];
  const down = ev.signal.filter(e=>e.dir<0 && e.s>=2)[0];
  const r = rankOf(b);
  const where = r ? `<b>#${r}</b> of ${S.batters.length} on this slate` : '';
  const lo = e => phraseOf(e).toLowerCase();
  const lead = up && down ? `${lo(up)} carries it, ${lo(down)} holds it back`
             : up ? `carried by ${lo(up)}`
             : down ? `dragged down by ${lo(down)}`
             : 'no single factor dominates';
  return { where, lead };
}

/* ══════════════════════════════════════════════════════════════════════
   4 · calibration — measured, not claimed
   ══════════════════════════════════════════════════════════════════════ */
async function calibration(){
  return load('cal', async () => {
    const {body} = await getAny(['./picks_log.csv','/picks_log.csv'],{timeout:25000});
    const rows = parseCSV(body);
    const bands=new Map(), tags=new Map(), days=new Map();
    let n=0, brier=0, sumP=0, hits=0;
    for(const r of rows){
      const p=N(r.p_hit), a=r.actual_hit;
      if(p==null || (a!=='0'&&a!=='1')) continue;
      const y=+a; n++; brier+=(p-y)**2; sumP+=p; hits+=y;
      const bk=Math.min(.75,Math.max(.2,Math.floor(p*20)/20));
      const B=bands.get(bk)||{n:0,h:0,p:0}; B.n++; B.h+=y; B.p+=p; bands.set(bk,B);
      if(r.lean_tag){ const T=tags.get(r.lean_tag)||{n:0,h:0,p:0}; T.n++; T.h+=y; T.p+=p; tags.set(r.lean_tag,T); }
      const D=days.get(r.date)||{n:0,h:0,p:0}; D.n++; D.h+=y; D.p+=p; days.set(r.date,D);
    }
    return {
      n, brier:brier/n, baseRate:hits/n, meanP:sumP/n,
      bands:[...bands.entries()].sort((a,b)=>a[0]-b[0]).map(([k,v])=>({band:k,...v,act:v.h/v.n,pred:v.p/v.n})),
      tags:[...tags.entries()].map(([k,v])=>({tag:k,...v,act:v.h/v.n,pred:v.p/v.n})).sort((a,b)=>b.act-a.act),
      days:[...days.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>({date:k,...v,act:v.h/v.n,pred:v.p/v.n}))
    };
  });
}
/** What a score in this band has actually done historically. The single most
    mission-critical number on the page: it audits the score in front of you. */
function bandFor(cal,p){
  if(!cal||p==null) return null;
  const k=Math.min(.75,Math.max(.2,Math.floor(p*20)/20));
  return cal.bands.find(b=>b.band===k) || null;
}

const S = {                                   // app state

const TODAY = () => new Date().toLocaleDateString('en-CA');   // local, not UTC

async function loadSlate(){
  // Tonight is the live file; any other date comes from the slates/ archive.
  // Dual paths because the same page is served by Flask and by GH Pages —
  // the mirror ships the identical CSVs as static files (push_to_dash()).
  const paths = S.date
    ? (ON_SERVER ? ['/slate/'+S.date, './slates/'+S.date+'.csv'] : ['./slates/'+S.date+'.csv'])
    : (ON_SERVER ? ['/csv','./tonight_p_hit.csv'] : ['./tonight_p_hit.csv']);
  const {body,modified} = await getAny(paths, {timeout:20000});
  const rows = parseCSV(body).filter(r=>r.name && r.p_hit);
  if(!rows.length) throw new Error('no rows in that slate');
  S.batters = rows.map(toBatter);
  S.st = slateStats(S.batters);
  S._rank = null;
  S.modified = modified;
  // The snapshot is a per-day "what changed since this morning" baseline for
  // the LIVE slate. Running it on an archive would diff a finished day against
  // today's baseline and — worse — overwrite that baseline with archived rows.
  if(!S.date) snapshotDiff();
  else S.snap = null;
}
/** Archive dates for the picker. /slates locally; on the mirror the static
    slates_index.json manifest push_to_dash() ships, since GitHub Pages can't
    list a directory. Absent manifest → no picker, never an error. */
async function loadDates(){
  try{
    const {body} = await getAny(
      ON_SERVER ? ['/slates','./slates_index.json'] : ['./slates_index.json'],
      {json:true,timeout:8000});
    S.dates = Array.isArray(body) ? [...body].sort().reverse() : [];
  }catch(e){ S.dates = []; }
}
/** Switch the whole board to another date (or back to tonight with ''). */
async function goDate(d){
  if(d === S.date) return;
  const prev = S.date;
  S.date = d;
  try{
    await loadSlate();
  }catch(e){
    S.date = prev;
    toast(/404/.test(e.message) ? `No archived slate for ${d}` : `Couldn't load ${d}`);
    renderDateSel();
    return;
  }
  S.live = {}; clearTimeout(liveTimer);
  S.preview = {};        // what-ifs belong to the slate they were opened on
  render();
  if(!S.date) loadLive().then(()=>{ render(); scheduleLive(); });
}
/** "Since this morning" — the day's highest-value moment is lineup
    confirmation at ~12:00 PT. Nothing server-side records it, so we keep a
    per-day local snapshot and diff against it. */
function snapshotDiff(){
  const today = new Date().toISOString().slice(0,10);
  const prev = store.get('snap.'+today, null);
  if(prev){
    S.snap = {at:prev.at, moves:[]};
    for(const b of S.batters){
      const o = prev.rows[key(b)];
      if(!o){ S.snap.moves.push({b, kind:'new'}); continue; }
      const dp = b.p - o.p;
      const confirmedNow = b.confirmed && !o.confirmed;
      if(Math.abs(dp) >= .015 || confirmedNow || b.slot !== o.slot)
        S.snap.moves.push({b, kind:'move', dp, confirmedNow, slotFrom:o.slot});
    }
    for(const k in prev.rows){
      if(!S.batters.some(b=>key(b)===k)) S.snap.moves.push({name:prev.rows[k].name, team:prev.rows[k].team, kind:'gone'});
    }
    S.snap.moves.sort((a,b)=>Math.abs(b.dp||0)-Math.abs(a.dp||0));
  }
  const rows={}; S.batters.forEach(b=>rows[key(b)]={p:b.p,confirmed:b.confirmed,slot:b.slot,name:b.name,team:b.team});
  if(!prev || (Date.now()-new Date(prev.at).getTime())>1000*60*60*10)
    store.set('snap.'+today,{at:new Date().toISOString(),rows});
  else store.set('snap.'+today,{at:prev.at,rows:prev.rows});   // keep the morning baseline
}
const loadJSON = f => load('j'+f, async()=>{ try{ return (await get('./'+f,{json:true,timeout:12000})).body; }catch(e){ return null; } });

/** Live scores — one call for the whole slate, refreshed only while a game
    is in progress and the tab is visible. */
async function loadLive(){
  if(S.date) return;                 // an archived day has nothing live to poll
  const d = new Date(), date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  try{
    // linescore(defense) carries who is ACTUALLY on the mound right now — the
    // input to the live pitcher swap. It rides along on the one schedule call
    // the ticker already makes, so the swap costs no extra request.
    const {body} = await get(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}&hydrate=linescore(defense)`,{json:true,timeout:8000});
    const m={};
    (body.dates?.[0]?.games||[]).forEach(g=>{
      m[g.gamePk] = {
        state:g.status?.detailedState||'', abstract:g.status?.abstractGameState||'',
        away:g.teams?.away?.score, home:g.teams?.home?.score,
        awayAbbr:g.teams?.away?.team?.abbreviation, homeAbbr:g.teams?.home?.team?.abbreviation,
        inning:g.linescore?.currentInningOrdinal, half:g.linescore?.inningHalf,
        outs:g.linescore?.outs,
        pitcherId:g.linescore?.defense?.pitcher?.id!=null ? String(g.linescore.defense.pitcher.id) : null,
        pitcherName:g.linescore?.defense?.pitcher?.fullName || ''
      };
    });
    S.live = m;
  }catch(e){ /* silent: live data is an enhancement, never a dependency */ }
}
let liveTimer=null;
function scheduleLive(){
  clearTimeout(liveTimer);
  if(S.date) return;
  const anyLive = Object.values(S.live).some(g=>g.abstract==='Live') ||
                  S.batters.some(b=>(b.gameState||'').includes('Progress'));
  if(!anyLive) return;
  liveTimer = setTimeout(async()=>{ if(!document.hidden){ await loadLive(); render(); } scheduleLive(); }, 45000);
}

/* ── watchlist ───────────────────────────────────────────────────────────
   Watch is this dashboard's answer to a bet slip: the set of batters you have
   decided to follow tonight. Starring used to require opening the drawer,
   which is a lot of taps to build a list of eight. Every row carries its own
   star now; the drawer's button stays for when you're already in there. */
const isStarred = b => S.stars.includes(key(b));
function toggleStar(k, name){
  const on = S.stars.includes(k);
  S.stars = on ? S.stars.filter(x=>x!==k) : S.stars.concat(k);
  store.set('stars', S.stars);
  toast(on ? `Removed ${name||'batter'}` : `Watching ${name||'batter'} · ${S.stars.length} on the list`);
  render();
  if(!$('#drawer').hidden) renderDrawer();
}
/** The star itself. Never nested inside .bcard — that element is a <button>,
    and a button inside a button is invalid and behaves unpredictably. It sits
    as a sibling, absolutely positioned over the row's right edge. */
function starBtn(b, cls=''){
  const on = isStarred(b);
  return `<button class="star${on?' on':''} ${cls}" data-star="${key(b)}" data-name="${esc(b.name)}"
    aria-pressed="${on}" aria-label="${on?'Remove':'Add'} ${esc(b.name)} ${on?'from':'to'} watchlist"
    title="${on?'On your watchlist':'Add to watchlist'}">${icon(ICONS.watch)}</button>`;
}

function meter(b){
  const s=S.st.p; if(!s) return '';
  const span=(s.max-s.min)||1;
  const w=clamp((b.p-s.min)/span,0,1)*100, med=clamp((s.med-s.min)/span,0,1)*100;
  return `<span class="meter ${tcls(b.p)}" role="img" aria-label="${pct(b.p,1)}, slate median ${pct(s.med,1)}"><i style="width:${w.toFixed(1)}%"></i><b style="left:${med.toFixed(1)}%"></b></span>`;
}
/** The lineup slot drawn as a scorecard diamond. The batting order is one of
    the few numbers here that is a baseball object rather than a statistic, and
    a rotated square with the number inside it is how every scorecard in the
    game has drawn it — it costs nothing and it reads instantly. */
const slotDiamond = s => s
  ? `<span class="dia" title="Bats ${s} in the order" role="img" aria-label="bats ${s}"><i>${s}</i></span>`
  : `<span class="muted">slot TBD</span>`;
function stripHTML(l10){
  if(!l10) return '<span class="muted" style="font-size:11px">no recent games</span>';
  const s=l10.slice(-10);
  return `<span class="strip" role="img" aria-label="hit in ${[...s].filter(c=>c==='1').length} of last ${s.length}">`+
    [...s].map(c=>`<i class="${c==='1'?'h':'n'}"></i>`).join('')+`</span>`;
}
function lineupTag(b){
  return b.confirmed ? `<span class="tag conf">confirmed</span>` : `<span class="tag est">projected</span>`;
}
const isFinal = b => /final|game over/i.test(S.live[b.gamePk]?.state||b.gameState||'');
/** True once every game has ended — then "final" is a property of the slate,
    not of each batter, and belongs in the ribbon instead of on 270 cards. */
const slateOver = () => S.batters.length>0 && S.batters.every(isFinal);
function stateTag(b){
  const g=S.live[b.gamePk], s=(g?.state||b.gameState||'');
  if(b.hasHit) return `<span class="tag hit">hit ✓</span>`;
  if(/progress|live/i.test(s)) return `<span class="tag live">${esc(g?.inning?(g.half||'')+' '+g.inning:'live')}</span>`;
  if(/final|game over/i.test(s) && !slateOver()) return `<span class="tag">final</span>`;
  return '';
}
function chipFor(e){
  const cls = e.warn?'warn' : e.ctx?'out' : e.dir>0?'up' : e.dir<0?'down' : 'flat';
  const arrow = e.ctx?'' : e.dir>0?'↑' : e.dir<0?'↓' : '·';
  return `<span class="chip ${cls}">${arrow?arrow+' ':''}${esc(phraseOf(e))}${e.val?` <span class="k">${esc(e.val)}</span>`:''}</span>`;
}
/** Rank within tonight's field. With scores packed into 47–75%, "3rd of 270"
    communicates standing far better than the percentage on its own. */
function rankOf(b){
  if(!S._rank){ S._rank=new Map(); [...S.batters].sort((x,y)=>y.p-x.p).forEach((x,i)=>S._rank.set(key(x),i+1)); }
  return S._rank.get(key(b));
}
/** `hero` gets a categorically different treatment, not a bigger card: accent
    rule, gradient wash, 60px score. One thing on the page is loudest. */
function batterCard(b, rank, hero, idx){
  const ev = evidence(b,S.st);
  const narrow = window.innerWidth < 600;
  const top = ev.signal.filter(e=>e.s>=2).slice(0, hero ? (narrow?2:3) : 2);
  // 'est' is already stated by the PROJECTED tag on the name line — repeating
  // it as a chip costs a whole row on a phone and says nothing new. It stays
  // in the drawer's Context list, where it explains the consequence.
  const flags = ev.context.filter(e=>e.warn && e.k!=='est').slice(0,1);
  const r = rankOf(b);
  const p = pct(b.p,1).replace('%','');
  // --i drives the staggered entrance in the Aurora theme. Capped at 14 so a
  // 270-row list does not end with a nine-second cascade.
  const pos = rank ?? idx ?? 0;
  const stagger = Math.min(pos, 14);
  return `<div class="brow${hero?' hero':''}"><button class="bcard${hero?' hero':''}${pos<20?' stagger':''}" data-k="${key(b)}" style="--i:${stagger};--tc:${tc(b.team,'var(--line2)')}">
    ${hero?SEAM_MARK:''}
    <span class="rank num">${rank!=null?rank:''}${hero?'<b>RANK</b>':''}</span>
    <span class="bmain">
      <span class="bname">${esc(b.name)} ${lineupTag(b)} ${stateTag(b)}</span>
      <span class="bmeta"><span class="num tm" style="color:${tc(b.team)}">${esc(b.team)}</span> · ${matchupHTML(b.matchup)} · ${slotDiamond(b.slot)} · vs ${esc(b.pit||'TBD')} ${gradePill(b.pGrade)}</span>
      <span class="bwhy">${top.map(chipFor).join('')}${flags.map(chipFor).join('')}${stripHTML(b.last10)}</span>
    </span>
    <span class="bscore">
      <span class="pct ${tcls(b.p)}">${p}<span>%</span></span>
      ${meter(b)}
      <span class="slaterank">${r?`#${r} of ${S.batters.length}`:''}</span>
    </span>
  </button>${starBtn(b)}</div>`;
}

function ribbon(){
  const bs=S.batters, games=new Set(bs.map(b=>b.gamePk)).size;
  const conf=bs.filter(b=>b.confirmed).length;
  const live=bs.some(b=>/progress/i.test(S.live[b.gamePk]?.state||b.gameState||''));
  const when = S.modified ? new Date(S.modified) : null;
  const ago = when ? Math.round((Date.now()-when)/60000) : null;
  const over = slateOver();
  const stale = ago!=null && ago>360;
  const cell = (label,value,cls='') => `<div class="rcell"><div class="lbl">${label}</div><div class="rv ${cls}">${value}</div></div>`;
  return `<div class="ribbon">
    ${cell(`<span class="dot ${live?'live':''}"></span>Games`, games)}
    ${cell('Confirmed', `${conf}<small> / ${bs.length}</small>`)}
    ${S.st.p?cell('Median', `${pct(S.st.p.med,0).replace('%','')}<small>%</small>`):''}
    ${S.st.p?cell('Range', `${pct(S.st.p.min,0).replace('%','')}–${pct(S.st.p.max,0).replace('%','')}<small>%</small>`):''}
    ${S.date ? cell('Slate', dateLabel(S.date).replace(' · preview','<small> preview</small>'))
             : (ago!=null?cell('Scored', `${ago<60?ago+'<small>m</small>':Math.round(ago/60)+'<small>h</small>'} ago`, stale?'warn':''):'')}

}

/* ── the honesty note ─────────────────────────────────────────────────────
   Shown, dismissible, and back in a month. A permanent dismissal would lose
   the caveat for good on a shared machine; a nag that returns every load is
   what made it invisible in the first place. */
const TRUTH_SNOOZE_DAYS = 30;
function truthDue(){
  const until = store.get('truthSnoozedUntil', 0);
  return !(typeof until==='number' && Date.now() < until);
}
function snoozeTruth(){
  store.set('truthSnoozedUntil', Date.now() + TRUTH_SNOOZE_DAYS*864e5);
  toast('Hidden — still on the Honesty tab');
  render();
}

/* ── Today ─────────────────────────────────────────────────────────── */
function viewToday(){
  const cal=S.cal;
  const ranked=[...S.batters].sort((a,b)=>b.p-a.p);
  const short=ranked.slice(0,10);
  let truth='';
  if(cal && truthDue()){
    const strong=cal.tags.find(t=>t.tag==='STRONG'), avoid=cal.tags.find(t=>t.tag==='AVOID');
    const spread = strong&&avoid ? ((strong.act-avoid.act)*100).toFixed(1) : '—';
    // Collapsed by default and dismissible. It used to open itself on every
    // load forever — a caveat you have already read ten times is not a caveat,
    // it is furniture, and the standing version of this lives on Honesty.
    truth=`<details class="truth" id="truth">
      <summary>${icon(ICONS.info)}<span><b>Read the spread, not the label.</b> The best and worst matchup
        tags are only <b class="num">${spread}</b> points apart in reality.</span>
        <button class="truthx" id="truthx" title="Hide this for a month — it stays on the Honesty tab"
          aria-label="Dismiss this note">×</button></summary>
      <div class="more">Across ${cal.n.toLocaleString()} settled picks the model's
        <span class="num">STRONG</span> matchups landed <b class="num">${pct(strong?.act,1)}</b> and
        <span class="num">AVOID</span> landed <b class="num">${pct(avoid?.act,1)}</b>. Every tier has come in
        above its predicted rate, so the score is honest about direction but conservative about level.
        Treat it as one input to your own read, not a verdict.
        <button class="lnk" data-go="honesty" style="display:block;margin-top:6px">See the full record →</button></div>
    </details>`;
  }

  // since-this-morning
  let sinceHTML='';
  if(S.snap && S.snap.moves.length){
    const t=new Date(S.snap.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    const mv=S.snap.moves.slice(0,8);
    sinceHTML=`<section class="sec">
      <div class="sec-h"><h2>Since ${t}</h2><p>What changed while you were away</p></div>
      <div class="blist">${mv.map(m=>{
        if(m.kind==='gone') return `<div class="bcard" style="cursor:default"><span class="rank">—</span>
          <span class="bmain"><span class="bname">${esc(m.name)}</span>
          <span class="bmeta">${esc(m.team)} · no longer in a projected lineup</span></span>
          <span class="bscore"><span class="chip down">dropped</span></span></div>`;
        const b=m.b, dp=m.dp||0;
        const bits=[];
        if(m.confirmedNow) bits.push(`<span class="chip up">lineup confirmed</span>`);
        if(m.slotFrom!=null && m.slotFrom!==b.slot) bits.push(`<span class="chip flat">slot ${m.slotFrom} → ${b.slot}</span>`);
        if(m.kind==='new') bits.push(`<span class="chip up">newly added</span>`);
        return `<button class="bcard" data-k="${key(b)}"><span class="rank num">${dp?((dp>0?'+':'')+(dp*100).toFixed(1)):'·'}</span>
          <span class="bmain"><span class="bname">${esc(b.name)} ${stateTag(b)}</span>
          <span class="bmeta">${esc(b.team)} · ${esc(b.matchup)} · vs ${esc(b.pit||'TBD')}</span>
          <span class="bwhy">${bits.join('')}</span></span>
          <span class="bscore"><span class="pct ${tcls(b.p)}">${pct(b.p,1)}</span>${meter(b)}</span></button>`;
      }).join('')}</div>
    </section>`;
  }

  const bandNote = b => { const bd=bandFor(S.cal,b?.p); return bd&&bd.n>60 ? `<span class="muted">history: this band has landed <span class="num">${pct(bd.act,1)}</span> over ${bd.n.toLocaleString()} picks</span>` : ''; };

  return `${ribbon()}${truth}
  <section class="sec">
    <div class="sec-h"><h2>${S.date?'Shortlist':"Tonight's shortlist"}</h2><p>Highest calibrated hit probability on the slate</p>
      <button class="lnk" data-go="batters">All ${S.batters.length} →</button></div>
    <div class="blist">${short.map((b,i)=>batterCard(b,i+1,i===0)).join('')}</div>
    <div style="margin-top:10px;font-size:12px" class="muted">
      ${bandNote(short[0])} · Ranking is by the model score alone; open any batter for the evidence behind it.
    </div>
  </section>
  ${sinceHTML}
  <section class="sec">
    <div class="sec-h"><h2>Games</h2><p>${new Set(S.batters.map(b=>b.gamePk)).size} on the card</p>
      <button class="lnk" data-go="games">Detail →</button></div>
    <div class="games">${gameCards(true)}</div>
  </section>`;
}

/* ── Batters ───────────────────────────────────────────────────────── */
function filtered(){
  const f=S.filters, q=f.q.toLowerCase();
  let list=S.batters.filter(b=>{
    if(q && !(b.name.toLowerCase().includes(q)||b.team.toLowerCase().includes(q)||(b.pit||'').toLowerCase().includes(q))) return false;
    if(f.team && b.team!==f.team) return false;
    if(f.game && b.gamePk!==f.game) return false;
    if(f.slot && String(b.slot)!==f.slot) return false;
    if(f.lineup==='conf' && !b.confirmed) return false;
    if(f.lineup==='est' && b.confirmed) return false;
    return true;
  });
  // dir: 1 = ascending, -1 = descending. Nulls always sort last.
  const k=f.sort;
  list.sort((a,b)=>{
    const va=a[k], vb=b[k];
    if(typeof va==='string'||typeof vb==='string') return f.dir*String(va??'').localeCompare(String(vb??''));
    if(va==null) return 1; if(vb==null) return -1;
    return f.dir*(va-vb);
  });
  return list;
}
function viewBatters(){
  const f=S.filters, list=filtered();
  const teams=[...new Set(S.batters.map(b=>b.team))].sort();

    ['name','Batter',''],['team','Tm','c'],['slot','Slot','c'],['p','Score','sch'],['base','Form','r'],

  // stylesheet so the table can be table-layout:fixed (see .tblwrap)

    .map(c=>`<col class="c-${c}">`).join('');
  return `${ribbon()}
  <div class="filters">
    <label class="field">${icon(ICONS.search)}<input id="fq" placeholder="Batter, team, pitcher" value="${esc(f.q)}" aria-label="Search"></label>
    <label class="field"><select id="fteam" aria-label="Team"><option value="">All teams</option>${teams.map(t=>`<option ${f.team===t?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="field"><select id="fgame" aria-label="Game"><option value="">All games</option>${games.map(([pk,m])=>`<option value="${pk}" ${f.game===pk?'selected':''}>${esc(m)}</option>`).join('')}</select></label>
    <label class="field"><select id="fslot" aria-label="Lineup slot"><option value="">Any slot</option>${[1,2,3,4,5,6,7,8,9].map(s=>`<option ${f.slot==s?'selected':''}>${s}</option>`).join('')}</select></label>
    <div class="seg" role="group" aria-label="Lineup status">
      <button data-lu="" aria-pressed="${f.lineup===''}">All</button>
      <button data-lu="conf" aria-pressed="${f.lineup==='conf'}">Confirmed</button>
      <button data-lu="est" aria-pressed="${f.lineup==='est'}">Projected</button>
    </div>
    <span class="muted" style="font-size:12.5px">${list.length} shown</span>
  </div>
  <div class="tblwrap" style="display:none" id="tbl">
    <table><colgroup>${colgroup}</colgroup><thead><tr>${cols.map(([k,l,a])=> k===''
      ? `<th class="${a}" aria-label="Watchlist"></th>`      // star column — nothing to sort by
      : `<th class="sortable ${a}" data-sort="${k}" ${f.sort===k?`aria-sort="${f.dir<0?'descending':'ascending'}"`:''}>${l}</th>`).join('')}</tr></thead>
    <tbody>${list.map(b=>{
      const d=b.delta;
      return `<tr data-k="${key(b)}">
        <td class="ell"><b>${esc(b.name)}</b> ${b.confirmed?'':'<span class="tag est">est</span>'} ${stateTag(b)}</td>
        <td class="c num tm" style="color:${tc(b.team)}">${esc(b.team)}</td>
        <td class="c">${b.slot?slotDiamond(b.slot):'—'}</td>
        <td class="sc"><b class="num ${tcls(b.p)}">${pct(b.p,1)}</b>${meter(b)}</td>
        <td class="r num">${pct(b.base,1)}</td>
        <td class="r num" style="color:${d>0?'var(--tier-hi)':d<0?'var(--bad)':'var(--ink3)'}">${d==null?'—':(d>0?'+':'')+(d*100).toFixed(1)}</td>
        <td class="r num">${pct(b.bHit,1)}</td>
        <td class="r num">${num(b.bXba,3)}</td>
        <td class="r num">${pct(b.bK,1)}</td>
        <td class="ell">${esc(b.pit||'TBD')} ${gradePill(b.pGrade||'?')}</td>
        <td class="r num">${b.pRating??'—'}</td>
        <td class="r num">${num(b.bPA,2)}</td>

/* ── Games ─────────────────────────────────────────────────────────── */
/* ── bullpen preview — "who else could be on that mound?" ────────────────
   live_slate.py's build_bullpen_preview() scores every batter against every
   plausible arm on the opposing roster ahead of time, because the model
   (HistGBM + isotonic) only exists in that process and can never run in the
   browser. Shape: {gamePk: {pitchingTeam: {pitcherId: {…stats, batters:
   {batterId: p_hit}}}}} — so a swap is a lookup, not a re-score.
   Tonight only: the file is rebuilt each slate run and keyed by tonight's
   game_pks, so it is not offered while an archive date is loaded. */
const previewKey = (pk,team) => pk+'|'+team;
/** Candidate arms for the side batting for `team` — i.e. the OPPOSING roster. */
function bullpenFor(pk, battingTeam, teams){
  if(S.date || !S.bullpen) return null;
  const opp = teams.find(t=>t!==battingTeam);
  const cands = opp ? S.bullpen[String(pk)]?.[opp] : null;
  return cands && Object.keys(cands).length ? cands : null;
}
/** Which arm this side's scores should be shown against, and why.
    A manual pick is an explicit choice and always wins over the live swap. */
function armFor(pk, team, cands){
  const pid = S.preview[previewKey(pk,team)];
  if(pid && cands?.[pid]) return {pid, live:false, ...cands[pid]};

  // Live auto-swap: the pitcher actually on the mound, from the same schedule
  // call the ticker uses. Looked up in the OPPONENT's candidate map, which is
  // what keeps this correct without knowing who is batting — at any moment
  // only one team has a pitcher on the mound, so the other side simply misses
  // and stays on its probable starter.
  const g = S.live[pk] || {};
  const lp = g.abstract==='Live' ? g.pitcherId : null;         // pregame has no
  // "current" pitcher to differ from, and after Final the last arm of the night
  // is not what the day should be remembered by.
  const starter = String(S.batters.find(b=>b.gamePk===pk && b.team===team)?.pitId||'');
  if(lp && cands?.[lp] && lp !== starter) return {pid:lp, live:true, ...cands[lp]};
  return null;
}
/** This batter's score against whichever arm the side is previewing, or his
    real one. A candidate with no entry for a batter (roster churn between the
    slate run and now) falls back rather than showing a blank. */
function pFor(b, arm){
  const alt = arm?.batters?.[String(b.batterId)];
  return alt==null ? b.p : alt;
}
const ROLE_ORDER = {SP:0, RP:1, '':2};
function armOptions(cands, sel){
  // SP before RP so an early-inning starter swap is the easy pick, then by
  // sample size; an unlabelled role has no trailing games to classify from.
  return Object.entries(cands)
    .sort((a,b)=>(ROLE_ORDER[a[1].role??''] - ROLE_ORDER[b[1].role??'']) || ((b[1].n_games||0)-(a[1].n_games||0)))
    .map(([pid,c])=>`<option value="${pid}" ${sel===pid?'selected':''}>${c.role?`(${c.role}) `:''}${esc(c.name)} · ${c.n_games||0}G${(c.n_games||0)<8?' ⚠':''}</option>`)
    .join('');
}
function setPreview(pk, team, pid){
  const k = previewKey(pk,team);
  if(pid) S.preview[k]=pid; else delete S.preview[k];
  render();
}

function gameCards(compact){
  const byGame=new Map();
  for(const b of S.batters){ if(!byGame.has(b.gamePk)) byGame.set(b.gamePk,[]); byGame.get(b.gamePk).push(b); }
  const games=[...byGame.entries()];
  games.sort((a,b)=>(a[1][0].startTime||'').localeCompare(b[1][0].startTime||''));
  return games.map(([pk,bs])=>{
    const g=S.live[pk]||{}, any=bs[0];
    const teams=[...new Set(bs.map(b=>b.team))];
    const sides=teams.map(t=>{
      const tb=bs.filter(b=>b.team===t).sort((a,b)=>(a.slot||99)-(b.slot||99));
      const arm=tb[0];
      const cands = compact ? null : bullpenFor(pk, t, teams);
      const alt = cands ? armFor(pk, t, cands) : null;
      const avgOf = f => tb.reduce((s,b)=>s+f(b),0)/tb.length;
      const avg = avgOf(b=>pFor(b,alt)), baseAvg = avgOf(b=>b.p);
      const top=[...tb].sort((a,b)=>pFor(b,alt)-pFor(a,alt)).slice(0,compact?3:9);
      const conf=tb.every(b=>b.confirmed);
      const dAvg = alt ? avg-baseAvg : 0;
      // Only a MANUAL pick marks an option selected — a live swap leaves the
      // picker on its default, whose label then says the swap is automatic.
      const manualPid = alt && !alt.live ? alt.pid : null;
      const picker = cands ? `<select class="psel" data-pk="${pk}" data-team="${esc(t)}"
          aria-label="Preview ${esc(t)} against a different arm"
          title="Score this lineup against another arm on the ${esc(teams.find(x=>x!==t)||'')} roster">
          <option value="">${alt&&alt.live?'Auto · whoever is pitching':'Probable starter'}</option>${armOptions(cands, manualPid)}</select>` : '';
      return `<div class="gside" style="--tc:${tc(t,'var(--line2)')}">
        <div><span class="gteam" style="color:${tc(t,'var(--ink)')}">${esc(t)}</span>
          <div class="num" style="font-size:10.5px;color:var(--ink3)"><span class="${tcls(avg)}">${pct(avg,0)}</span> avg${
            alt?` <span class="delta ${dAvg>=0?'up':'down'}">${dAvg>=0?'+':''}${(dAvg*100).toFixed(1)}</span>`:''}</div></div>
        <div class="gvs">vs <b>${esc(alt?alt.name:(arm.pit||'TBD'))}</b> ${
            alt ? (alt.hand?`(${alt.hand})`:'') : (arm.pitHand?`(${arm.pitHand})`:'')}
          ${(alt?alt.p_era:arm.pEra)!=null?`<span class="num">${num(alt?alt.p_era:arm.pEra,2)} ERA</span>`:''}
          ${alt ? `<span class="tag ${alt.live?'live':'est'}" title="${
                     alt.live ? `On the mound now in relief — the probable was ${esc(arm.pit||'TBD')}`
                              : 'A hypothetical — not necessarily who is actually pitching'}${
                     alt.n_games?` · ${alt.n_games} games in the trailing window`:''}">${alt.live?'live arm':'what-if'}</span>`
                 : (conf?'':'<span class="tag est">projected</span>')}
          ${picker}
          <div class="gbatters" style="margin-top:6px">${top.map(b=>{
            const pv=pFor(b,alt);
            return `<button class="mini ${tcls(pv)}${alt?(alt.live?' alt livearm':' alt'):''}" data-k="${key(b)}">${esc(b.name.split(' ').slice(-1)[0])} <b>${pct(pv,0)}</b></button>`;}).join('')}</div>
          ${alt?`<div class="muted" style="font-size:10.5px;margin-top:6px">${
            alt.live ? `${esc(alt.name)} is pitching now, so these are this lineup against him rather than against ${esc(arm.pit||'the probable starter')}
                        — still the same "if this arm went the whole way" simplification the pregame number makes.`
                     : `Scores above are this lineup against ${esc(alt.name)}.`}
            Open a batter for the full evidence, which is still built against ${esc(arm.pit||'the probable starter')}.</div>`:''}
        </div>
        ${alt ? `<div class="grade" style="opacity:.45" title="The 0–100 pitcher grade isn't computed for what-if arms — only the model inputs are">–</div>`
              : `<div class="grade" ${GRADES.has(String(arm.pGrade||'').toUpperCase())?`data-g="${esc(String(arm.pGrade).toUpperCase())}"`:''}
                   title="Pitcher grade — grades the arm, so A is the toughest matchup for the batter">${esc(arm.pGrade||'?')}</div>`}
      </div>`;
    }).join('');
    const scoreTxt = (g.away!=null&&g.home!=null) ? `${g.awayAbbr||''} ${g.away} – ${g.home} ${g.homeAbbr||''}` : '';
    return `<div class="game">
      <div class="ghead">
        <span class="gteams">${matchupHTML(any.matchup)}</span>
        <span class="gtime">${esc(any.startTime||'')}</span>
        ${g.abstract==='Live'?`<span class="tag live">${esc((g.half||'')+' '+(g.inning||''))}</span>`:''}
        ${scoreTxt?`<span class="gscore">${esc(scoreTxt)}</span>`:''}
      </div>
      <div class="gsides">${sides}</div>
      ${!compact&&any.park!=null?`<div class="muted" style="font-size:11.5px">Park factor <span class="num">${num(any.park,2)}</span> · ${bs.length} batters scored</div>`:''}
    </div>`;
  }).join('');
}
function viewGames(){ return `${ribbon()}<div class="games">${gameCards(false)}</div>`; }

/* ── Watch ─────────────────────────────────────────────────────────── */
function viewWatch(){
  const list=S.batters.filter(b=>S.stars.includes(key(b))).sort((a,b)=>b.p-a.p);
  if(!list.length) return `${ribbon()}<div class="empty">
    Nothing on the watchlist yet.<br><span style="font-size:12.5px">Tap the ☆ on any batter — in the shortlist, the table, or the drawer — to follow them through the night.
    <button class="lnk" data-go="today" style="display:block;margin:10px auto 0">Back to tonight's shortlist →</button></span></div>`;
  const done=list.filter(b=>b.hasHit).length;
  const settledStates=list.filter(b=>/final|game over/i.test(S.live[b.gamePk]?.state||b.gameState||'')).length;
  return `${ribbon()}
  <section class="sec">
    <div class="sec-h"><h2>Watchlist</h2><p><b class="num">${done}</b> of ${list.length} have a hit${settledStates?` · ${settledStates} final`:''}</p></div>
    <div class="blist">${list.map((b,i)=>batterCard(b,i+1)).join('')}</div>
  </section>`;
}

/* ── Honesty ───────────────────────────────────────────────────────── */
function reliabilitySVG(cal){
  const W=560,H=300,P=38;
  const x=v=>P+(v-.2)/(.6)*(W-P-14), y=v=>H-P-(v-.2)/(.6)*(H-P-14);
  const pts=cal.bands.filter(b=>b.n>=40);
  const path=pts.map((b,i)=>`${i?'L':'M'}${x(b.pred).toFixed(1)},${y(b.act).toFixed(1)}`).join('');
  const ticks=[.2,.3,.4,.5,.6,.7,.8];
  // the .8 label sits exactly where the y-axis caption goes — grid it, don't label it
  const labelled=[.2,.3,.4,.5,.6,.7];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reliability curve: predicted versus actual hit rate">
    ${ticks.map(t=>`<line class="grid" x1="${x(t)}" y1="${P-8}" x2="${x(t)}" y2="${H-P}"/>
                    <line class="grid" x1="${P}" y1="${y(t)}" x2="${W-14}" y2="${y(t)}"/>`).join('')}
    <line class="ideal" x1="${x(.2)}" y1="${y(.2)}" x2="${x(.8)}" y2="${y(.8)}"/>
    <path class="curve" pathLength="1" d="${path}"/>
    ${pts.map(b=>`<circle class="pt" cx="${x(b.pred)}" cy="${y(b.act)}" r="${clamp(Math.sqrt(b.n)/9,3,9).toFixed(1)}"><title>predicted ${pct(b.pred,1)} → actual ${pct(b.act,1)} (n=${b.n})</title></circle>`).join('')}
    ${labelled.map(t=>`<text x="${x(t)}" y="${H-P+15}" text-anchor="middle">${(t*100)|0}</text>
                    <text x="${P-8}" y="${y(t)+3}" text-anchor="end">${(t*100)|0}</text>`).join('')}
    <text x="${W/2}" y="${H-6}" text-anchor="middle">predicted %</text>
    <text x="0" y="${P-22}" text-anchor="start">actual %</text>
    <text x="${x(.70)}" y="${y(.755)}" fill="var(--ink3)">perfect</text>
  </svg>`;
}
function viewHonesty(){
  const cal=S.cal;
  if(!cal) return `<div class="empty">Loading the settled-picks record…</div>`;
  const worst=[...cal.bands].filter(b=>b.n>=100).sort((a,b)=>Math.abs(b.act-b.pred)-Math.abs(a.act-a.pred))[0];
  const recent=cal.days.slice(0,14);
  return `${ribbon()}
  <section class="sec">
    <div class="sec-h"><h2>Is the number honest?</h2><p>The one hard rule of this project — measured on ${cal.n.toLocaleString()} settled picks</p></div>
    <div class="sgrid">
      <div class="scell"><div class="slab">Settled picks</div><div class="sval">${cal.n.toLocaleString()}</div><div class="ssub">since ${esc(cal.days[cal.days.length-1]?.date||'')}</div></div>
      <div class="scell"><div class="slab">Brier</div><div class="sval">${num(cal.brier,4)}</div><div class="ssub">lower is better</div></div>
      <div class="scell"><div class="slab">Mean predicted</div><div class="sval">${pct(cal.meanP,1)}</div><div class="ssub">what it claimed</div></div>
      <div class="scell"><div class="slab">Actual rate</div><div class="sval">${pct(cal.baseRate,1)}</div><div class="ssub">what happened</div></div>
      <div class="scell"><div class="slab">Overall gap</div><div class="sval" style="color:${Math.abs(cal.baseRate-cal.meanP)>.02?'var(--bad)':'var(--acc)'}">${((cal.baseRate-cal.meanP)*100>0?'+':'')+((cal.baseRate-cal.meanP)*100).toFixed(1)}pt</div><div class="ssub">actual − predicted</div></div>
    </div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Reliability</h2><p>A well-calibrated model sits on the dashed line. Circle size is sample size.</p></div>
    <div style="padding:2px 0 0">${reliabilitySVG(cal)}
      ${worst?`<div class="truth" style="margin-top:12px">${icon(ICONS.info)}<div>Worst-calibrated band: the model said
      <b class="num">${pct(worst.pred,1)}</b> and those picks landed <b class="num">${pct(worst.act,1)}</b>
      (${worst.n.toLocaleString()} picks, ${((worst.act-worst.pred)*100>0?'+':'')+((worst.act-worst.pred)*100).toFixed(1)}pt off).
      Scores near the bottom of the range are the least trustworthy part of the model.</div></div>`:''}
    </div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Score bands</h2><p>What a score in each band has actually done</p></div>
    <div class="tblwrap"><table><thead><tr><th>Band</th><th class="r">Picks</th><th class="r">Predicted</th><th class="r">Actual</th><th class="r">Gap</th><th>Calibration</th></tr></thead>
    <tbody>${cal.bands.map(b=>{
      const gap=(b.act-b.pred)*100, w=clamp(Math.abs(gap)/12,0,1)*100;
      return `<tr style="cursor:default"><td class="num">${pct(b.band,0)}–${pct(b.band+.05,0)}</td>
        <td class="r num">${b.n.toLocaleString()}</td><td class="r num">${pct(b.pred,1)}</td>
        <td class="r num"><b>${pct(b.act,1)}</b></td>
        <td class="r num" style="color:${Math.abs(gap)>4?'var(--bad)':'var(--ink2)'}">${gap>0?'+':''}${gap.toFixed(1)}</td>
        <td><span class="meter" style="width:100px"><i style="width:${w}%;background:${Math.abs(gap)>4?'var(--bad)':'var(--s3)'}"></i></span></td></tr>`;
    }).join('')}</tbody></table></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Matchup tags</h2><p>The team-side STRONG / LEAN / NEUTRAL / AVOID label, audited</p></div>
    <div class="tblwrap"><table><thead><tr><th>Tag</th><th class="r">Picks</th><th class="r">Predicted</th><th class="r">Actual</th><th class="r">Gap</th></tr></thead>
    <tbody>${cal.tags.map(t=>`<tr style="cursor:default"><td><span class="tag">${esc(t.tag)}</span></td>
      <td class="r num">${t.n.toLocaleString()}</td><td class="r num">${pct(t.pred,1)}</td>
      <td class="r num"><b>${pct(t.act,1)}</b></td>
      <td class="r num">${((t.act-t.pred)*100>0?'+':'')+((t.act-t.pred)*100).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12.5px;margin-top:8px">The tag is a <b>team-side</b> label — every batter in a lineup shares it. It is not a per-batter verdict, and the spread between the best and worst tag is small.</p>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Last 14 days</h2><p>Daily predicted vs actual</p></div>
    <div class="tblwrap"><table><thead><tr><th>Date</th><th class="r">Picks</th><th class="r">Predicted</th><th class="r">Actual</th><th class="r">Gap</th></tr></thead>
    <tbody>${recent.map(d=>{const gap=(d.act-d.pred)*100;return `<tr style="cursor:default"><td class="num">${esc(d.date)}</td>
      <td class="r num">${d.n}</td><td class="r num">${pct(d.pred,1)}</td><td class="r num"><b>${pct(d.act,1)}</b></td>
      <td class="r num" style="color:${Math.abs(gap)>8?'var(--bad)':'var(--ink2)'}">${gap>0?'+':''}${gap.toFixed(1)}</td></tr>`;}).join('')}</tbody></table></div>
  </section>`;
}

/* ══════════════════════════════════════════════════════════════════════
   8 · drawer — the full case for one batter
   ══════════════════════════════════════════════════════════════════════ */
function waterfall(b){
  const base=b.base??b.p, d=b.delta??0, fin=b.p;
  const scale=v=>clamp((v-.3)/(.55),0,1)*100;
  const row=(lab,val,barHTML,cls='')=>`<div class="wfrow"><span class="muted">${lab}</span>${barHTML}<span class="wfval ${cls}">${val}</span></div>`;
  const dw=Math.abs(d)*100/.55*100/100*100;
  return `<div class="wf">
    ${row('Batter form', pct(base,1), `<span class="wfbar"><i style="left:0;width:${scale(base)}%;background:var(--s2)"></i></span>`)}
    ${row('Matchup', (d>0?'+':'')+(d*100).toFixed(1)+'pt',
      `<span class="wfbar"><i style="left:${Math.min(scale(base),scale(base+d))}%;width:${Math.max(.8,Math.abs(scale(base+d)-scale(base)))}%;background:${d>=0?'var(--acc)':'var(--bad)'}"></i></span>`,
      d>0?'':'')}
    ${row('Score', pct(fin,1), `<span class="wfbar"><i style="left:0;width:${scale(fin)}%;background:var(--s4)"></i></span>`)}
  </div>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Form is what he has been doing regardless of opponent; matchup is everything about tonight — this pitcher, this park, this lineup slot.</p>`;
}
/** closeDrawer defers `hidden` until the slide-out finishes. Re-opening inside
    that window used to leave the old timer running, so it fired on an
    already-open drawer: visually open, `hidden === true`. Everything that asks
    "is the drawer open?" — Escape, the arrow-key stepper, renderDrawer's
    refresh guard — then believed it was closed and stopped working. Cancel the
    pending close instead. */
let drawerTimer = null;
function openDrawer(k, list){
  const idx=(list||S.batters).findIndex(b=>key(b)===k);
  S.drawerList = list||S.batters; S.drawerIdx = idx;
  renderDrawer();
  clearTimeout(drawerTimer);
  const d=$('#drawer'); d.hidden=false; requestAnimationFrame(()=>{ d.classList.add('on'); $('#scrim').classList.add('on'); });
  document.body.style.overflow='hidden';
}
function closeDrawer(){
  const d=$('#drawer'); d.classList.remove('on'); $('#scrim').classList.remove('on');
  document.body.style.overflow='';
  clearTimeout(drawerTimer);
  drawerTimer = setTimeout(()=>{ d.hidden=true; },220);
}
function stepDrawer(n){
  const i=S.drawerIdx+n; if(i<0||i>=S.drawerList.length) return;
  S.drawerIdx=i; renderDrawer(); $('#drawer .dbody').scrollTop=0;
}
function renderDrawer(){
  const b=S.drawerList[S.drawerIdx]; if(!b) return;
  const ev=evidence(b,S.st), v=verdict(b,ev,S.st), bd=bandFor(S.cal,b.p);
  const starred=S.stars.includes(key(b));
  const log=S.pitcherLog?.[String(b.pitId).replace(/\.0$/,'')]||null;

  const evRow=e=>`<div class="evrow">
    <span class="evarrow ${e.ctx?'flat':e.dir>0?'up':e.dir<0?'down':'flat'}">${e.ctx?'·':e.dir>0?'↑':e.dir<0?'↓':'·'}</span>
    <span><span class="evlab">${esc(e.label)}${e.ctx?' <span class="tag">context</span>':''}</span>
      <span class="evtxt">${esc(e.text)}</span>
      ${e.note?`<span class="evtxt" style="color:var(--warn)">${esc(e.note)}</span>`:''}
      ${!e.ctx&&e.s?`<span class="evbars ${e.dir<0?'dn':''}">${[1,2,3].map(i=>`<i class="${i<=e.s?'on':''}"></i>`).join('')}</span>`:''}
    </span>
    <span class="evnum">${esc(e.val??'')}</span></div>`;

  $('#drawer').innerHTML=`
  <div class="dhead" style="--tc:${tc(b.team,'var(--line2)')}">
    <div style="min-width:0">
      <div class="dtitle" id="dtitle">${esc(b.name)}</div>
      <div class="dsub">${teamSpan(b.team)} · ${matchupHTML(b.matchup)} · ${esc(b.startTime||'')} ${b.slot?`· ${slotDiamond(b.slot)}`:''} ${lineupTag(b)} ${stateTag(b)}</div>
    </div>
    <div class="dnav">
      <button class="iconbtn" id="dprev" ${S.drawerIdx<=0?'disabled style="opacity:.3;transform:rotate(180deg)"':'style="transform:rotate(180deg)"'} aria-label="Previous batter">${icon(ICONS.chev)}</button>
      <button class="iconbtn" id="dnext" ${S.drawerIdx>=S.drawerList.length-1?'disabled style="opacity:.3"':''} aria-label="Next batter">${icon(ICONS.chev)}</button>
      <button class="iconbtn" id="dclose" aria-label="Close">${icon('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
  </div>
  <div class="dbody">
    <div class="verdict">
      <div class="vtop">
        <div class="vbig ${tcls(b.p)}">${pct(b.p,1).replace('%','')}<span>%</span></div>
        <div class="vside">
          Chance of <b>at least one hit</b> ${S.date?'that day':'tonight'} — ${v.where}.<br>
          <span class="muted">${esc(v.lead.charAt(0).toUpperCase()+v.lead.slice(1))}.</span>
        </div>
      </div>
      ${bd&&bd.n>60?`<div class="vcheck">Historically, scores in this band landed <b>${pct(bd.act,1)}</b> across
        <b>${bd.n.toLocaleString()}</b> settled picks — ${Math.abs(bd.act-bd.pred)*100<2?'closely matching':'running '+((bd.act-bd.pred)>0?'above':'below')+' '} the predicted <b>${pct(bd.pred,1)}</b>.</div>`:''}
      ${waterfall(b)}
    </div>

    <div class="sec-h" style="margin-top:20px"><h2>Why</h2><p>Ranked by how much each factor moves this score</p></div>
    <div class="ev">${ev.signal.map(evRow).join('')}</div>

    ${ev.context.length?`<div class="sec-h" style="margin-top:20px"><h2>Context</h2><p>Real information the model does not train on</p></div>
    <div class="ev">${ev.context.map(evRow).join('')}</div>`:''}

    <div class="sec-h" style="margin-top:20px"><h2>Form</h2><p>Last 10 games — filled means he got a hit</p></div>
    <div style="padding:2px 0 0">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="transform:scale(1.6);transform-origin:left center;display:inline-block">${stripHTML(b.last10)}</span>
        <span class="muted" style="font-size:12.5px;margin-left:8px">${b.last10?`hit in ${[...b.last10.slice(-10)].filter(c=>c==='1').length} of last ${Math.min(10,b.last10.length)}`:'no recent games'}</span>
      </div>
      <div class="sgrid" style="margin-top:12px">
        <div class="scell"><div class="slab">Hit rate</div><div class="sval">${pct(b.bHit,1)}</div><div class="ssub">last ${b.bGames??'—'} g</div></div>
        <div class="scell"><div class="slab">xBA</div><div class="sval">${num(b.bXba,3)}</div><div class="ssub">expected</div></div>
        <div class="scell"><div class="slab">Hard-hit</div><div class="sval">${pct(b.bHard,1)}</div><div class="ssub">contact</div></div>
        <div class="scell"><div class="slab">BABIP</div><div class="sval">${num(b.bBabip,3)}</div><div class="ssub">luck check</div></div>
        <div class="scell"><div class="slab">K rate</div><div class="sval">${pct(b.bK,1)}</div><div class="ssub">strikeouts</div></div>
        <div class="scell"><div class="slab">PA / game</div><div class="sval">${num(b.bPA,2)}</div><div class="ssub">${b.slot?'slot '+b.slot:''}</div></div>
      </div>
    </div>

    <div class="sec-h" style="margin-top:20px"><h2>The arm</h2><p>${esc(b.pit||'TBD')} · ${esc(b.pitHand||'?')}HP · ${esc(b.pRole||'SP')}</p></div>
    <div style="padding:2px 0 0">
      <div class="sgrid">
        <div class="scell"><div class="slab">Grade</div><div class="sval">${esc(b.pGrade||'—')}</div><div class="ssub">rating ${b.pRating??'—'}</div></div>
        <div class="scell"><div class="slab">ERA</div><div class="sval">${num(b.pEra,2)}</div><div class="ssub">${esc(b.pIp||'')} IP</div></div>
        <div class="scell"><div class="slab">WHIP</div><div class="sval">${num(b.pWhip,2)}</div><div class="ssub">baserunners</div></div>
        <div class="scell"><div class="slab">H / 9</div><div class="sval">${num(b.pH9,1)}</div><div class="ssub">hits allowed</div></div>
        <div class="scell"><div class="slab">CSW</div><div class="sval">${pct(b.pCsw,1)}</div><div class="ssub">called+whiff</div></div>
        <div class="scell"><div class="slab">Hard-hit</div><div class="sval">${pct(b.pHard,1)}</div><div class="ssub">allowed</div></div>
        <div class="scell"><div class="slab">K / 9</div><div class="sval">${num(b.pK9,1)}</div><div class="ssub">BB/9 ${num(b.pBb9,1)}</div></div>
        <div class="scell"><div class="slab">Batters faced</div><div class="sval">${num(b.pAvgBf,1)}</div><div class="ssub">per start</div></div>
      </div>
      ${b.useFb!=null?`<div style="margin-top:12px">
        <div class="slab" style="margin-bottom:6px">Pitch mix vs his production against it</div>
        ${[['Fastball',b.useFb,b.hrFb],['Breaking',b.useBb,b.hrBb],['Offspeed',b.useOs,b.hrOs]].map(([l,u,h])=>
          `<div class="wfrow"><span class="muted">${l}</span>
            <span class="wfbar"><i style="left:0;width:${clamp(u??0,0,1)*100}%;background:var(--s2)"></i></span>
            <span class="wfval">${pct(u,0)}</span></div>
           <div class="wfrow" style="padding-top:0"><span class="muted" style="font-size:11px;padding-left:8px">reaches base</span>
            <span class="wfbar" style="height:5px"><i style="left:0;width:${clamp((h??0)/.5,0,1)*100}%;background:${(h??0)>(b.hrAll??0)?'var(--acc)':'var(--line2)'}"></i></span>
            <span class="wfval" style="font-size:11px">${pct(h,1)}</span></div>`).join('')}
        <p class="muted" style="font-size:11.5px;margin:4px 0 0">Overall he reaches base ${pct(b.hrAll,1)} of the time.</p>
      </div>`:''}
      ${log?`<div style="margin-top:12px"><div class="slab" style="margin-bottom:6px">His last ${log.length} outings</div>
        <div class="tblwrap" style="box-shadow:none"><table><thead><tr><th>Date</th><th class="r">IP</th><th class="r">H</th><th class="r">R</th><th class="r">BB</th><th class="r">K</th></tr></thead>
        <tbody>${log.slice(0,5).map(g=>`<tr style="cursor:default"><td class="num">${esc(g.date)}</td><td class="r num">${esc(g.ip)}</td>
          <td class="r num">${g.h}</td><td class="r num">${g.r}</td><td class="r num">${g.bb}</td><td class="r num">${g.k}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    </div>

    <div style="display:flex;gap:8px;margin:20px 0 30px">
      <button class="field" id="dstar" style="flex:1;justify-content:center;font-weight:560;${starred?'background:var(--acc);border-color:var(--acc);color:var(--acc-on)':''}">
        ${starred?'★ On your watchlist':'☆ Add to watchlist'}
      </button>
    </div>
  </div>`;

  animateNumbers();
  $('#dclose').onclick=closeDrawer;
  $('#dprev').onclick=()=>stepDrawer(-1);
  $('#dnext').onclick=()=>stepDrawer(1);
  $('#dstar').onclick=()=>toggleStar(key(b), b.name);   // same path as every row star
}

/* ══════════════════════════════════════════════════════════════════════
   9 · shell + events
   ══════════════════════════════════════════════════════════════════════ */
/** The archive date-picker and the bullpen swap were ported here 2026-07-25;
    what the previous dashboard still holds alone is the bet slip, Kalshi odds
    and parlay EV, so it needs a way in from here — otherwise making this the
    main dashboard quietly hides those features rather than replacing them.
    (Watch is this dashboard's own answer to the slip: a list you build by
    starring rows, not a stake-and-payout ledger.) */
function renderFooter(){
  const legacy = ON_SERVER ? '/legacy' : './legacy.html';
  $('#foot').innerHTML =
    `<span>Mochi · scores are calibrated probabilities, not betting advice.</span>
     <a href="${legacy}">Previous dashboard — bet slip &amp; odds →</a>`;
}
/** Human label for an archive date. Tomorrow's file is a --preview-tomorrow
    run on ESTIMATED lineups, so it gets said out loud rather than looking
    like another settled day. */
function dateLabel(d, long){
  const today = TODAY();
  if(d === today) return 'Tonight';
  const dt = new Date(d+'T12:00:00');
  const s = dt.toLocaleDateString([], long ? {weekday:'long',month:'long',day:'numeric'}
                                           : {weekday:'short',month:'short',day:'numeric'});
  // the long form is used where the surrounding sentence already says it's a
  // preview, so only the compact picker label carries the suffix
  return (d > today && !long) ? s+' · preview' : s;
}
function renderDateSel(){
  const sel = $('#dsel'), today = TODAY();
  if(!sel) return;
  // Nothing to pick between → no control at all. This is the mirror's normal
  // state when slates_index.json hasn't shipped yet, and an empty dropdown
  // reads as broken.
  const dates = S.dates.filter(d=>d!==today);
  if(!dates.length){ sel.hidden = true; return; }
  sel.hidden = false;
  sel.classList.toggle('past', !!S.date);
  sel.innerHTML = `<option value="">Tonight</option>` +
    dates.map(d=>`<option value="${d}" ${S.date===d?'selected':''}>${esc(dateLabel(d))}</option>`).join('');
  sel.value = S.date;
}
/** Shown on every view while an archive is loaded — the board otherwise looks
    exactly like tonight, which is how you end up reading Tuesday as today. */
function dateBar(){
  if(!S.date) return '';
  const future = S.date > TODAY();
  return `<div class="datebar">
    <span>${future?'Previewing':'Viewing'} <b>${esc(dateLabel(S.date,true))}</b>${
      future ? ' — estimated lineups, not final' : ' — a finished slate, scores frozen as of first pitch'}</span>
    <button class="lnk" id="dback">Back to tonight →</button>
  </div>`;
}
function renderNav(){
  $('#nav').innerHTML = VIEWS.map(v=>`<button data-go="${v.id}" ${S.view===v.id?'aria-current="page"':''}>${v.label}</button>`).join('');
  $('#tabbar').innerHTML = VIEWS.map(v=>`<button data-go="${v.id}" ${S.view===v.id?'aria-current="page"':''}>${icon(ICONS[v.icon])}<span>${v.label}</span></button>`).join('');
}
/** Count a figure up to its value. Only in Aurora, only when the reader has
    not asked for reduced motion — and it animates the text node in place so
    the trailing "%" span is left alone. */
function countUp(el, target, dur){
  const node = el.firstChild;
  if(!node || node.nodeType !== 3) return;
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now-t0)/dur), e = 1-Math.pow(1-k,3);
    node.nodeValue = (target*e).toFixed(1);
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}
function animateNumbers(){
  if(document.documentElement.dataset.theme !== 'aurora') return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('.bcard.hero .pct, .vbig').forEach(el=>{
    const v = parseFloat(el.firstChild && el.firstChild.nodeValue);
    if(isNaN(v)) return;
    el.firstChild.nodeValue = '0.0';
    countUp(el, v, 950);
  });
}

function render(){
  renderNav();
  renderFooter();
  renderDateSel();
  const m=$('#main');
  try{
    m.innerHTML = dateBar() + (
                  S.view==='today'   ? viewToday()
                : S.view==='batters' ? viewBatters()
                : S.view==='games'   ? viewGames()
                : S.view==='watch'   ? viewWatch()
                : viewHonesty());
  }catch(e){
    m.innerHTML=`<div class="empty">Something went wrong rendering this view.<br><span class="num" style="font-size:11px">${esc(e.message)}</span></div>`;
    console.error(e);
  }
  applyResponsiveTable();
  wireView();
  animateNumbers();
}
/** Desktop gets the dense table; phones get the card list. Never a squeezed table.
    The threshold is 1120 rather than 900 because the table declares 1040px of
    column widths — below that the last columns were being clipped by the wrap
    rather than falling back to cards. */
function applyResponsiveTable(){
  const t=$('#tbl'), c=$('#cards');
  if(!t||!c) return;
  const wide = window.innerWidth>=1120;
  t.style.display = wide?'block':'none';
  c.style.display = wide?'none':'grid';
}
function wireView(){
  $$('[data-k]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    const list = S.view==='batters' ? filtered() : S.view==='watch'
      ? S.batters.filter(b=>S.stars.includes(key(b))).sort((a,b)=>b.p-a.p)
      : [...S.batters].sort((a,b)=>b.p-a.p);
    openDrawer(el.dataset.k, list);
  }));
  $$('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  const tx=$('#truthx');
  if(tx) tx.addEventListener('click',ev=>{ ev.preventDefault(); ev.stopPropagation(); snoozeTruth(); });
  const back=$('#dback'); if(back) back.addEventListener('click',()=>goDate(''));
  $$('[data-star]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();          // a table star sits INSIDE tr[data-k]
    toggleStar(el.dataset.star, el.dataset.name);
  }));
  $$('.psel').forEach(sel=>{
    sel.addEventListener('click',e=>e.stopPropagation());   // never open the drawer behind it
    sel.addEventListener('change',()=>setPreview(sel.dataset.pk, sel.dataset.team, sel.value));
  });
  const q=$('#fq');
  if(q){
    q.addEventListener('input',()=>{ S.filters.q=q.value; const s=q.selectionStart; render(); const n=$('#fq'); if(n){n.focus(); n.setSelectionRange(s,s);} });
  }
  const bind=(id,k)=>{ const el=$(id); if(el) el.addEventListener('change',()=>{ S.filters[k]=el.value; render(); }); };
  bind('#fteam','team'); bind('#fgame','game'); bind('#fslot','slot');
  $$('[data-lu]').forEach(el=>el.addEventListener('click',()=>{ S.filters.lineup=el.dataset.lu; render(); }));
  $$('th.sortable').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.sort;
    if(S.filters.sort===k) S.filters.dir*=-1; else { S.filters.sort=k; S.filters.dir=-1; }
    render();
  }));
}
function go(v){ if(!VIEWS.some(x=>x.id===v)) return; S.view=v; location.hash=v; window.scrollTo(0,0); render(); }

/* theme — Dugout (auto/light/dark), the legacy dashboard's own palette, plus
   Aurora. The ids `light`/`dark` are load-bearing: applyTheme('auto') writes
   one of those two names onto the root, so they cannot be renamed. */
const THEMES = [
  {id:'auto',  name:'Auto'},
  {id:'light', name:'Dugout light'},
  {id:'dark',  name:'Dugout dark'},
  {id:'aurora', name:'Aurora'}
];
function applyTheme(t){
  const sys = matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = t==='auto' ? (sys?'dark':'light') : t;
}
document.head.insertAdjacentHTML('beforeend', `<style id="teamcss">${teamCSS()}</style>`);
let theme = store.get('theme','aurora'); applyTheme(theme);   // Aurora is the default
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(theme==='auto') applyTheme('auto'); });

/* global events */
$('#scrim').onclick=closeDrawer;
$('#btnTheme').onclick=()=>{
  const i = THEMES.findIndex(t=>t.id===theme);
  const next = THEMES[(i+1) % THEMES.length];
  theme = next.id; store.set('theme',theme); applyTheme(theme);
  toast(next.id==='auto' ? `Auto — ${document.documentElement.dataset.theme}` : next.name);
};
$('#btnStar').onclick=()=>go('watch');
$('#dsel').onchange=e=>goDate(e.target.value);
$('#btnReload').onclick=async()=>{ delete once.cal; toast('Reloading…'); await boot(true); };
window.addEventListener('resize',applyResponsiveTable);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==S.view) go(h); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !$('#drawer').hidden) return closeDrawer();
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(!$('#drawer').hidden){
    if(e.key==='ArrowRight'||e.key==='j') stepDrawer(1);
    if(e.key==='ArrowLeft' ||e.key==='k') stepDrawer(-1);
    return;
  }
  if(e.key==='/'){ e.preventDefault(); go('batters'); setTimeout(()=>$('#fq')?.focus(),40); }
  const i=+e.key; if(i>=1&&i<=5) go(VIEWS[i-1].id);
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleLive(); });

/* ══════════════════════════════════════════════════════════════════════
   10 · boot
   ══════════════════════════════════════════════════════════════════════ */
async function boot(force){
  if(force){ for(const k in once) delete once[k]; }
  const h=location.hash.slice(1); if(VIEWS.some(v=>v.id===h)) S.view=h;
  try{
    await loadSlate();
  }catch(e){
    $('#main').innerHTML=`<div class="empty">Couldn't load tonight's slate.<br>
      <span style="font-size:12.5px">${esc(e.message)}</span></div>`;
    return;
  }
  render();
  // everything below is an enhancement: the page is already useful without it
  loadDates().then(renderDateSel);
  loadLive().then(()=>{ render(); scheduleLive(); });
  loadJSON('pitcher_recent_games.json').then(d=>{ S.pitcherLog=d; if(!$('#drawer').hidden) renderDrawer(); });
  loadJSON('bullpen_preview.json').then(d=>{ S.bullpen=d; if(S.view==='games') render(); });
  calibration().then(c=>{ S.cal=c; render(); }).catch(()=>{ /* mirror may not ship picks_log */ });
}
boot();
</script>
