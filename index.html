@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:600px){
  html[data-theme="aurora"] .bcard.hero{padding:16px 14px;border-radius:18px}
  html[data-theme="aurora"] .bcard.hero::before{width:180px;height:180px;right:-14%}
  html[data-theme="aurora"] .bcard{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">

      <path class="st" d="M6.6 7.2l1.6-.7M6.9 9.6l1.7-.5M6.9 14.4l1.7.5M6.6 16.8l1.6.7M17.4 7.2l-1.6-.7M17.1 9.6l-1.7-.5M17.1 14.4l-1.7.5M17.4 16.8l-1.6.7"/>
    </svg></em> Mochi <small>calibrated hit indicator</small></div>

    <button class="iconbtn" id="btnTheme" title="Theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></button>

<main class="wrap" id="main"><div class="sec"><div class="skel" style="height:120px"></div></div></main>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   0 · environment + tiny helpers
   ══════════════════════════════════════════════════════════════════════ */
const ON_SERVER = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct  = (v,d=0) => v==null||isNaN(v) ? '—' : (v*100).toFixed(d)+'%';
const num  = (v,d=2) => v==null||isNaN(v) ? '—' : Number(v).toFixed(d);
const clamp= (v,a,b) => Math.max(a,Math.min(b,v));
/** MLB's inningHalf reads "Top"/"Bottom"/"Middle"/"End"; the live badges are
    tiny, so print the scoreboard abbreviations instead of the long word. */
const halfAbbr = h => ({top:'TOP',bottom:'BOT',middle:'MID',end:'END'})[String(h??'').toLowerCase()] || String(h??'').toUpperCase();
/** Start times arrive as display strings ("1:05 PM"), and compared as strings
    "1:05 PM" sorts before "10:35 AM" — which is how an afternoon game ended up
    at the top of a slate ordered by first pitch. Compare minutes instead. An
    unparseable time sorts last rather than to midnight. */
function startMin(s){
  const m = /^(\d{1,2}):(\d{2})\s*([AP]M)?/i.exec(String(s||'').trim());
  if(!m) return 1e9;
  const mer = m[3]||'';
  const h = mer ? (+m[1]%12) + (/pm/i.test(mer)?12:0) : +m[1];   // bare 13:05 is already 24h
  return h*60 + +m[2];
}
/** The legacy dashboard's three-tier read on a probability, thresholds and
    all (.70 / .55). Every printed score wears it, so the same number is the
    same colour wherever it appears. */
const tierOf = p => p==null||isNaN(p) ? 'lo' : p>=.70 ? 'hi' : p>=.55 ? 'mid' : 'lo';
const tcls   = p => 't-'+tierOf(p);
const GRADES = new Set(['A','B','C','D','F']);
/** Pitcher letter grade as a coloured pill — separate scale from the score
    tiers on purpose: it grades the arm, so A is a hard night for the hitter. */
const gradePill = (g,cls='gr') => {
  const G = String(g||'').trim().toUpperCase().slice(0,1);
  return g ? `<span class="${cls}" ${GRADES.has(G)?`data-g="${G}"`:''} title="Pitcher grade ${esc(g)} — grades the arm, so A is the toughest matchup for the batter">${esc(g)}</span>` : '';
};
const key  = b => `${b.gamePk}:${b.batterId}`;          // doubleheader-safe, always
const store = {
  get(k,f){ try{ const v=localStorage.getItem('mochi.'+k); return v==null?f:JSON.parse(v);}catch(e){return f} },
  set(k,v){ try{ localStorage.setItem('mochi.'+k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg,ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms); }
function icon(p,cls=''){ return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`; }
const ICONS = {
  today:'<path d="M4 7h16M4 12h10M4 17h7"/>',
  batters:'<circle cx="12" cy="7" r="3"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
  // a roster, not a ball: the tab is nine bats read top to bottom
  teams:'<path d="M5 4.5h14v9c0 3.3-3 5.3-7 6.5-4-1.2-7-3.2-7-6.5z"/><path d="M8.5 9h7M8.5 12.5h4.5"/>',
  watch:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>',
  honesty:'<path d="M4 19V5M4 15l5-4 4 3 7-6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.6"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  chev:'<path d="M9 6l6 6-6 6"/>'
};

/* ══════════════════════════════════════════════════════════════════════
   0b · team colours
   Each club's identity colour, picked for recognisability rather than for
   contrast — several are near-black navies or browns that would be illegible
   as text. So these are never used raw: teamCSS() clamps each one's LIGHTNESS
   into a readable band per theme while leaving hue and saturation alone, which
   is what carries the recognition. A club whose identity is essentially black
   (CWS, SD) is represented by its secondary instead.
   ══════════════════════════════════════════════════════════════════════ */
const TEAM_HEX = {
  ATH:'#00594C', ATL:'#CE1141', AZ:'#A71930', BAL:'#DF4601', BOS:'#BD3039',
  CHC:'#0E3386', CIN:'#C6011F', CLE:'#E31937', COL:'#5B3E9B', CWS:'#8C9BA6',
  DET:'#1B3F6E', HOU:'#EB6E1F', KC:'#004687',  LAA:'#BA0021', LAD:'#005A9C',
  MIA:'#00A3E0', MIL:'#B6922E', MIN:'#D31145', NYM:'#FF5910', NYY:'#0F3E96',
  PHI:'#E81828', PIT:'#FDB827', SD:'#C9A227',  SEA:'#0C7A72', SF:'#FD5A1E',
  STL:'#C41E3A', TB:'#3D7DC4',  TEX:'#C0111F', TOR:'#134A8E', WSH:'#AB0003'
};
function hexToHsl(hex){
  const n = parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
  if(!d) return [0,0,l*100];
  const s = d/(1-Math.abs(2*l-1));
  const h = mx===r ? 60*(((g-b)/d)%6) : mx===g ? 60*((b-r)/d+2) : 60*((r-g)/d+4);
  return [(h+360)%360, s*100, l*100];
}
function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [f(0),f(8),f(4)];
}
const relLum = ([r,g,b]) => {
  const ch=v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);
  return .2126*ch(r)+.7152*ch(g)+.0722*ch(b);
};
const contrast = (l1,l2) => (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
/** Lightness that clears `target` contrast against `bgLum`, searched rather
    than assumed. A fixed lightness band does not work: at the same L a yellow
    is far brighter than a navy, so PIT and SD came out at 2.6:1 on white while
    the navies were fine. Walks lightness away from the background until the
    ratio clears, then stops — the least distortion of the real colour that is
    still readable. */
function readable(hex, bgLum, target){
  const [h,s,l0] = hexToHsl(hex);
  const lumAt = L => relLum(hslToRgb(h,s,L));
  const dark = bgLum < .5;                       // light text on dark bg, or vice versa
  let best = clamp(l0, 8, 92);
  for(let step=0; step<=84; step++){
    const L = clamp(dark ? l0+step : l0-step, 8, 92);
    best = L;
    if(contrast(lumAt(L), bgLum) >= target) break;
    if(L<=8 || L>=92) break;
  }
  return `hsl(${h.toFixed(0)} ${s.toFixed(0)}% ${best.toFixed(0)}%)`;
}
/** One custom property per club, twice: a light-on-dark value and a
    dark-on-light one. Emitting CSS (rather than colouring at render time)
    means the theme toggle re-colours everything for free — nothing re-renders. */
function teamCSS(){
  const BG_DARK = relLum([0,0,0]);                       // --bg, Dugout dark + Aurora
  const BG_LIGHT = relLum([233/255,235/255,239/255]);    // --bg, Dugout light
  const line = bg => Object.entries(TEAM_HEX)
    .map(([t,hex])=>`--tc-${t}:${readable(hex,bg,4.5)}`).join(';');
  // --tb-* is the club's ACTUAL brand hex, untouched by the contrast search.
  // A badge fill is a shape, not text, so it does not owe 4.5:1 — and forcing
  // the navies up to text contrast is what would make every badge look alike.
  const brand = Object.entries(TEAM_HEX).map(([t,hex])=>`--tb-${t}:${hex}`).join(';');
  return `:root{${line(BG_DARK)};${brand}}\nhtml[data-theme="light"]{${line(BG_LIGHT)}}`;
}
/** Fall back to the normal ink colour for anything not in the map (a new club
    code, or a relocated one) rather than rendering an invisible element. */
const tc = (t, fallback='var(--ink2)') => `var(--tc-${String(t||'').toUpperCase()},${fallback})`;
const tb = (t, fallback='var(--ink4)') => `var(--tb-${String(t||'').toUpperCase()},${fallback})`;
const teamSpan = (t, cls='tm') => `<span class="${cls}" style="color:${tc(t)}">${esc(t)}</span>`;
/** "ATH @ MIN" → both clubs in their own colour. */
function matchupHTML(m){
  const parts = String(m||'').split('@').map(s=>s.trim());
  return parts.length===2 ? `${teamSpan(parts[0])} <span class="at">@</span> ${teamSpan(parts[1])}` : esc(m);
}

/* ── club badges ──────────────────────────────────────────────────────────
   Thirty real club marks are neither shippable (they are somebody else's
   trademarks) nor honest in a tool that has no licence to them, so this is a
   SYSTEM instead of thirty drawings: one badge form per league, filled with
   the club's own brand colour, carrying its code.

   The league split is what makes it work as identification rather than
   decoration. Colour alone is a single channel, and thirty hues include pairs
   no one can tell apart at 26px (CIN/STL/PHI are all the same red, LAD/CHC/NYY
   all the same navy) — so a Cardinals shield and a Reds roundel differ in
   SHAPE first and hue second, and league is information a baseball reader
   already holds anyway. */
const AL = new Set(['BAL','BOS','NYY','TB','TOR','CWS','CLE','DET','KC','MIN','HOU','LAA','ATH','SEA','TEX']);
const badgeVars = t => `--bc:${tb(t)};--bt:${tc(t)}`;
/* Inset 3 units so a 5.5-wide stroke, centred on the path, still lands inside
   the 100-unit box instead of being cut in half by the viewBox edge. */
const BDG_SHAPE = {
  al:'<circle cx="50" cy="50" r="47"/>',
  nl:'<path d="M3 3H97V63L50 97 3 63Z"/>'      // home plate, point down
};
/** `cls` sizes it: '' is the row badge, 'bg-sm' the table/strip one. */
function teamBadge(t, cls=''){
  const T = String(t||'').toUpperCase();
  if(!T) return '';
  const lg = AL.has(T) ? 'al' : 'nl';
  return `<span class="bdg ${lg} ${cls}" style="${badgeVars(T)}" role="img"
    aria-label="${esc(T)}" title="${esc(T)} · ${AL.has(T)?'American':'National'} League"
    ><svg class="bdgs" viewBox="0 0 100 100" aria-hidden="true">${BDG_SHAPE[lg]}</svg><i>${esc(T)}</i></span>`;
}
/** The same badge blown up as a watermark behind a row, so the club reads from
    the shape of the card before you get to any text. Replaces the baseball that
    used to sit behind the hero — a ball is true of all 270 rows and therefore
    identifies none of them, which is exactly the wrong thing to spend the one
    background layer on. */
function teamMark(t, cls=''){
  const T = String(t||'').toUpperCase();
  if(!T) return '';
  return `<span class="tmark ${AL.has(T)?'al':'nl'} ${cls}" style="${badgeVars(T)}" aria-hidden="true"><i>${esc(T)}</i></span>`;
}

/** fetch with a hard timeout — a hung statsapi call must never hang the UI. */
async function get(url,{timeout=9000,json=false,text=false}={}){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), timeout);
  try{
    const r = await fetch(url,{signal:c.signal,cache:'no-store'});
    if(!r.ok) throw new Error(r.status+' '+url);
    const body = json ? await r.json() : await r.text();
    return {body, modified:r.headers.get('last-modified')};
  } finally { clearTimeout(t); }
}
/** Try each candidate path in order. The same page is served three ways —
    the Flask server, a plain static server, and the GH Pages mirror — and
    each exposes these files under slightly different paths. Falling through
    beats hard-coding one and dying on the others. */
async function getAny(paths, opts){
  let last;
  for(const p of paths){ try{ return await get(p,opts); }catch(e){ last=e; } }
  throw last;
}
/** memoised loaders — each source is fetched at most once per session. */
const once = {};
const load = (k,fn) => (once[k] ||= fn().catch(e=>{ delete once[k]; throw e; }));

/* ══════════════════════════════════════════════════════════════════════
   1 · CSV
   ══════════════════════════════════════════════════════════════════════ */
function parseCSV(raw){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<raw.length;i++){
    const c=raw[i];
    if(q){ if(c==='"'){ if(raw[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.map(r=>{ const o={}; head.forEach((h,i)=>o[h]=r[i]===undefined?'':r[i]); return o; });
}
const N = v => { if(v===''||v==null) return null; const n=+v; return isNaN(n)?null:n; };

/* ══════════════════════════════════════════════════════════════════════
   2 · domain model — one slate row becomes one batter
   ══════════════════════════════════════════════════════════════════════ */
function toBatter(r){
  return {
    raw:r,
    batterId:r.batter_id, name:r.name, team:r.team, hand:r.batter_hand,
    slot:N(r.slot), gamePk:r.game_pk, matchup:r.matchup, startTime:r.start_time,
    gameState:r.game_state, confirmed:(r.lineup_source||'')==='live',
    p:N(r.p_hit), base:N(r.base_p_hit), delta:N(r.matchup_delta),
    hasHit:r.has_hit==='True', last10:(r.last5||'').replace(/[^01]/g,''),
    // batter form
    bHit:N(r.b_hit_rate), bXba:N(r.b_xba), bHard:N(r.b_hardhit), bBabip:N(r.b_babip),
    bK:N(r.b_k_rate), bGames:N(r.b_n_games), bRest:N(r.b_days_rest), bPA:N(r.b_avg_pa),
    bAB:N(r.b_avg_ab), bSeasonG:N(r.b_games_played), bQ3:N(r.b_quality_first3), bQ3n:N(r.b_n_games_first3),
    bRookie:r.b_is_rookie==='True', splitDiff:N(r.split_diff),
    vsL:N(r.b_hit_rate_vs_L), vsR:N(r.b_hit_rate_vs_R),
    vsSP:N(r.b_hit_rate_vs_sp), paSP:N(r.b_pa_vs_sp), vsRP:N(r.b_hit_rate_vs_rp), paRP:N(r.b_pa_vs_rp),
    hrFb:N(r.b_hr_vs_fb), hrBb:N(r.b_hr_vs_bb), hrOs:N(r.b_hr_vs_os), hrAll:N(r.b_hr_overall),
    bvpAB:N(r.bvp_ab), bvpH:N(r.bvp_h), bvpAvg:N(r.bvp_avg),
    // pitcher
    pit:r.pitcher, pitId:r.opp_pitcher_id, pitHand:r.pitcher_hand, pGrade:r.p_grade, pRating:N(r.p_rating),
    pCsw:N(r.p_csw), pKbb:N(r.p_k_bb), pHard:N(r.p_hardhit_allowed), pK:N(r.p_k_rate),
    pGames:N(r.p_n_games), pRest:N(r.p_days_rest), pRookie:r.p_is_rookie==='True', opener:r.is_opener==='1',
    useFb:N(r.p_use_fb), useBb:N(r.p_use_bb), useOs:N(r.p_use_os),
    pEra:N(r.p_era), pWhip:N(r.p_whip_official), pIp:r.p_ip, pK9:N(r.p_k9), pBb9:N(r.p_bb9),
    pH9:N(r.p_h9), pHr9:N(r.p_hr9), pRole:r.p_role, pBfG:N(r.p_bf_per_g), pAvgBf:N(r.p_avg_bf),
    park:N(r.park_factor)
  };
}

/** Slate-relative statistics — the field tonight is the only fair yardstick.
    Tonight's p_hit spans ~47–75%, so an absolute number tells you very little
    on its own; percentile within the slate is what makes a batter stand out. */
function slateStats(bs){
  const st = {};
  const cols = {p:'p',base:'base',delta:'delta',bHit:'bHit',bXba:'bXba',bHard:'bHard',bK:'bK',
                pCsw:'pCsw',pHard:'pHard',pRating:'pRating',bPA:'bPA',bQ3:'bQ3',pH9:'pH9'};
  for(const c in cols){
    const v = bs.map(b=>b[c]).filter(x=>x!=null).sort((a,b)=>a-b);
    st[c] = v.length ? {min:v[0], max:v[v.length-1], med:v[Math.floor(v.length/2)], sorted:v} : null;
  }
  st.pctl = (c,val) => {
    const s = st[c]; if(!s||val==null) return null;
    let lo=0,hi=s.sorted.length;
    while(lo<hi){ const m=(lo+hi)>>1; if(s.sorted[m]<val) lo=m+1; else hi=m; }
    return s.sorted.length<2 ? .5 : lo/(s.sorted.length-1);
  };
  return st;
}

/* ══════════════════════════════════════════════════════════════════════
   3 · the reason engine
   Turns 91 columns into ranked, plain-language evidence. Each item carries
   a direction, a strength (0–3) and — deliberately — whether the model
   actually trains on it. Context that only informs the reader's own judgment
   is labelled as such rather than being passed off as model signal.
   ══════════════════════════════════════════════════════════════════════ */
const IN_MODEL = new Set(['form','contact','whiff','pitcher','volume','park','rest','q3','pitchmix','role']);

/** Chips assert a claim ("Cold stretch"); drawer rows name a category
    ("Recent form"). Same evidence, two registers — a chip that reads
    "↑ Whiff risk" is ambiguous about who the arrow is good for. */
const PHRASE = {
  form:     [ 'Cold stretch',        'Hot at the plate'   ],
  contact:  [ 'Weak contact',        'Hard contact'       ],
  whiff:    [ 'High whiff risk',     'Low whiff risk'     ],
  pitcher:  [ 'Tough arm',           'Beatable arm'       ],
  volume:   [ 'Fewer trips up',      'Extra trips up'     ],
  pitchmix: [ 'Mix works on him',    'Mix suits him'      ],
  park:     [ "Pitcher's park",      "Hitter's park"      ],
  q3:       [ 'Slow starter',        'Strong early ABs'   ],
  rest:     [ 'Long layoff',         'Rested'             ]
};
const phraseOf = e => e.ctx ? e.label : (PHRASE[e.k]?.[e.dir>0?1:0] || e.label);

function evidence(b, st){
  const out = [];
  const add = (o) => { if(o) out.push(o); };
  const rel = (c,v) => { const p = st.pctl(c,v); return p==null?null:p; };
  const grade = p => p==null?0 : p>=.85?3 : p>=.68?2 : p>=.55?1 : p<=.15?-3 : p<=.32?-2 : p<=.45?-1 : 0;

  // 1 — recent form (trailing hit rate) + the visible last-10 streak
  {
    const p = rel('bHit', b.bHit), g = grade(p);
    const hits = b.last10 ? [...b.last10].filter(c=>c==='1').length : null;
    const span = b.last10 ? b.last10.length : 0;
    let txt = `Trailing hit rate ${pct(b.bHit,1)} over ${b.bGames??'—'} games`;
    if(hits!=null) txt += ` · hit in ${hits} of last ${span}`;
    add({ k:'form', dir:Math.sign(g), s:Math.abs(g), label:'Recent form', text:txt,
          val:pct(b.bHit,1), pctl:p });
  }
  // 2 — contact quality (xBA + hard-hit): the "is the form real" check
  {
    const px = rel('bXba', b.bXba), ph = rel('bHard', b.bHard);
    const p = px==null?ph : ph==null?px : (px*.6+ph*.4), g = grade(p);
    add({ k:'contact', dir:Math.sign(g), s:Math.abs(g), label:'Contact quality',
          text:`xBA ${num(b.bXba,3)} · hard-hit ${pct(b.bHard,1)} · BABIP ${num(b.bBabip,3)}`,
          val:num(b.bXba,3), pctl:p,
          note: (b.bHit!=null&&b.bXba!=null&&b.bHit-b.bXba>.05) ? 'Results are running ahead of contact quality — some of this form is luck.'
              : (b.bXba!=null&&b.bHit!=null&&b.bXba-b.bHit>.05) ? 'Contact quality is ahead of results — hits may be owed.' : null });
  }
  // 3 — whiff risk: batter K rate against this pitcher's CSW / K rate
  {
    const bk = rel('bK', b.bK), pc = rel('pCsw', b.pCsw);
    const risk = (bk==null?.5:bk)*.5 + (pc==null?.5:pc)*.5;   // high = bad for the batter
    const g = grade(1-risk);
    add({ k:'whiff', dir:Math.sign(g), s:Math.abs(g), label:'Whiff risk',
          text:`Batter K ${pct(b.bK,1)} vs pitcher CSW ${pct(b.pCsw,1)}${b.pK9!=null?` · ${num(b.pK9,1)} K/9`:''}`,
          val:pct(b.bK,1), pctl:1-risk });
  }
  // 4 — the pitcher he actually faces
  {
    const p = rel('pRating', b.pRating);
    const g = grade(p==null?null:1-p);                       // strong pitcher = bad for batter
    const line = [];
    if(b.pEra!=null) line.push(`${num(b.pEra,2)} ERA`);
    if(b.pWhip!=null) line.push(`${num(b.pWhip,2)} WHIP`);
    if(b.pH9!=null) line.push(`${num(b.pH9,1)} H/9`);
    const rank = p==null ? ''
      : p<=.05 ? ", among the weakest arms on this card"
      : p>=.95 ? ", among the toughest arms on this card"
      : `, stronger than ${Math.round(p*100)}% of the arms on this card`;
    // The model grades arms on CSW / K-BB / hard-hit allowed, not on ERA. When
    // those two views disagree, say so — a "beatable arm" chip next to a 2.50
    // ERA otherwise just looks broken.
    const disagree = p!=null && b.pEra!=null &&
      ((p<.4 && b.pEra<3.4) ? 'His ERA looks better than his underlying stuff — the grade is built on contact quality and whiffs, not runs allowed.'
     : (p>.6 && b.pEra>4.5) ? 'His ERA looks worse than his underlying stuff — the grade weighs whiffs and contact quality over runs allowed.' : null);
    add({ k:'pitcher', dir:Math.sign(g), s:Math.abs(g),
          label:`Opposing ${b.pRole==='RP'?'reliever':'starter'}`,
          text:`${b.pit||'TBD'} (${b.pitHand||'?'}HP) — grade ${b.pGrade||'?'}${rank}. Season: ${line.join(' · ')||'no line'}`,
          val:b.pGrade||'—', pctl:p==null?null:1-p,
          note:b.opener?'Listed as an opener — expect a short outing and an early bullpen look.'
             : b.pRookie?'Rookie arm — limited book on him, treat the grade as provisional.'
             : disagree });
  }
  // 5 — plate-appearance volume: more trips = more chances, the most literal driver
  {
    const p = rel('bPA', b.bPA), g = grade(p);
    const slotTxt = b.slot ? `Batting ${b.slot}${['th','st','nd','rd'][b.slot%10>3?0:(b.slot%100-b.slot%10==10)?0:b.slot%10]||'th'}` : 'Slot unknown';
    add({ k:'volume', dir:Math.sign(g), s:Math.abs(g), label:'Plate appearances',
          text:`${slotTxt} — averaging ${num(b.bPA,2)} PA / ${num(b.bAB,2)} AB per game`,
          val:num(b.bPA,2), pctl:p });
  }
  // 6 — pitch-mix fit: weight his per-pitch-type success by what this arm throws
  {
    if(b.useFb!=null && b.hrFb!=null){
      const fit = (b.useFb*b.hrFb) + (b.useBb??0)*(b.hrBb??0) + (b.useOs??0)*(b.hrOs??0);
      const d = b.hrAll!=null ? fit-b.hrAll : null;
      const g = d==null?0 : d>.02?2 : d>.007?1 : d<-.02?-2 : d<-.007?-1 : 0;
      const mix = [['fastball',b.useFb,b.hrFb],['breaking',b.useBb,b.hrBb],['offspeed',b.useOs,b.hrOs]]
        .sort((a,c)=>(c[1]||0)-(a[1]||0));
      add({ k:'pitchmix', dir:Math.sign(g), s:Math.abs(g), label:'Pitch-mix fit',
            text:`Throws ${pct(mix[0][1],0)} ${mix[0][0]}; he reaches base ${pct(mix[0][2],1)} against it (${pct(b.hrAll,1)} overall)`,
            val:(d==null?'—':(d>0?'+':'')+ (d*100).toFixed(1)+'pt') });
    }
  }
  // 7 — park
  {
    if(b.park!=null && Math.abs(b.park-1)>.005){
      const g = b.park>1.03?2 : b.park>1.01?1 : b.park<.97?-2 : b.park<.99?-1 : 0;
      add({ k:'park', dir:Math.sign(g), s:Math.abs(g), label:'Ballpark',
            text:`Park factor ${num(b.park,2)} — ${b.park>1?'plays up':'suppresses'} offence by ${Math.abs((b.park-1)*100).toFixed(0)}%`,
            val:num(b.park,2) });
    }
  }
  // 8 — first-three-AB quality: does he do damage before the bullpen arrives
  {
    if(b.bQ3!=null && (b.bQ3n??0)>=10){
      const p = rel('bQ3', b.bQ3), g = grade(p);
      add({ k:'q3', dir:Math.sign(g), s:Math.abs(g), label:'Early-game quality',
            text:`${pct(b.bQ3,1)} quality contact in his first 3 ABs (${b.bQ3n} games)`, val:pct(b.bQ3,1), pctl:p });
    }
  }
  // 9 — rest
  {
    if(b.bRest!=null && b.bRest>=2){
      add({ k:'rest', dir:b.bRest>=4?-1:0, s:b.bRest>=4?1:0, label:'Time off',
            text:`${b.bRest} days since his last game${b.bRest>=4?' — rust risk on a long layoff':''}`, val:b.bRest+'d' });
    }
  }
  // ── context only — real information, explicitly not model signal ────────
  // starter vs reliever split
  if(b.vsSP!=null && (b.paSP??0)>=50){
    const d = (b.vsRP!=null&&(b.paRP??0)>=50) ? b.vsSP-b.vsRP : null;
    add({ k:'splits', dir:0, s:0, label:'Starters vs relievers', ctx:true,
          text:`${pct(b.vsSP,1)} vs SP (${b.paSP} PA) · ${b.vsRP!=null?pct(b.vsRP,1)+` vs RP (${b.paRP} PA)`:'no RP sample'}${d?` — ${Math.abs(d*100).toFixed(1)}pt ${d>0?'better':'worse'} against starters`:''}`,
          val:pct(b.vsSP,1) });
  }
  // platoon — computed for display, measured at −0.0001 AUC and cut from FEATURES on 2026-07-25
  if(b.splitDiff!=null && Math.abs(b.splitDiff)>.01 && b.vsL!=null && b.vsR!=null){
    add({ k:'platoon', dir:0, s:0, label:'Platoon split', ctx:true,
          text:`${pct(b.vsL,1)} vs LHP · ${pct(b.vsR,1)} vs RHP — faces a ${b.pitHand}HP in this game`,
          val:(b.splitDiff>0?'+':'')+(b.splitDiff*100).toFixed(1)+'pt',
          note:'Tested and cut from the model on 2026-07-25 (no measurable lift). Shown for your read, not the score.' });
  }
  // batter vs pitcher history — almost always too small to mean anything
  if((b.bvpAB??0)>0){
    add({ k:'bvp', dir:0, s:0, label:'Career vs this pitcher', ctx:true,
          text:`${b.bvpH}-for-${b.bvpAB} (${num(b.bvpAvg,3)})${b.bvpAB<20?' — sample far too small to lean on':''}`,
          val:`${b.bvpH}/${b.bvpAB}` });
  }
  if(b.bRookie){
    add({ k:'rookie', dir:0, s:0, label:'Rookie bat', ctx:true, warn:true,
          text:`${b.bSeasonG??'few'} career games — trailing windows are thin and the score is less settled.`, val:'ROOKIE' });
  }
  if(!b.confirmed){
    add({ k:'est', dir:0, s:0, label:'Projected lineup', ctx:true, warn:true,
          text:'This lineup is estimated, not posted. Slot, and therefore expected plate appearances, can still change.', val:'EST' });
  }
  // rank: model-signal items by strength, context after
  const sig = out.filter(o=>!o.ctx).sort((a,b2)=>b2.s-a.s || Math.abs(b2.dir)-Math.abs(a.dir));
  const ctx = out.filter(o=>o.ctx);
  return {signal:sig, context:ctx, all:sig.concat(ctx)};
}

/** One-sentence verdict: strongest push, strongest drag, honest hedge. */
function verdict(b, ev, st){
  const up   = ev.signal.filter(e=>e.dir>0 && e.s>=2)[0];
  const down = ev.signal.filter(e=>e.dir<0 && e.s>=2)[0];
  const r = rankOf(b);
  const where = r ? `<b>#${r}</b> of ${S.batters.length} on this slate` : '';
  const lo = e => phraseOf(e).toLowerCase();
  const lead = up && down ? `${lo(up)} carries it, ${lo(down)} holds it back`
             : up ? `carried by ${lo(up)}`
             : down ? `dragged down by ${lo(down)}`
             : 'no single factor dominates';
  return { where, lead };
}

/* ══════════════════════════════════════════════════════════════════════
   4 · calibration — measured, not claimed
   ══════════════════════════════════════════════════════════════════════ */
/* The FEATURES 21 -> 14 cut and retrain on this date collapsed the low tail of
   the score distribution: before it, every slate's floor was ~0.28-0.34 and
   ~35% of picks scored under 55%; from 07-25 on the floor is ~0.47-0.50 and
   only ~7% land under 55%. So the settled record spans TWO model generations,
   and the bands below ~45 are the record of a model that can no longer produce
   a score in them. They stay in the table — this is the Honesty tab — but they
   are not the current model's calibration and must not be drawn as if they
   were. Bump this when a change alters the emitted range again. */
const MODEL_ERA = '2026-07-25';
/* The band range the reliability curve is drawn over: everything the current
   model actually emits, with headroom on both sides. Not a "good scores only"
   filter — the worst-calibrated band in the whole record (75, -12pt) is inside
   it, and tonight's floor of ~0.47 would fall outside a 60-cut. */
const CAL_LO = .45, CAL_HI = .80;
async function calibration(){
  return load('cal', async () => {
    const {body} = await getAny(['./picks_log.csv','/picks_log.csv'],{timeout:25000});
    const rows = parseCSV(body);
    /* One row per (game_pk, batter), keeping the latest date.
       A rained-out game is rescheduled keeping its game_pk, so the slate logs
       the same batter twice — once on the postponed date, once on the makeup
       date. settle.py keys outcomes by (game_pk, batter), correctly, so BOTH
       rows carry the makeup game's real result: the outcomes agree and nothing
       is mis-settled. But counting both double-weights those games and lets the
       staler forecast vote twice, and the early row's features are as of the
       rainout (a month behind, for the 06-25 → 07-23 pair). The later date is
       always the date the game was actually played. 226 of 28,567 settled rows
       — 0.8% — as of 2026-07-26, across 17 postponed games. */
    const once=new Map();
    for(const r of rows){
      const k=r.game_pk+'|'+r.batter, prev=once.get(k);
      if(!prev || String(r.date) > String(prev.date)) once.set(k, r);
    }
    const bands=new Map(), days=new Map();
    let n=0, brier=0, sumP=0, hits=0, eraN=0;
    /* The headline row measures the range the current model scores in, not the
       whole file. Below CAL_LO the record belongs to the pre-MODEL_ERA model
       (see above), and its bands run +13 to +25pt off — folding them in moved
       the overall gap to +3.7pt and made the serving model look badly
       miscalibrated on picks it cannot produce. Scoped, it is -0.2pt. The full
       -record numbers are still printed under the grid; nothing is hidden.
       Not scoped by DATE, which would be the literal reading of "the current
       model": that subset is empty until the first post-retrain settle. */
    let ln=0, lbrier=0, lsumP=0, lhits=0, lfirst='';
    for(const r of once.values()){
      const p=N(r.p_hit), a=r.actual_hit;
      if(p==null || (a!=='0'&&a!=='1')) continue;
      const y=+a; n++; brier+=(p-y)**2; sumP+=p; hits+=y;
      const era = String(r.date) >= MODEL_ERA; if(era) eraN++;
      if(p>=CAL_LO && p<CAL_HI){                // == the bands marked `live`
        ln++; lbrier+=(p-y)**2; lsumP+=p; lhits+=y;
        if(!lfirst || String(r.date)<lfirst) lfirst=String(r.date);
      }
      /* Clamped at CAL_HI, not at .75: the old .75 ceiling folded every score
         above 80% into the "75%–80%" row, so 17 picks that the model called
         81.8% (and that landed 52.9%) were displayed as if it had said 76% and
         dragged that band 0.8pt worse than it is. They get their own row. */
      const bk=Math.min(CAL_HI,Math.max(.2,Math.floor(p*20)/20));
      const B=bands.get(bk)||{n:0,h:0,p:0,nEra:0}; B.n++; B.h+=y; B.p+=p; if(era) B.nEra++; bands.set(bk,B);
      const D=days.get(r.date)||{n:0,h:0,p:0}; D.n++; D.h+=y; D.p+=p; days.set(r.date,D);
    }
    return {
      // headline = live range; `all` keeps the unscoped record for the footnote
      n:ln, brier:lbrier/ln, baseRate:lhits/ln, meanP:lsumP/ln, since:lfirst,
      all:{n, brier:brier/n, baseRate:hits/n, meanP:sumP/n},
      era:MODEL_ERA, eraN, lo:CAL_LO, hi:CAL_HI,
      /* `live` = a band the CURRENT model can still land a score in; charted and
         counted in the headline. `pos` says which side a dead band fell off:
         'lo' is the pre-MODEL_ERA floor, 'hi' is the handful of >=80% scores no
         slate has produced since 07-18. Both stay in the table. */
      bands:[...bands.entries()].sort((a,b)=>a[0]-b[0]).map(([k,v])=>({band:k,...v,act:v.h/v.n,pred:v.p/v.n,
        pos: k+.05<=CAL_LO ? 'lo' : k>=CAL_HI ? 'hi' : 'in', live: k+.05>CAL_LO && k<CAL_HI})),
      days:[...days.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>({date:k,...v,act:v.h/v.n,pred:v.p/v.n}))
    };
  });
}
/** What a score in this band has actually done historically. The single most
    mission-critical number on the page: it audits the score in front of you.
    Returns null for a band the current model cannot produce — reachable by
    viewing an archived slate from before MODEL_ERA, where a 0.31 would
    otherwise be "audited" against a band no live score ever enters. */
function bandFor(cal,p){
  if(!cal||p==null) return null;
  const k=Math.min(.75,Math.max(.2,Math.floor(p*20)/20));
  const b = cal.bands.find(b=>b.band===k);
  return b && b.live ? b : null;
}

const S = {                                   // app state

const TODAY = () => new Date().toLocaleDateString('en-CA');   // local, not UTC

async function loadSlate(){
  // Tonight is the live file; any other date comes from the slates/ archive.
  // Dual paths because the same page is served by Flask and by GH Pages —
  // the mirror ships the identical CSVs as static files (push_to_dash()).
  const paths = S.date
    ? (ON_SERVER ? ['/slate/'+S.date, './slates/'+S.date+'.csv'] : ['./slates/'+S.date+'.csv'])
    : (ON_SERVER ? ['/csv','./tonight_p_hit.csv'] : ['./tonight_p_hit.csv']);
  const {body,modified} = await getAny(paths, {timeout:20000});
  const rows = parseCSV(body).filter(r=>r.name && r.p_hit);
  if(!rows.length) throw new Error('no rows in that slate');
  S.batters = rows.map(toBatter);
  S.st = slateStats(S.batters);
  S._rank = null;
  S.modified = modified;
  // The snapshot is a per-day "what changed since this morning" baseline for
  // the LIVE slate. Running it on an archive would diff a finished day against
  // today's baseline and — worse — overwrite that baseline with archived rows.
  if(!S.date) snapshotDiff();
  else S.snap = null;
}
/** Archive dates for the picker. /slates locally; on the mirror the static
    slates_index.json manifest push_to_dash() ships, since GitHub Pages can't
    list a directory. Absent manifest → no picker, never an error. */
async function loadDates(){
  try{
    const {body} = await getAny(
      ON_SERVER ? ['/slates','./slates_index.json'] : ['./slates_index.json'],
      {json:true,timeout:8000});

/** Switch the whole board to another date (or back to tonight with ''). */
async function goDate(d){
  if(d === S.date) return;
  const prev = S.date;
  S.date = d;
  try{
    await loadSlate();
  }catch(e){
    S.date = prev;
    toast(/404/.test(e.message) ? `No archived slate for ${d}` : `Couldn't load ${d}`);
    renderDateSel();
    return;
  }
  S.live = {}; clearTimeout(liveTimer);
  S.preview = {};        // what-ifs belong to the slate they were opened on
  render();
  if(!S.date) loadLive().then(()=>{ render(); scheduleLive(); });
}
/** "Since this morning" — the day's highest-value moment is lineup
    confirmation at ~12:00 PT. Nothing server-side records it, so we keep a
    per-day local snapshot and diff against it. */
function snapshotDiff(){
  const today = new Date().toISOString().slice(0,10);
  const prev = store.get('snap.'+today, null);
  if(prev){
    S.snap = {at:prev.at, moves:[]};
    for(const b of S.batters){
      const o = prev.rows[key(b)];
      if(!o){ S.snap.moves.push({b, kind:'new'}); continue; }
      const dp = b.p - o.p;
      const confirmedNow = b.confirmed && !o.confirmed;
      if(Math.abs(dp) >= .015 || confirmedNow || b.slot !== o.slot)
        S.snap.moves.push({b, kind:'move', dp, confirmedNow, slotFrom:o.slot});
    }
    for(const k in prev.rows){
      if(!S.batters.some(b=>key(b)===k)) S.snap.moves.push({name:prev.rows[k].name, team:prev.rows[k].team, kind:'gone'});
    }
    S.snap.moves.sort((a,b)=>Math.abs(b.dp||0)-Math.abs(a.dp||0));
  }
  const rows={}; S.batters.forEach(b=>rows[key(b)]={p:b.p,confirmed:b.confirmed,slot:b.slot,name:b.name,team:b.team});
  if(!prev || (Date.now()-new Date(prev.at).getTime())>1000*60*60*10)
    store.set('snap.'+today,{at:new Date().toISOString(),rows});
  else store.set('snap.'+today,{at:prev.at,rows:prev.rows});   // keep the morning baseline
}
const loadJSON = f => load('j'+f, async()=>{ try{ return (await get('./'+f,{json:true,timeout:12000})).body; }catch(e){ return null; } });

/** Live scores — one call for the whole slate, refreshed only while a game
    is in progress and the tab is visible. */
async function loadLive(){
  if(S.date) return;                 // an archived day has nothing live to poll
  const d = new Date(), date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  try{
    // linescore(defense) carries who is ACTUALLY on the mound right now — the
    // input to the live pitcher swap. It rides along on the one schedule call
    // the ticker already makes, so the swap costs no extra request.
    const {body} = await get(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}&hydrate=linescore(defense)`,{json:true,timeout:8000});
    const m={};
    (body.dates?.[0]?.games||[]).forEach(g=>{
      m[g.gamePk] = {
        state:g.status?.detailedState||'', abstract:g.status?.abstractGameState||'',
        away:g.teams?.away?.score, home:g.teams?.home?.score,
        awayAbbr:g.teams?.away?.team?.abbreviation, homeAbbr:g.teams?.home?.team?.abbreviation,
        inning:g.linescore?.currentInningOrdinal, half:halfAbbr(g.linescore?.inningHalf),
        outs:g.linescore?.outs,
        pitcherId:g.linescore?.defense?.pitcher?.id!=null ? String(g.linescore.defense.pitcher.id) : null,
        pitcherName:g.linescore?.defense?.pitcher?.fullName || ''
      };
    });
    S.live = m;
  }catch(e){ /* silent: live data is an enhancement, never a dependency */ }
}
let liveTimer=null;
function scheduleLive(){
  clearTimeout(liveTimer);
  if(S.date) return;
  const anyLive = Object.values(S.live).some(g=>g.abstract==='Live') ||
                  S.batters.some(b=>(b.gameState||'').includes('Progress'));
  if(!anyLive) return;
  liveTimer = setTimeout(async()=>{ if(!document.hidden){ await loadLive(); render(); } scheduleLive(); }, 45000);
}

/* ── watchlist ───────────────────────────────────────────────────────────
   Watch is this dashboard's answer to a bet slip: the set of batters you have
   decided to follow tonight. Starring used to require opening the drawer,
   which is a lot of taps to build a list of eight. Every row carries its own
   star now; the drawer's button stays for when you're already in there. */
const isStarred = b => S.stars.includes(key(b));
function toggleStar(k, name){
  const on = S.stars.includes(k);
  S.stars = on ? S.stars.filter(x=>x!==k) : S.stars.concat(k);
  store.set('stars', S.stars);
  toast(on ? `Removed ${name||'batter'}` : `Watching ${name||'batter'} · ${S.stars.length} on the list`);
  render();
  if(!$('#drawer').hidden) renderDrawer();
}
/** The star itself. Never nested inside .bcard — that element is a <button>,
    and a button inside a button is invalid and behaves unpredictably. It sits
    as a sibling, absolutely positioned over the row's right edge. */
function starBtn(b, cls=''){
  const on = isStarred(b);
  return `<button class="star${on?' on':''} ${cls}" data-star="${key(b)}" data-name="${esc(b.name)}"
    aria-pressed="${on}" aria-label="${on?'Remove':'Add'} ${esc(b.name)} ${on?'from':'to'} watchlist"
    title="${on?'On your watchlist':'Add to watchlist'}">${icon(ICONS.watch)}</button>`;
}

function meter(b){
  const s=S.st.p; if(!s) return '';
  const span=(s.max-s.min)||1;
  const w=clamp((b.p-s.min)/span,0,1)*100, med=clamp((s.med-s.min)/span,0,1)*100;
  return `<span class="meter ${tcls(b.p)}" role="img" aria-label="${pct(b.p,1)}, slate median ${pct(s.med,1)}"><i style="width:${w.toFixed(1)}%"></i><b style="left:${med.toFixed(1)}%"></b></span>`;
}
/** The lineup slot drawn as a scorecard diamond. The batting order is one of
    the few numbers here that is a baseball object rather than a statistic, and
    a rotated square with the number inside it is how every scorecard in the
    game has drawn it — it costs nothing and it reads instantly. */
const slotDiamond = s => s
  ? `<span class="dia" title="Bats ${s} in the order" role="img" aria-label="bats ${s}"><i>${s}</i></span>`
  : `<span class="muted">slot TBD</span>`;
function stripHTML(l10){
  if(!l10) return '<span class="muted" style="font-size:11px">no recent games</span>';
  const s=l10.slice(-10);
  return `<span class="strip" role="img" aria-label="hit in ${[...s].filter(c=>c==='1').length} of last ${s.length}">`+
    [...s].map(c=>`<i class="${c==='1'?'h':'n'}"></i>`).join('')+`</span>`;
}
function lineupTag(b){
  return b.confirmed ? `<span class="tag conf">confirmed</span>` : `<span class="tag est">projected</span>`;
}
const isFinal = b => /final|game over/i.test(S.live[b.gamePk]?.state||b.gameState||'');
/** True once every game has ended — then "final" is a property of the slate,
    not of each batter, and belongs in the ribbon instead of on 270 cards. */
const slateOver = () => S.batters.length>0 && S.batters.every(isFinal);
function stateTag(b){
  const g=S.live[b.gamePk], s=(g?.state||b.gameState||'');
  if(b.hasHit) return `<span class="tag hit">hit ✓</span>`;
  if(/progress|live/i.test(s)) return `<span class="tag live">${esc(g?.inning?(g.half||'')+' '+g.inning:'live')}</span>`;
  if(/final|game over/i.test(s) && !slateOver()) return `<span class="tag">final</span>`;
  return '';
}
function chipFor(e){
  const cls = e.warn?'warn' : e.ctx?'out' : e.dir>0?'up' : e.dir<0?'down' : 'flat';
  const arrow = e.ctx?'' : e.dir>0?'↑' : e.dir<0?'↓' : '·';
  return `<span class="chip ${cls}">${arrow?arrow+' ':''}${esc(phraseOf(e))}${e.val?` <span class="k">${esc(e.val)}</span>`:''}</span>`;
}
/** Rank within tonight's field. With scores packed into 47–75%, "3rd of 270"
    communicates standing far better than the percentage on its own. */
function rankOf(b){
  if(!S._rank){ S._rank=new Map(); [...S.batters].sort((x,y)=>y.p-x.p).forEach((x,i)=>S._rank.set(key(x),i+1)); }
  return S._rank.get(key(b));
}
/** Three weights, not two. `hero` gets a categorically different treatment —
    accent rule, gradient wash, 60px score; one thing on the page is loudest.
    `lite` is the other end: the tail of a shortlist is a LIST, so it drops the
    evidence chips, the form strip and the pitcher grade and keeps only what a
    scan needs — name, side, score. Ten identical full-weight cards is what
    made Today read as one flat wall of information. */
function batterCard(b, rank, hero, idx, lite){
  const ev = evidence(b,S.st);
  const narrow = window.innerWidth < 600;
  // One chip per phone row, two on a wide one. A chip that wraps onto its own
  // line costs a whole row of height, which is how nine top-tier cards became
  // three thumb-scrolls; the rest of the evidence is one tap away in the drawer.
  const top = lite ? [] : ev.signal.filter(e=>e.s>=2).slice(0, hero ? (narrow?2:3) : (narrow?1:2));
  // 'est' is already stated by the PROJECTED tag on the name line — repeating
  // it as a chip costs a whole row on a phone and says nothing new. It stays
  // in the drawer's Context list, where it explains the consequence.
  const flags = lite ? [] : ev.context.filter(e=>e.warn && e.k!=='est').slice(0,1);
  const r = rankOf(b);
  const p = pct(b.p,1).replace('%','');
  // The identity column always carries a rank now, so "#5 of 270" beside the
  // score would repeat the 5 already on the row. Keep it only on the hero,
  // whose big stylised 1 does not read as a number and where "of 270" is the
  // part actually worth saying.
  const showRank = r && hero;
  // --i drives the staggered entrance in the Aurora theme. Capped at 14 so a
  // 270-row list does not end with a nine-second cascade.
  const pos = rank ?? idx ?? 0;
  const stagger = Math.min(pos, 14);
  const cls = hero ? ' hero' : lite ? ' lite' : '';
  // The club badge and the rank are one identity column: the badge answers
  // "whose player is this" from the shape, the rank answers "where does he
  // stand". Two answers, one glance, one column — which is why the matchup no
  // longer has to mark the batter's own side.
  return `<div class="brow${cls}"><button class="bcard${cls}${pos<20?' stagger':''}" data-k="${key(b)}" style="--i:${stagger};--tc:${tc(b.team,'var(--line2)')}">
    ${teamMark(b.team)}
    <span class="bid">${teamBadge(b.team, lite?'bg-sm':'')}<span class="rank num">${rank!=null?rank:(r?'#'+r:'')}${hero?'<b>RANK</b>':''}</span></span>
    <span class="bmain">
      <span class="bname">${esc(b.name)} ${lite?'':lineupTag(b)} ${stateTag(b)}</span>
      <span class="bmeta">${matchupHTML(b.matchup)} · ${slotDiamond(b.slot)} · vs ${esc(b.pit||'TBD')}${lite||narrow?'':` ${gradePill(b.pGrade)}`}</span>
      ${lite?'':`<span class="bwhy">${top.map(chipFor).join('')}${flags.map(chipFor).join('')}${stripHTML(b.last10)}</span>`}
    </span>
    <span class="bscore">
      <span class="pct ${tcls(b.p)}">${p}<span>%</span></span>
      ${meter(b)}
      ${showRank?`<span class="slaterank">#${r} of ${S.batters.length}</span>`:''}
    </span>
  </button>${starBtn(b)}</div>`;
}

  return `<div class="ribbon">

    ${S.st.p?cell('Range', `${pct(S.st.p.min,0).replace('%','')}–${pct(S.st.p.max,0).replace('%','')}<small>%</small>`):''}
    ${S.date ? cell('Slate', dateLabel(S.date).replace(' · preview','<small> preview</small>'))
             : (ago!=null?cell('Scored', `${ago<60?ago+'<small>m</small>':Math.round(ago/60)+'<small>h</small>'} ago`, stale?'warn':''):'')}
    ${over&&!S.date?cell('Status','FINAL','warn'):''}

/* ── Today ─────────────────────────────────────────────────────────── */
function viewToday(){
  const ranked=[...S.batters].sort((a,b)=>b.p-a.p);
  const short=ranked.slice(0,10);
  // The "Since <time>" section (lineup churn since a morning snapshot) lived
  // here until 2026-07-26 — cut on client call: it never earned its screen
  // space. The snapshot machinery (S.snap) stays, in case a quieter use for
  // it appears; recover the section itself from git history.

  const bandNote = b => { const bd=bandFor(S.cal,b?.p); return bd&&bd.n>60 ? `<span class="muted">history: this band has landed <span class="num">${pct(bd.act,1)}</span> over ${bd.n.toLocaleString()} picks</span>` : ''; };

  /* Three weights inside one shortlist, because ten equally-loud cards give the
     eye nowhere to land: the top name, then the handful still genuinely in the
     conversation with it, then the tail as a scannable list. The cut at 4 is a
     display choice, not a claim about the scores — the note under the tail says
     so, and the gap between #1 and #10 is usually a couple of points. */
  const lead = short.slice(0,4), tail = short.slice(4);

  return `${ribbon()}
  <section class="sec lead">
    <div class="sec-h"><h2>${S.date?'Shortlist':"Tonight's shortlist"}</h2><p>Highest calibrated hit probability on the slate</p>
      <button class="lnk" data-go="batters">All ${S.batters.length} →</button></div>
    <div class="blist">${lead.map((b,i)=>batterCard(b,i+1,i===0)).join('')}</div>
    ${tail.length?`<div class="grp-h"><span class="lbl">Also on the shortlist</span><span class="rule"></span>
      <span class="lbl soft">${pct(tail[tail.length-1].p,1).replace('%','')}–${pct(tail[0].p,1)}</span></div>
    <div class="blist tail">${tail.map((b,i)=>batterCard(b,i+lead.length+1,false,null,true)).join('')}</div>`:''}
    <p class="note">
      ${bandNote(short[0])} · Ranking is by the model score alone; open any batter for the evidence behind it.
    </p>
  </section>
  <section class="sec sub">
    <div class="sec-h"><h2>Where the bats are</h2>
      <p>Warmer games hold more of tonight's best bats · ${gameStripCount()}</p>
      <button class="lnk" data-go="teams">Lineups →</button></div>
    ${gameStrip()}
  </section>`;
}

/** Today's games are CONTEXT, not the subject — the full cards belong on the
    Teams tab, one tap away. Fifteen of them inline was the single largest block
    on the page and the least important thing on it, so here each game is one
    line: who is playing, when, and each side's average score with its best bat.
    Reuses the same per-game grouping lineups() does, deliberately without the bullpen
    what-if machinery, which only makes sense at full detail.

    Rebuilt 2026-07-26. The old version was fifteen time-ordered rows of bare
    percentages spanning 57–68 — a range the eye cannot rank — with the games
    already OVER sitting at the top, because they started earliest. So the
    section had no answer to "what am I looking at this for". It has one now:
    **which games still have bats worth watching.** Three changes carry that:
      · grouped by whether you can still act on it — still to come, in progress,
        final — instead of a flat clock ordering, and the settled ones are
        de-emphasised at the bottom where they belong;
      · every average drawn against tonight's own spread of lineup averages,
        the same trick meter()/luMeter() use, so 57 and 68 stop looking alike;
      · a count of each side's bats in the slate's top fifth, which is the
        thing that actually separates one game from another — two lineups can
        average 63% with one of them holding three of tonight's best names.
    Within a group the order is still first pitch, since a schedule read in
    any other order is not a schedule.

    Third pass, same day: the four-column version answered the question but
    made the reader decode dots, a bar and two percentages per side to get it —
    convoluted, per the client. This one is a plain schedule where the ROW
    ITSELF carries the answer: warmth (left edge + wash, `--heat` 0..1 scaled
    to the hottest game tonight) shows where the top-fifth bats are, a short
    caption says it in words ("4 top bats"), and everything else — averages,
    bars, best-bat names — moved into the hover title and the Teams tab, which
    the whole row now links to. Nothing to decode; the hot games just look hot. */
/** Top fifth of tonight's field. A fixed cutoff would call every bat "hot" on a
    friendly slate and none on a hard one; a percentile is always the same
    fraction of the field. Shared so the footnote can name the actual number. */
function hotCutoff(){
  const ps=S.batters.map(b=>b.p).filter(p=>p!=null&&!isNaN(p)).sort((a,b)=>a-b);
  return ps.length ? ps[Math.floor(ps.length*0.8)] : Infinity;
}
function gameStripData(){
  const byGame=new Map();
  for(const b of S.batters){ if(!byGame.has(b.gamePk)) byGame.set(b.gamePk,[]); byGame.get(b.gamePk).push(b); }
  const hotCut=hotCutoff();
  const games=[...byGame.entries()].map(([pk,bs])=>{
    const g=S.live[pk]||{};
    const state=String(g.state||bs[0].gameState||'');
    // `abstract` is the authority ('Preview' | 'Live' | 'Final'); the regex on
    // `state` only covers a feed that omits it. Do NOT infer "final" from the
    // score being present — the live feed reports 0–0 for a game that has not
    // started, which filed every pre-game matchup under Final, dimmed at the
    // bottom of the strip, with a "0–0" beside it.
    const live = g.abstract==='Live'  || (!g.abstract && /progress/i.test(state));
    const fin  = g.abstract==='Final' || (!g.abstract && /final|game over/i.test(state));
    const pre  = !live && !fin;
    // "AWAY @ HOME" — the same parse lineups() does, so the away side is drawn
    // on the left the way every scoreboard in the sport draws it.
    const order=String(bs[0].matchup||'').split('@').map(s=>s.trim());
    const teams=[...new Set(bs.map(b=>b.team))]
      .sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    const sides=teams.map(t=>{
      const tb=bs.filter(b=>b.team===t);
      return {team:t, n:tb.length,
        avg: tb.reduce((s,b)=>s+b.p,0)/tb.length,
        best: [...tb].sort((x,y)=>y.p-x.p)[0],
        hot: tb.filter(b=>b.p>=hotCut).length};
    });
    return {pk, g, live, fin, pre, start:bs[0].startTime||'', sides,
            grp: fin?2:live?1:0, hot:sides.reduce((s,x)=>s+x.hot,0),
            // the names behind the heat, hottest first — what the middle of the
            // row shows instead of blank space
            hotBats: bs.filter(b=>b.p>=hotCut).sort((x,y)=>y.p-x.p),
            best: [...bs].sort((x,y)=>y.p-x.p)[0]};
  });
  games.sort((a,b)=> a.grp-b.grp || startMin(a.start)-startMin(b.start));
  return games;
}
/** The tail of the section's subtitle. "15 on the card" was a fact about the
    schedule; what a reader wants is how much of tonight is still ahead of them.
    The heading states the QUESTION, this states how much of it is still open. */
function gameStripCount(){
  const gs=gameStripData(), n=gs.length;
  const pre=gs.filter(x=>x.grp===0).length, live=gs.filter(x=>x.grp===1).length;
  const bits=[];
  if(pre)  bits.push(`${pre} still to come`);
  if(live) bits.push(`${live} in progress`);
  if(n-pre-live) bits.push(`${n-pre-live} final`);
  return bits.join(' · ') || `${n} on the card`;
}
const GS_GROUP = ['Still to come','In progress','Final'];
function gameStrip(){
  const games=gameStripData(), hotCut=hotCutoff();
  if(!games.length) return '';
  // Heat is scaled to the hottest game TONIGHT, not an absolute count, for the
  // same reason the cutoff is a percentile: the strip should always have a
  // visible warm end, whatever kind of slate this is.
  const maxHot=Math.max(1,...games.map(x=>x.hot));

  let out='', grp=-1;
  for(const x of games){
    if(x.grp!==grp){
      grp=x.grp;
      const n=games.filter(y=>y.grp===grp).length;
      out+=`<div class="grp-h gsgrp"><span class="lbl">${GS_GROUP[grp]}</span><span class="rule"></span>
        <span class="lbl soft">${n}</span></div>`;
    }
    const g=x.g, a=x.sides[0], h=x.sides[1]||x.sides[0];
    // Everything the old columns said, demoted to the hover title where it can
    // be prose instead of a puzzle.
    const detail=x.sides.map(s=>`${s.team}: ${s.hot||'no'} top bat${s.hot===1?'':'s'}, best ${s.best.name} ${pct(s.best.p,0)}`).join(' · ');
    // Score sits BETWEEN the badges, not beside the time — "NYY 1 @ 2 PHI"
    // reads as one unit, and each number gets its own fixed-width slot so a
    // 1 becoming a 12 doesn't reflow the badges around it on every live poll.
    const awayN = (!x.pre && g.away!=null) ? esc(String(g.away)) : '';
    const homeN = (!x.pre && g.home!=null) ? esc(String(g.home)) : '';
    out+=`<button class="gsrow${x.fin?' done':''}" data-go="teams"
      ${x.hot?`style="--heat:${(x.hot/maxHot).toFixed(2)}"`:''}
      title="${esc(detail)} — full lineups on Teams.">
      <span class="gswhen">${
        x.live
          ? `<span class="tag live">${esc(((g.half||'')+' '+(g.inning||'')).trim()||'live')}</span>`
          : `<span class="gstime">${esc(x.start)}</span>`
      }</span>
      <span class="gsmid">${teamBadge(a.team,'bg-sm')}
        <span class="gsscore num">${awayN}</span>
        <span class="gsat">@</span>
        <span class="gsscore num">${homeN}</span>
        ${teamBadge(h.team,'bg-sm')}</span>
      <span class="gsbats">${(()=>{
        // Once the game is underway, each name answers its own question: ✓ he
        // hit, ✗ his game ended without one. A live game with no hit yet shows
        // nothing — still undecided is not a miss.
        const mark=b=>b.hasHit?'<i class="gshit" title="recorded a hit">✓</i>'
                     :x.fin?'<i class="gsmiss" title="no hit">✗</i>':'';
        const one=b=>`<b>${esc(b.name)}</b> <span class="num">${pct(b.p,0)}</span>${mark(b)}`;
        return x.hot
          ? x.hotBats.slice(0,4).map(one).join('<span class="gsdot">·</span>')
            + (x.hot>4?`<span class="gsmore">+${x.hot-4} more</span>`:'')
          : (x.best?`<span class="gsbest">best ${one(x.best)}</span>`:'');
      })()}</span>
      ${x.hot?`<span class="gsn num">${x.hot} top bat${x.hot===1?'':'s'}</span>`:'<span class="gsn"></span>'}
    </button>`;
  }
  return `<div class="gstrip">${out}</div>
    <p class="note">Warmer rows hold more of tonight's best bats — the slate's top fifth, scoring
      ${pct(hotCut,0)} or better. Tap a game for its full lineups.</p>`;
}

/* ── Batters ───────────────────────────────────────────────────────── */
function filtered(){
  const f=S.filters, q=f.q.toLowerCase();
  let list=S.batters.filter(b=>{
    if(q && !(b.name.toLowerCase().includes(q)||b.team.toLowerCase().includes(q)||(b.pit||'').toLowerCase().includes(q))) return false;
    if(f.team && b.team!==f.team) return false;
    if(f.game && b.gamePk!==f.game) return false;
    if(f.slot && String(b.slot)!==f.slot) return false;
    if(f.lineup==='conf' && !b.confirmed) return false;
    if(f.lineup==='est' && b.confirmed) return false;
    return true;
  });
  // dir: 1 = ascending, -1 = descending. Nulls always sort last.
  const k=f.sort;
  list.sort((a,b)=>{
    const va=a[k], vb=b[k];
    if(typeof va==='string'||typeof vb==='string') return f.dir*String(va??'').localeCompare(String(vb??''));
    if(va==null) return 1; if(vb==null) return -1;
    return f.dir*(va-vb);
  });
  return list;
}
/* ── the score tiers, as list furniture ───────────────────────────────────
   270 rows in one undifferentiated scroll gives the eye no landmarks, so the
   list is banded by the SAME tiers the score colours already use (tierOf) —
   the bands are not new information, they are the existing colour coding made
   findable. Only meaningful when the list is ordered by score: banding a
   name-sorted list would cut it into stripes that mean nothing. */
const TIER_LABEL = {hi:'70% and up', mid:'55 – 70%', lo:'Under 55%'};
function tierBands(list, sortedByScore){
  if(!sortedByScore) return null;
  const out=[]; let cur=null;
  list.forEach((b,i)=>{
    const t=tierOf(b.p);
    if(t!==cur){ out.push({at:i, tier:t, n:0}); cur=t; }
    out[out.length-1].n++;
  });
  return out.length>1 ? out : null;      // one band is the same as no bands
}

function viewBatters(){
  const f=S.filters, list=filtered();
  const teams=[...new Set(S.batters.map(b=>b.team))].sort();
  const games=[...new Map(S.batters.map(b=>[b.gamePk,b.matchup])).entries()];
  /* Four groups, in reading order: WHO the batter is, what the MODEL says,
     what the BATTER has been doing, and what he is up against. The columns
     were always in this order; what was missing was any sign of it — thirteen
     identically-weighted numbers where two of them are the model's output and
     the rest are supporting evidence. The group a column belongs to now sets
     both its heading band and its ink. */
  const cols=[
    ['','#','c rk'],
    ['name','Batter',''],['team','Tm','c'],['slot','Slot','c'],
    ['p','Score','sch g1'],['base','Form','r'],['delta','Matchup','r'],
    ['bHit','Hit%','r g1 dim'],['bXba','xBA','r dim'],['bK','K%','r dim'],
    ['pit','Pitcher','g1'],['pRating','Arm','r dim'],['bPA','PA/g','r dim'],
    ['','','c']
  ];
  // group header band — colspans must total the 14 columns above
  const groups=[[1,''],[3,'Who'],[3,'Model score'],[3,'Batter form'],[3,'The arm'],[1,'']];
  // one <col> per column, in the same order — the widths live in the
  // stylesheet so the table can be table-layout:fixed (see .tblwrap)
  const colgroup = ['rk','name','tm','slot','score','form','mu','hit','xba','k','pit','arm','pa','star']
    .map(c=>`<col class="c-${c}">`).join('');
  const bands = tierBands(list, f.sort==='p');
  const bandRow = (bd,span) => `<tr class="band"><td colspan="${span}">
    <span class="lbl">${TIER_LABEL[bd.tier]||''}</span>
    <span class="rule"></span><span class="lbl soft">${bd.n} ${bd.n===1?'batter':'batters'}</span></td></tr>`;
  const bandAt = i => bands ? bands.filter(bd=>bd.at===i) : [];
  return `${ribbon()}
  <div class="filters">
    <label class="field">${icon(ICONS.search)}<input id="fq" placeholder="Batter, team, pitcher" value="${esc(f.q)}" aria-label="Search"></label>
    <label class="field"><select id="fteam" aria-label="Team"><option value="">All teams</option>${teams.map(t=>`<option ${f.team===t?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="field"><select id="fgame" aria-label="Game"><option value="">All games</option>${games.map(([pk,m])=>`<option value="${pk}" ${f.game===pk?'selected':''}>${esc(m)}</option>`).join('')}</select></label>
    <label class="field"><select id="fslot" aria-label="Lineup slot"><option value="">Any slot</option>${[1,2,3,4,5,6,7,8,9].map(s=>`<option ${f.slot==s?'selected':''}>${s}</option>`).join('')}</select></label>
    <div class="seg" role="group" aria-label="Lineup status">
      <button data-lu="" aria-pressed="${f.lineup===''}">All</button>
      <button data-lu="conf" aria-pressed="${f.lineup==='conf'}">Confirmed</button>
      <button data-lu="est" aria-pressed="${f.lineup==='est'}">Projected</button>
    </div>
    <span class="muted" style="font-size:12.5px">${list.length} shown</span>
  </div>
  <div class="tblwrap" style="display:none" id="tbl">
    <table><colgroup>${colgroup}</colgroup><thead>
      <tr class="grp">${groups.map(([span,label])=>`<th colspan="${span}">${label}</th>`).join('')}</tr>
      <tr>${cols.map(([k,l,a])=> k===''
      ? `<th class="${a}" ${l?'':'aria-label="Watchlist"'}>${l}</th>`   // rank + star: nothing to sort by
      : `<th class="sortable ${a}" data-sort="${k}" ${f.sort===k?`aria-sort="${f.dir<0?'descending':'ascending'}"`:''}>${l}</th>`).join('')}</tr></thead>
    <tbody>${list.map((b,i)=>{
      const d=b.delta;
      return bandAt(i).map(bd=>bandRow(bd,cols.length)).join('')+`<tr data-k="${key(b)}">
        <td class="c rk num">${rankOf(b)??''}</td>
        <td class="nm"><span class="nmw"><b>${esc(b.name)}</b>${b.confirmed?'':'<span class="tag est">est</span>'}${stateTag(b)}</span></td>
        <td class="c">${teamBadge(b.team,'bg-sm')}</td>
        <td class="c">${b.slot?slotDiamond(b.slot):'—'}</td>
        <td class="sc g1"><b class="num ${tcls(b.p)}">${pct(b.p,1)}</b>${meter(b)}</td>
        <td class="r num">${pct(b.base,1)}</td>
        <td class="r num" style="color:${d>0?'var(--tier-hi)':d<0?'var(--bad)':'var(--ink3)'}">${d==null?'—':(d>0?'+':'')+(d*100).toFixed(1)}</td>
        <td class="r num g1 dim">${pct(b.bHit,1)}</td>
        <td class="r num dim">${num(b.bXba,3)}</td>
        <td class="r num dim">${pct(b.bK,1)}</td>
        <td class="ell g1">${esc(b.pit||'TBD')} ${gradePill(b.pGrade||'?')}</td>
        <td class="r num dim">${b.pRating??'—'}</td>
        <td class="r num dim">${num(b.bPA,2)}</td>
        <td class="r">${starBtn(b,'tstar')}</td>
      </tr>`;}).join('')}</tbody></table>
  </div>
  <div class="blist" id="cards">${list.map((b,i)=>
    bandAt(i).map(bd=>`<div class="grp-h"><span class="lbl">${TIER_LABEL[bd.tier]||''}</span>
      <span class="rule"></span><span class="lbl soft">${bd.n}</span></div>`).join('')
    // Full weight for the top tier, lite for everything below it — the same
    // "the tail is a list" move Today's shortlist makes, applied to all 270.
    + batterCard(b,null,false,i, bands ? tierOf(b.p)!=='hi' : false)).join('')}</div>`;
}

/* ── Games ─────────────────────────────────────────────────────────── */
/* ── bullpen preview — "who else could be on that mound?" ────────────────
   live_slate.py's build_bullpen_preview() scores every batter against every
   plausible arm on the opposing roster ahead of time, because the model
   (HistGBM + isotonic) only exists in that process and can never run in the
   browser. Shape: {gamePk: {pitchingTeam: {pitcherId: {…stats, batters:
   {batterId: p_hit}}}}} — so a swap is a lookup, not a re-score.
   Tonight only: the file is rebuilt each slate run and keyed by tonight's
   game_pks, so it is not offered while an archive date is loaded. */
const previewKey = (pk,team) => pk+'|'+team;
/** Candidate arms for the side batting for `team` — i.e. the OPPOSING roster. */
function bullpenFor(pk, battingTeam, teams){
  if(S.date || !S.bullpen) return null;
  const opp = teams.find(t=>t!==battingTeam);
  const cands = opp ? S.bullpen[String(pk)]?.[opp] : null;
  return cands && Object.keys(cands).length ? cands : null;
}
/** Which arm this side's scores should be shown against, and why.
    A manual pick is an explicit choice and always wins over the live swap. */
function armFor(pk, team, cands){
  const pid = S.preview[previewKey(pk,team)];
  if(pid && cands?.[pid]) return {pid, live:false, ...cands[pid]};

  // Live auto-swap: the pitcher actually on the mound, from the same schedule
  // call the ticker uses. Looked up in the OPPONENT's candidate map, which is
  // what keeps this correct without knowing who is batting — at any moment
  // only one team has a pitcher on the mound, so the other side simply misses
  // and stays on its probable starter.
  const g = S.live[pk] || {};
  const lp = g.abstract==='Live' ? g.pitcherId : null;         // pregame has no
  // "current" pitcher to differ from, and after Final the last arm of the night
  // is not what the day should be remembered by.
  const starter = String(S.batters.find(b=>b.gamePk===pk && b.team===team)?.pitId||'');
  if(lp && cands?.[lp] && lp !== starter) return {pid:lp, live:true, ...cands[lp]};
  return null;
}
/** This batter's score against whichever arm the side is previewing, or his
    real one. A candidate with no entry for a batter (roster churn between the
    slate run and now) falls back rather than showing a blank. */
function pFor(b, arm){
  const alt = arm?.batters?.[String(b.batterId)];
  return alt==null ? b.p : alt;
}
const ROLE_ORDER = {SP:0, RP:1, '':2};
function armOptions(cands, sel){
  // SP before RP so an early-inning starter swap is the easy pick, then by
  // sample size; an unlabelled role has no trailing games to classify from.
  return Object.entries(cands)
    .sort((a,b)=>(ROLE_ORDER[a[1].role??''] - ROLE_ORDER[b[1].role??'']) || ((b[1].n_games||0)-(a[1].n_games||0)))
    .map(([pid,c])=>`<option value="${pid}" ${sel===pid?'selected':''}>${c.role?`(${c.role}) `:''}${esc(c.name)} · ${c.n_games||0}G${(c.n_games||0)<8?' ⚠':''}</option>`)
    .join('');
}
function setPreview(pk, team, pid){
  const k = previewKey(pk,team);
  if(pid) S.preview[k]=pid; else delete S.preview[k];
  render();
}

/* ── the lineup, not the matchup ─────────────────────────────────────────
   This tab used to draw one card per GAME: two lineups facing each other
   across a divider, the way a scoreboard draws them. That framing asserts an
   interaction the model does not contain. Nothing scored here is batter
   against batter — the two sides of a game share a park and a first pitch and
   nothing else, and each side's number comes entirely from ITS nine bats
   against the ONE arm in front of them. Drawn as opponents, the two halves
   invited a comparison that means nothing.
   So the unit is the LINEUP: thirty of them on a full slate, each ranked
   against the other twenty-nine rather than against the club it happens to be
   playing, and each read as a collective — how the nine are hitting, what the
   matchup does to them, how many of them are genuinely live tonight. The
   opponent stays as one line of context: where the game is and who else is in
   it, not a wall to face. */

/** One entry per (game_pk, team) — never per team alone, which would collide
    on a doubleheader. Carries the collective read on the nine plus whichever
    arm the side is being previewed against. */
function lineups(){
  const byGame=new Map();
  for(const b of S.batters){ if(!byGame.has(b.gamePk)) byGame.set(b.gamePk,[]); byGame.get(b.gamePk).push(b); }
  const out=[];
  for(const [pk,bs] of byGame){
    const teams=[...new Set(bs.map(b=>b.team))];
    for(const t of teams){
      const tb=bs.filter(b=>b.team===t).sort((a,b)=>(a.slot||99)-(b.slot||99));
      const cands=bullpenFor(pk,t,teams), alt=cands?armFor(pk,t,cands):null;
      // Nulls are skipped rather than counted as zero — a lineup with one
      // missing trailing K% is not a lineup that strikes out less.
      const mean=f=>{ const v=tb.map(f).filter(x=>x!=null&&!isNaN(x));
                      return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
      const avg=mean(b=>pFor(b,alt));
      const sides=String(tb[0].matchup||'').split('@').map(s=>s.trim());   // "AWAY @ HOME"
      out.push({
        pk, team:t, opp:teams.find(x=>x!==t)||'', home:sides.length===2 && sides[1]===t,
        bs:tb, cands, alt, arm:tb[0], live:S.live[pk]||{},
        avg, swing: alt ? avg-mean(b=>b.p) : 0,
        base:mean(b=>b.base), delta:mean(b=>b.delta), hit:mean(b=>b.bHit), k:mean(b=>b.bK),
        strong: tb.filter(b=>tierOf(pFor(b,alt))==='hi').length,
        best: [...tb].sort((a,b)=>pFor(b,alt)-pFor(a,alt))[0],
        conf: tb.every(b=>b.confirmed), start:tb[0].startTime||'', park:tb[0].park
      });
    }
  }
  return out;
}
const LU_SORTS = [{id:'strength',label:'Strength'},{id:'time',label:'First pitch'},{id:'team',label:'Team'}];
function sortLineups(ls, how){
  const by = {
    strength: (a,b)=> (b.avg??0)-(a.avg??0),
    /* Sorting by time is the one ordering that puts the two sides of a game
       next to each other — and there it means something real, because it is
       the same first pitch, not a head-to-head. */
    time: (a,b)=> startMin(a.start)-startMin(b.start)
               || String(a.pk).localeCompare(String(b.pk))
               || (a.home?1:-1),                                  // away side first, as written
    team: (a,b)=> a.team.localeCompare(b.team)
  };
  return [...ls].sort(by[how] || by.strength);
}
/** The lineup average placed against the other lineups, the same way meter()
    places a batter against the other batters. A 61% average says nothing until
    you know the thirty of them run 52–68. */
function luMeter(v, s){
  if(v==null) return '';
  const span=(s.max-s.min)||1;
  const w=clamp((v-s.min)/span,0,1)*100, med=clamp((s.med-s.min)/span,0,1)*100;
  return `<span class="meter ${tcls(v)}" role="img"
    aria-label="${pct(v,1)} average, median lineup ${pct(s.med,1)}"><i style="width:${w.toFixed(1)}%"></i><b style="left:${med.toFixed(1)}%"></b></span>`;
}

function viewTeams(){
  const ls = lineups();
  if(!ls.length) return `${ribbon()}<div class="empty">No lineups on this slate yet.</div>`;
  const ranked=[...ls].sort((a,b)=>(b.avg??0)-(a.avg??0));
  const rankOfLu=new Map(ranked.map((l,i)=>[l.pk+'|'+l.team, i+1]));
  const avgs=ranked.map(l=>l.avg).filter(v=>v!=null).sort((a,b)=>a-b);
  const scale={min:avgs[0], max:avgs[avgs.length-1], med:avgs[Math.floor(avgs.length/2)]};

/* ── Honesty ───────────────────────────────────────────────────────── */
function reliabilitySVG(cal){
  const W=560,H=300,P=38, SPAN=CAL_HI-CAL_LO;
  const x=v=>P+(v-CAL_LO)/SPAN*(W-P-14), y=v=>H-P-(v-CAL_LO)/SPAN*(H-P-14);
  /* Drawn over the current model's range only — see MODEL_ERA. The pre-07-25
     bands used to hook this curve 15pt off the line at the bottom-left, which
     read as "the model is badly calibrated" when it was a different model. */
  const pts=cal.bands.filter(b=>b.live && b.n>=40);
  const path=pts.map((b,i)=>`${i?'L':'M'}${x(b.pred).toFixed(1)},${y(b.act).toFixed(1)}`).join('');
  const ticks=[.45,.5,.55,.6,.65,.7,.75,.8];
  // the .8 label sits exactly where the y-axis caption goes — grid it, don't label it
  const labelled=[.45,.5,.55,.6,.65,.7,.75];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reliability curve: predicted versus actual hit rate">
    ${ticks.map(t=>`<line class="grid" x1="${x(t)}" y1="${P-8}" x2="${x(t)}" y2="${H-P}"/>
                    <line class="grid" x1="${P}" y1="${y(t)}" x2="${W-14}" y2="${y(t)}"/>`).join('')}
    <line class="ideal" x1="${x(CAL_LO)}" y1="${y(CAL_LO)}" x2="${x(CAL_HI)}" y2="${y(CAL_HI)}"/>
    <path class="curve" pathLength="1" d="${path}"/>
    ${pts.map(b=>`<circle class="pt" cx="${x(b.pred)}" cy="${y(b.act)}" r="${clamp(Math.sqrt(b.n)/9,3,9).toFixed(1)}"><title>predicted ${pct(b.pred,1)} → actual ${pct(b.act,1)} (n=${b.n})</title></circle>`).join('')}
    ${labelled.map(t=>`<text x="${x(t)}" y="${H-P+15}" text-anchor="middle">${(t*100)|0}</text>
                    <text x="${P-8}" y="${y(t)+3}" text-anchor="end">${(t*100)|0}</text>`).join('')}
    <text x="${W/2}" y="${H-6}" text-anchor="middle">predicted %</text>
    <text x="0" y="${P-22}" text-anchor="start">actual %</text>
    <!-- bottom-left of the line: the curve starts at ~55, so this corner is empty -->
    <text x="${x(.472)}" y="${y(.503)}" fill="var(--ink3)">perfect</text>
  </svg>`;
}
function viewHonesty(){
  const cal=S.cal;
  if(!cal) return `<div class="empty">Loading the settled-picks record…</div>`;
  // worst band WITHIN the range the current model can produce — the old

  const worst=[...cal.bands].filter(b=>b.live && b.n>=100).sort((a,b)=>Math.abs(b.act-b.pred)-Math.abs(a.act-a.pred))[0];
  const sum=f=>cal.bands.filter(f).reduce((s,b)=>s+b.n,0);
  const deadLo=sum(b=>b.pos==='lo'), deadHi=sum(b=>b.pos==='hi');
  const recent=cal.days.slice(0,14);
  const eraNote = `<div class="truth" style="margin-top:12px">${icon(ICONS.info)}<div>The record spans two

    ${deadHi?`The <b class="num">${deadHi.toLocaleString()}</b> picks above 80% are off the top of the scale the

    <b>not</b> retired: the current model still scores there, and it is the worst-calibrated band on the page.`:''}

      <div class="scell"><div class="slab">Actual rate</div><div class="sval">${pct(cal.baseRate,1)}</div><div class="ssub">what happened</div></div>
      <div class="scell"><div class="slab">Overall gap</div><div class="sval" style="color:${Math.abs(cal.baseRate-cal.meanP)>.02?'var(--bad)':'var(--acc)'}">${((cal.baseRate-cal.meanP)*100>0?'+':'')+((cal.baseRate-cal.meanP)*100).toFixed(1)}pt</div><div class="ssub">actual − predicted</div></div>
    </div>
    <p class="muted" style="font-size:12.5px;margin-top:8px">Scoped to scores of ${pct(cal.lo,0)} and up, because

      Unscoped, the same file reads <b class="num">${cal.all.n.toLocaleString()}</b> picks,
      Brier <b class="num">${num(cal.all.brier,4)}</b>, predicted <b class="num">${pct(cal.all.meanP,1)}</b>
      vs actual <b class="num">${pct(cal.all.baseRate,1)}</b> — a
      <b class="num">${((cal.all.baseRate-cal.all.meanP)*100>0?'+':'')+((cal.all.baseRate-cal.all.meanP)*100).toFixed(1)}pt</b>
      gap that is almost entirely the retired low bands.</p>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Reliability</h2><p>A well-calibrated model sits on the dashed line. Circle size is sample size. Drawn over ${pct(CAL_LO,0)}–${pct(CAL_HI,0)} — the range the current model actually scores in.</p></div>
    <div style="padding:2px 0 0">${reliabilitySVG(cal)}
      ${worst?`<div class="truth" style="margin-top:12px">${icon(ICONS.info)}<div>Worst-calibrated band in this range: the model said
      <b class="num">${pct(worst.pred,1)}</b> and those picks landed <b class="num">${pct(worst.act,1)}</b>
      (${worst.n.toLocaleString()} picks, ${((worst.act-worst.pred)*100>0?'+':'')+((worst.act-worst.pred)*100).toFixed(1)}pt off).
      ${worst.band>=.70 ? 'The very top of the range is the thinnest sample and the least trustworthy part of the model — a high score is still the best score on the board, but it overstates itself.'
                        : 'Scores near the bottom of the range are the least trustworthy part of the model.'}</div></div>`:''}
      ${eraNote}
    </div>
  </section>
  <section class="sec">

    <tbody>${cal.bands.map(b=>{
      const gap=(b.act-b.pred)*100, w=clamp(Math.abs(gap)/12,0,1)*100;
      // Dead bands stay — this is the Honesty tab — but dimmed and labelled with
      // WHICH end they fell off, so their gap isn't read as the current model's.
      const label = b.pos==='lo' ? ['retired',"Below the current model's floor — pre-"+cal.era+" picks only"]
                  : b.pos==='hi' ? ['off-scale','Above 80% — no slate has produced one since 2026-07-18']
                  : null;
      return `<tr style="cursor:default${b.live?'':';opacity:.5'}"><td class="num">${b.pos==='hi'?pct(b.band,0)+'+':pct(b.band,0)+'–'+pct(b.band+.05,0)}
          ${label?`<span class="tag" title="${esc(label[1])}">${label[0]}</span>`:''}</td>

        <td><span class="meter" style="width:100px"><i style="width:${w}%;background:${b.live&&Math.abs(gap)>4?'var(--bad)':'var(--s3)'}"></i></span></td></tr>`;
    }).join('')}</tbody></table></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Last 14 days</h2><p>Daily predicted vs actual</p></div>
    <div class="tblwrap fit"><table><thead><tr><th>Date</th><th class="r">Picks</th><th class="r">Predicted</th><th class="r">Actual</th><th class="r">Gap</th></tr></thead>
    <tbody>${recent.map(d=>{const gap=(d.act-d.pred)*100;return `<tr style="cursor:default"><td class="num">${esc(d.date)}</td>
      <td class="r num">${d.n}</td><td class="r num">${pct(d.pred,1)}</td><td class="r num"><b>${pct(d.act,1)}</b></td>
      <td class="r num" style="color:${Math.abs(gap)>8?'var(--bad)':'var(--ink2)'}">${gap>0?'+':''}${gap.toFixed(1)}</td></tr>`;}).join('')}</tbody></table></div>
  </section>`;
}

/* ══════════════════════════════════════════════════════════════════════
   8 · drawer — the full case for one batter
   ══════════════════════════════════════════════════════════════════════ */
function waterfall(b){
  const base=b.base??b.p, d=b.delta??0, fin=b.p;
  const scale=v=>clamp((v-.3)/(.55),0,1)*100;
  const row=(lab,val,barHTML,cls='')=>`<div class="wfrow"><span class="muted">${lab}</span>${barHTML}<span class="wfval ${cls}">${val}</span></div>`;
  const dw=Math.abs(d)*100/.55*100/100*100;
  return `<div class="wf">
    ${row('Batter form', pct(base,1), `<span class="wfbar"><i style="left:0;width:${scale(base)}%;background:var(--s2)"></i></span>`)}
    ${row('Matchup', (d>0?'+':'')+(d*100).toFixed(1)+'pt',
      `<span class="wfbar"><i style="left:${Math.min(scale(base),scale(base+d))}%;width:${Math.max(.8,Math.abs(scale(base+d)-scale(base)))}%;background:${d>=0?'var(--acc)':'var(--bad)'}"></i></span>`,
      d>0?'':'')}
    ${row('Score', pct(fin,1), `<span class="wfbar"><i style="left:0;width:${scale(fin)}%;background:var(--s4)"></i></span>`)}
  </div>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Form is what he has been doing regardless of opponent; matchup is everything about tonight — this pitcher, this park, this lineup slot.</p>`;
}
/** closeDrawer defers `hidden` until the slide-out finishes. Re-opening inside
    that window used to leave the old timer running, so it fired on an
    already-open drawer: visually open, `hidden === true`. Everything that asks
    "is the drawer open?" — Escape, the arrow-key stepper, renderDrawer's
    refresh guard — then believed it was closed and stopped working. Cancel the
    pending close instead. */
let drawerTimer = null;
function openDrawer(k, list){
  const idx=(list||S.batters).findIndex(b=>key(b)===k);
  S.drawerList = list||S.batters; S.drawerIdx = idx;
  renderDrawer();
  clearTimeout(drawerTimer);
  const d=$('#drawer'); d.hidden=false; requestAnimationFrame(()=>{ d.classList.add('on'); $('#scrim').classList.add('on'); });
  document.body.style.overflow='hidden';
}
function closeDrawer(){
  const d=$('#drawer'); d.classList.remove('on'); $('#scrim').classList.remove('on');
  document.body.style.overflow='';
  clearTimeout(drawerTimer);
  drawerTimer = setTimeout(()=>{ d.hidden=true; },220);
}
function stepDrawer(n){
  const i=S.drawerIdx+n; if(i<0||i>=S.drawerList.length) return;
  S.drawerIdx=i; renderDrawer(); $('#drawer .dbody').scrollTop=0;
}
function renderDrawer(){
  const b=S.drawerList[S.drawerIdx]; if(!b) return;
  const ev=evidence(b,S.st), v=verdict(b,ev,S.st), bd=bandFor(S.cal,b.p);
  const starred=S.stars.includes(key(b));
  const log=S.pitcherLog?.[String(b.pitId).replace(/\.0$/,'')]||null;

  const evRow=e=>`<div class="evrow">
    <span class="evarrow ${e.ctx?'flat':e.dir>0?'up':e.dir<0?'down':'flat'}">${e.ctx?'·':e.dir>0?'↑':e.dir<0?'↓':'·'}</span>
    <span><span class="evlab">${esc(e.label)}${e.ctx?' <span class="tag">context</span>':''}</span>
